<meta charset="utf-8">
<title>Mitch Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============ THEME TOKENS — clean & minimal (dark default) ============ */
:root{
  --radius:14px; --radius-sm:10px;
  /* DARK is the default */
  --bg:#0f1116; --surface:#15181e; --surface-2:#1b1f27; --surface-3:#232833;
  --ink:#e9ebf0; --ink-2:#a7afbd; --ink-3:#6f7888;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --accent:#8b8cf7; --accent-bright:#a5a6ff; --accent-soft:#242647; --accent-ink:#11131a;
  --win:#43c479; --loss:#ff7a7f; --tie:#d3b34a; --neutral:#8a938a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 1px 2px rgba(0,0,0,.3),0 16px 36px -22px rgba(0,0,0,.75);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f2f3f6; --surface-3:#e9ebf0;
  --ink:#1a1d23; --ink-2:#5a6472; --ink-3:#98a1ae;
  --line:rgba(17,20,24,.08); --line-2:rgba(17,20,24,.14);
  --accent:#4f46e5; --accent-bright:#4338ca; --accent-soft:#ecebfb; --accent-ink:#ffffff;
  --win:#1f9d57; --loss:#dc4c52; --tie:#8a7a2f; --neutral:#8a938a;
  --shadow:0 1px 2px rgba(17,20,24,.05);
  --shadow-lg:0 1px 2px rgba(17,20,24,.05),0 14px 30px -18px rgba(17,20,24,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14.5px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:"DM Sans",system-ui,sans-serif;margin:0;line-height:1.14;text-wrap:balance;letter-spacing:-.02em;font-weight:600}
.mono{font-variant-numeric:tabular-nums}
svg.glyph{width:1em;height:1em;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ============ SHELL ============ */
.wrap{max-width:1120px;margin:0 auto;padding:0}
.layout{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:238px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:50}
.sb-head{display:flex;align-items:center;gap:11px;padding:17px 16px 10px}
.mark{width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:"DM Sans";font-weight:700;font-size:14px;letter-spacing:-.02em}
.sb-head h1{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-head .sub{font-size:10px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chiprow{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 10px}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.chip.gold{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sb-nav{flex:1;overflow-y:auto;padding:2px 10px 14px}
.sb-nav::-webkit-scrollbar{width:0}
.sb-group{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:13px 10px 5px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;border:none;background:none;cursor:pointer;font-family:"DM Sans",sans-serif;font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:left;transition:.12s;margin-bottom:1px}
.sb-item:hover{background:var(--surface-2);color:var(--ink)}
.sb-item.active{background:var(--accent-soft);color:var(--accent)}
.sb-item .ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-3);flex:0 0 auto}
.sb-item:hover .ic{color:var(--ink-2)}
.sb-item.active .ic{color:var(--accent)}
.sb-foot{padding:11px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.sb-foot .fresh{font-size:10px;color:var(--ink-3);line-height:1.35;min-width:0}
.sb-foot .fresh b{color:var(--ink-2);font-weight:600}
.tbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.15s;flex:0 0 auto}
.tbtn:hover{color:var(--ink);border-color:var(--line-2)}
/* content */
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topslim{display:none;position:sticky;top:0;z-index:40;align-items:center;gap:11px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hamb{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;flex:0 0 auto}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49}
main{padding:24px 24px 72px;min-height:60vh}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  body.navopen .sidebar{transform:none}
  body.navopen .sb-overlay{display:block}
  .topslim{display:flex}
  main{padding:18px 15px 70px}
}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* section head */
.shead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.shead h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.shead .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.shead .note{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.sub-h{font-family:"DM Sans";font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-2);margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:16px 18px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-teams{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

/* KPI tile */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.kpi .k-val{font-family:"DM Sans";font-weight:900;font-size:30px;letter-spacing:-.03em;margin-top:7px;line-height:1}
.kpi .k-val small{font-size:14px;font-weight:700;color:var(--ink-2)}
.kpi .k-sub{font-size:12px;color:var(--ink-2);margin-top:5px}
.kpi.hot{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.kpi.hot .k-label{color:var(--accent)}
.kpi.hot .k-val{color:var(--accent)}

/* badges / team */
.tb{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  font-family:"DM Sans";font-weight:600;font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1.5px solid var(--line-2);letter-spacing:0}
.tb.lg{width:44px;height:44px;border-radius:11px;font-size:15px}
.tb.xl{width:60px;height:60px;border-radius:14px;font-size:20px}
.teamline{display:flex;align-items:center;gap:10px;min-width:0}
.teamline .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamline .ow{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tables */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);text-align:right;
  font-family:"DM Sans";font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:first-child,tbody td:first-child{text-align:left}
thead th.no-sort{cursor:default}
thead th .ar{color:var(--accent);font-size:9px;margin-left:2px}
tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
tbody td.lead{font-weight:700}
tr.me{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
tr.me:hover{background:var(--accent-soft)}
.rankcol{color:var(--ink-3);font-weight:700;width:26px}
.rankcol.top{color:var(--accent)}
.playoff-line td{border-bottom:2px dashed var(--accent)!important}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;letter-spacing:.02em}
.pill.w{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win)}
.pill.l{background:color-mix(in srgb,var(--loss) 15%,transparent);color:var(--loss)}
.pill.t{background:color-mix(in srgb,var(--tie) 18%,transparent);color:var(--tie)}
.pill.pos{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.live{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--loss);display:inline-block;vertical-align:middle;margin-right:3px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.lowbar{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;margin-bottom:18px;border-radius:var(--radius);border:1px solid var(--line);border-left:3px solid var(--loss);background:var(--surface);padding:16px 18px;box-shadow:var(--shadow)}
.lb-main{display:flex;gap:14px;align-items:center;flex:1 1 300px;min-width:0}
.lb-ico{font-size:34px;flex:0 0 auto;line-height:1}
.lb-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--loss)}
.lb-team{font-family:"DM Sans",sans-serif;font-weight:900;font-size:clamp(22px,5vw,30px);letter-spacing:-.02em;margin-top:2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lb-score{font-family:"DM Sans",monospace;font-size:14px;font-weight:600;color:var(--ink-2)}
.lb-sub{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.lb-tally{flex:0 1 270px;border-left:1px solid var(--line);padding-left:16px}
.lb-tally-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:7px}
.lb-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2.5px 0}
.lb-row .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .amt{margin-left:auto;font-family:"DM Sans",monospace;font-weight:700;color:var(--loss);white-space:nowrap}
.lb-cta{flex-basis:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:15px;padding-top:15px;border-top:1px solid color-mix(in srgb,var(--loss) 25%,var(--line))}
.lb-cta-txt{font-family:"DM Sans",sans-serif;font-weight:800;font-size:clamp(16px,2.6vw,21px);color:var(--ink);flex:1;min-width:180px;letter-spacing:-.01em}
.lb-cta-btn{font-family:"DM Sans",sans-serif;font-weight:800;font-size:14px;padding:11px 22px;border-radius:10px;border:none;background:linear-gradient(150deg,var(--accent-bright),var(--accent));color:var(--accent-ink);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:.12s}
.lb-cta-btn:hover{filter:brightness(1.06)}
@media(max-width:560px){.lb-tally{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:12px;flex-basis:100%}}
.tag-qb{color:#c65b7c}.tag-rb{color:#2f9e5c}.tag-wr{color:#3b7dd8}.tag-te{color:#e0932f}.tag-k{color:#7b5ea7}.tag-dst{color:#8a7a2f}
.posbadge{font-family:"DM Sans";font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--line)}

/* empty state */
.empty{text-align:center;padding:44px 24px;border:1.5px dashed var(--line-2);border-radius:var(--radius);
  background:var(--surface);color:var(--ink-2)}
.empty .ico{font-size:30px;margin-bottom:9px;color:var(--ink-3);display:flex;justify-content:center}
.empty .ico svg{width:30px;height:30px;stroke-width:1.6}
.empty h3{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px}
.empty p{max-width:420px;margin:0 auto;font-size:13.5px}

/* matchup card */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.mrow .sc{margin-left:auto;font-family:"DM Sans";font-weight:600;font-size:16px;color:var(--ink-2)}
.mrow.wn .nm{font-weight:800}.mrow.wn .sc{color:var(--ink)}
.mrow.wn::before{content:"";width:3px;height:22px;background:var(--accent);border-radius:2px;margin-right:-4px}
.vs{font-family:"DM Sans";font-size:10px;font-weight:700;color:var(--ink-3);text-align:center;letter-spacing:.1em;padding:2px 0}

/* draft board */
.board{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);max-height:78vh}
.board table{font-size:11.5px;border-collapse:separate;border-spacing:0}
.board thead th{position:sticky;top:0;z-index:3;text-align:center;padding:7px 6px;min-width:104px;background:var(--surface-2)}
.board tbody th{position:sticky;left:0;z-index:2;background:var(--surface-2);text-align:center;font-family:"DM Sans";
  font-weight:800;color:var(--ink-2);padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.pick{padding:5px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;line-height:1.25}
.pick .pn{font-family:"DM Sans";font-size:9px;color:var(--ink-3)}
.pick .pl{font-weight:600;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:98px}
.pick .pp{font-size:9.5px}
.pick.me{background:var(--accent-soft)}

/* select */
.wkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:5px 10px;border-radius:6px;font-family:"DM Sans";font-weight:600;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:.12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
select{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink)}
input.txt{font-family:inherit;font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
input.txt:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font-family:"DM Sans",sans-serif;font-weight:700;font-size:13px;padding:10px 18px;border-radius:9px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-bright)}
.btn:disabled{opacity:.5;cursor:default}
.fieldlbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);display:block;margin-bottom:4px}

/* bars */
.barrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.barrow .bl{width:118px;flex:0 0 auto;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrk{flex:1;height:9px;background:var(--surface-2);border-radius:100px;overflow:hidden}
.barfil{height:100%;border-radius:100px;background:var(--accent);opacity:.9}
.barrow .bv{width:52px;text-align:right;font-family:"DM Sans";font-size:12px;color:var(--ink-2)}

/* misc */
.metricnote{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dotc{width:9px;height:9px;border-radius:3px}
.helpbox{background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 16px;font-size:13px;color:var(--ink-2);display:flex;gap:11px;align-items:flex-start}
.helpbox b{color:var(--ink)}
.helpbox .hi{font-size:18px;flex:0 0 auto;color:var(--accent);display:inline-flex;align-items:center}
.helpbox .hi svg{width:18px;height:18px}
.matrix{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.matrix table{font-size:11px}
.matrix td,.matrix th{text-align:center;padding:6px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.matrix .diag{background:var(--surface-3)}
.foot{text-align:center;color:var(--ink-3);font-size:12px;padding:26px 0 0;line-height:1.6}
.foot b{color:var(--ink-2)}
/* live-update toast */
.toast{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-size:13px;font-weight:600;
  padding:10px 15px;border-radius:10px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);
  pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:none}
@media(max-width:640px){
  .league-id h1{font-size:15px}.chiprow{display:none}
  .shead h2{font-size:20px}.kpi .k-val{font-size:25px}
  .fresh{display:none}
}
</style>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="mark" id="mark">MFL</div>
      <div style="min-width:0"><h1 id="lgname">League</h1><div class="sub" id="lgsub">—</div></div>
    </div>
    <div class="chiprow" id="chips"></div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="fresh" id="fresh"></div>
      <button class="tbtn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </aside>
  <div class="sb-overlay" id="sbOverlay"></div>
  <div class="content">
    <header class="topslim">
      <button class="hamb" id="hamb" aria-label="Open menu"></button>
      <div class="mark" style="width:30px;height:30px;font-size:12px">MFL</div>
      <strong id="lgnameM" style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:15px">Mitch Fantasy League</strong>
    </header>
    <main><div class="wrap" id="app"></div></main>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://tcaqsuqoiinnmvmmojth.supabase.co","sb_publishable_dY9khbDJVWUnh6XfnBEf1w_Thn3r9t_");
let __LD=null;
try{const r=await sb.from("league_data").select("data").eq("id","current").single();__LD=r.data&&r.data.data;}catch(e){console.error("load",e);}
const __app=document.getElementById("app");
if(!__LD){__app.innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--ink-2)">Couldn\'t load league data — please refresh.</div>';}
else{

function initials(t){
  const n=(t.abbrev||t.name||"").replace(/[^A-Za-z0-9 ]/g,"").trim();
  if(t.abbrev && /[A-Za-z]/.test(t.abbrev)) return t.abbrev.replace(/[^A-Za-z0-9]/g,"").slice(0,3).toUpperCase();
  const w=n.split(/\s+/).filter(Boolean);
  return ((w[0]||"?")[0]+(w[1]?w[1][0]:(w[0]||"?")[1]||"")).toUpperCase();
}

/* ---------- stat engine ---------- */
function computeStats(){
  const N=D.teams.length;
  const played=D.schedule.filter(m=>m.winner && m.winner!=="UNDECIDED");
  const weeks=[...new Set(played.map(m=>m.week))].sort((a,b)=>a-b);
  const S={};
  D.teams.forEach(t=>{S[t.id]={id:t.id,team:t,w:0,l:0,tie:0,pf:0,pa:0,scores:[],weekly:{},opp:{},
    results:[],aw:0,al:0,at:0,expW:0,aboveMed:0,close_w:0,close_l:0,blowW:0,blowL:0,margins:[]};});
  // per-matchup
  played.forEach(m=>{
    const h=S[m.homeTeamId], a=S[m.awayTeamId];
    if(!h||!a) return;
    h.pf+=m.homeScore; h.pa+=m.awayScore; a.pf+=m.awayScore; a.pa+=m.homeScore;
    h.scores.push(m.homeScore); a.scores.push(m.awayScore);
    h.weekly[m.week]=m.homeScore; a.weekly[m.week]=m.awayScore;
    h.opp[m.week]=m.awayTeamId; a.opp[m.week]=m.homeTeamId;
    const mg=m.homeScore-m.awayScore, am=Math.abs(mg);
    h.margins.push(mg); a.margins.push(-mg);
    let hr,ar;
    if(m.winner==="HOME"||(m.winner!=="TIE"&&mg>0)){h.w++;a.l++;hr="W";ar="L";}
    else if(m.winner==="AWAY"||(m.winner!=="TIE"&&mg<0)){a.w++;h.l++;hr="L";ar="W";}
    else{h.tie++;a.tie++;hr="T";ar="T";}
    h.results.push({wk:m.week,r:hr,pf:m.homeScore,pa:m.awayScore,opp:m.awayTeamId});
    a.results.push({wk:m.week,r:ar,pf:m.awayScore,pa:m.homeScore,opp:m.homeTeamId});
    if(am<=10){if(hr==="W"){h.close_w++;a.close_l++;}else if(hr==="L"){h.close_l++;a.close_w++;}}
    if(am>=40){if(hr==="W"){h.blowW++;a.blowL++;}else if(hr==="L"){h.blowL++;a.blowW++;}}
  });
  // all-play + expected wins + above median (per week)
  weeks.forEach(wk=>{
    const scs=played.filter(m=>m.week===wk).flatMap(m=>[[m.homeTeamId,m.homeScore],[m.awayTeamId,m.awayScore]]);
    const vals=scs.map(x=>x[1]).sort((a,b)=>a-b);
    const med=vals.length?(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2):0;
    scs.forEach(([id,sc])=>{
      let beat=0,lostto=0,tied=0;
      scs.forEach(([id2,sc2])=>{if(id2===id)return; if(sc>sc2)beat++;else if(sc<sc2)lostto++;else tied++;});
      const st=S[id]; if(!st)return;
      st.aw+=beat; st.al+=lostto; st.at+=tied;
      const denom=(scs.length-1)||1; st.expW+=beat/denom;
      if(sc>med) st.aboveMed++;
    });
  });
  // derived
  Object.values(S).forEach(s=>{
    const g=s.w+s.l+s.tie;
    s.gp=g; s.pct=g?(s.w+s.tie*0.5)/g:0;
    s.ppg=g?s.pf/g:0; s.papg=g?s.pa/g:0;
    s.hi=s.scores.length?Math.max(...s.scores):null;
    s.lo=s.scores.length?Math.min(...s.scores):null;
    s.avg=s.scores.length?s.scores.reduce((a,b)=>a+b,0)/s.scores.length:0;
    s.std=s.scores.length>1?Math.sqrt(s.scores.reduce((a,b)=>a+(b-s.avg)**2,0)/s.scores.length):0;
    s.cv=s.avg?s.std/s.avg*100:0;
    s.apPct=(s.aw+s.al+s.at)?(s.aw+s.at*0.5)/(s.aw+s.al+s.at):0;
    s.luck=s.w-s.expW;
    s.avgMargin=s.margins.length?s.margins.reduce((a,b)=>a+b,0)/s.margins.length:0;
    // streak
    let st=0,ty="";
    for(let i=s.results.length-1;i>=0;i--){const r=s.results[i].r;if(i===s.results.length-1){ty=r;st=1;}else if(r===ty)st++;else break;}
    s.streak=s.results.length?ty+st:"—";
  });
  // strength of schedule (avg opp ppg over all opponents faced)
  Object.values(S).forEach(s=>{
    const ops=s.results.map(r=>S[r.opp]).filter(Boolean);
    s.sos=ops.length?ops.reduce((a,o)=>a+o.ppg,0)/ops.length:0;
  });
  return {S,played,weeks,N,started:played.length>0};
}
let ST = computeStats();

/* ---------- power ranking ---------- */
function powerRanks(){
  const arr=Object.values(ST.S);
  if(!ST.started){
    // preseason: use ESPN draft-day projected rank (1=best)
    return D.teams.map(t=>({team:t,score:null,proj:t.draftProjRank||99}))
      .sort((a,b)=>a.proj-b.proj).map((x,i)=>({...x,rank:i+1}));
  }
  const maxPpg=Math.max(...arr.map(s=>s.ppg),1);
  const scored=arr.map(s=>{
    const recent=s.results.slice(-3);
    const rf=recent.length?recent.reduce((a,r)=>a+r.pf,0)/recent.length:s.ppg;
    const power=s.pct*100*0.40 + (s.ppg/maxPpg)*100*0.30 + s.apPct*100*0.18 + (rf/maxPpg)*100*0.12;
    return {team:s.team,score:power,s};
  }).sort((a,b)=>b.score-a.score);
  return scored.map((x,i)=>({...x,rank:i+1}));
}

let cur="dash";
function setTab(id){
  // re-rendering the SAME view (sort, dropdown, week switch) keeps your scroll
  // position; only navigating to a DIFFERENT view jumps back to the top.
  const sameView=(id===cur);
  const keepY=sameView?(window.scrollY||document.documentElement.scrollTop||0):0;
  cur=id; renderNav();
  document.body.classList.remove("navopen");
  const el=document.getElementById("app"); el.innerHTML=""; el.appendChild(VIEWS[id]());
  window.scrollTo({top:keepY,behavior:"instant"});
}
function renderNav(){
  document.getElementById("nav").innerHTML=NAV.map(g=>
    `<div class="sb-group">${g[0]}</div>`+g[1].map(it=>
      `<button class="sb-item ${it[0]===cur?"active":""}" data-t="${it[0]}"><span class="ic">${icon(it[2])}</span>${it[1]}</button>`).join("")
  ).join("");
  document.querySelectorAll(".sb-item").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
}

function mstate(x){
  const played=x.winner&&x.winner!=="UNDECIDED";
  const live=!played && D.meta.liveWeek===x.week && ((x.homeLive||0)>0||(x.awayLive||0)>0);
  const hs=played?x.homeScore:(live?x.homeLive:null), as=played?x.awayScore:(live?x.awayLive:null);
  return {played,live,show:played||live,hs,as,
    hw:played?(x.winner==="HOME"||x.homeScore>x.awayScore):(live&&hs>as),
    aw:played?(x.winner==="AWAY"||x.awayScore>x.homeScore):(live&&as>hs)};
}
/* ---- weekly low-score tax ---- */
const TAX=10;
function lowScorers(){
  const byWeek={};
  ST.played.forEach(m=>{(byWeek[m.week]=byWeek[m.week]||[]).push([m.homeTeamId,m.homeScore]);byWeek[m.week].push([m.awayTeamId,m.awayScore]);});
  const weeks=Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  const count={}, perWeek=[];
  weeks.forEach(w=>{let lo=null;byWeek[w].forEach(s=>{if(!lo||s[1]<lo[1])lo=s;});perWeek.push({week:w,tid:lo[0],score:lo[1]});count[lo[0]]=(count[lo[0]]||0)+1;});
  return {perWeek,count,weeks};
}
function lowBanner(){
  if(!ST.started) return "";
  const L=lowScorers();
  const last=L.perWeek[L.perWeek.length-1]; const tm=teamById[last.tid]; if(!tm) return "";
  const tally=Object.entries(L.count).map(([tid,c])=>({tid:+tid,c,amt:c*TAX})).sort((a,b)=>b.amt-a.amt||a.tid-b.tid);
  const myC=L.count[MEID]||0;
  const rows=tally.map(t=>{const tt=teamById[t.tid];return tt?`<div class="lb-row">${badge(tt)}<span class="nm2">${esc(tt.name)}</span><span class="amt">$${t.amt}<span style="color:var(--ink-3);font-weight:400;font-size:11px"> · ${t.c}×</span></span></div>`:"";}).join("");
  return `<div class="lowbar">
    <div class="lb-main"><div class="lb-ico" style="color:var(--loss);font-size:30px">${icon("dollar")}</div><div style="min-width:0">
      <div class="lb-label">Week ${last.week} low scorer — pays $${TAX} on this week's 12-leg parlay</div>
      <div class="lb-team">${esc(tm.name)}<span class="lb-score">${fmt(last.score,1)} pts</span></div>
      <div class="lb-sub">${esc(tm.owner)}</div>
    </div></div>
    <div class="lb-tally"><div class="lb-tally-h">Paid This Season <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)">$10 per weekly low</span></div>${rows||'<div style="font-size:12px;color:var(--ink-3)">Nobody taxed yet</div>'}</div>
    <div class="lb-cta"><div class="lb-cta-txt">Get your Week ${D.meta.currentScoringPeriod||(last.week+1)} parlay pick in!</div><button class="lb-cta-btn" data-goto="parlay">Enter your pick</button></div>
  </div>`;

    html+=`<div class="grid g-kpi">
      ${kpiHot("1st Place",leader.team.name,rec(leader)+" · "+fmt(leader.pf,0)+" PF")}
      ${kpi("Most Points",fmt(mostPF.pf,0),mostPF.team.name)}

      ${kpi("Last Place",cellar.team.name,rec(cellar)+" · "+fmt(cellar.pf,0)+" PF")}
    </div>`;
  } else {
    html+=`<div class="grid g-kpi">
      ${kpi("Teams",m.size,"12-team league")}
      ${kpi("Format",m.ppr+" PPR",m.scoringType==="H2H_POINTS"?"Head-to-head points":"")}
      ${kpi("Regular season",m.regularSeasonWeeks+" wks",m.playoffTeamCount+" make playoffs")}
      ${kpi("Playoff teams",m.playoffTeamCount,"top "+m.playoffTeamCount+" by record")}
    </div>`;
  }
  // two-col: power/proj preview + week1
  html+=`<div class="grid g-2" style="margin-top:16px">`;
  // projected standings
  html+=`<div class="card card-p"><div class="sub-h" style="margin-top:0">${ST.started?"Power Rankings":"Projected Finish"} <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--ink-3)">${ST.started?"":"ESPN draft-day projection"}</span></div>`;
  pr.slice(0,12).forEach(r=>{
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)">
      <span class="rankcol ${r.rank<=3?"top":""}" style="width:20px">${r.rank}</span>${teamLine(r.team)}
      <span class="mono" style="margin-left:auto;color:var(--ink-2);font-size:12.5px">${r.score!=null?fmt(r.score,1):"proj"}</span></div>`;
  });
  html+=`</div>`;
  // week 1 matchups
  html+=`<div class="card card-p"><div class="sub-h" style="margin-top:0">Week ${focusWk} Matchups${D.meta.liveWeek===focusWk?' <span class="pill live" style="margin-left:auto"><span class="livedot"></span>LIVE</span>':""}</div>`;
  wk1.forEach(x=>{ html+=matchupMini(x); });
  html+=`</div></div>`;
  const v=el(html);
  v.querySelectorAll("[data-goto]").forEach(a=>a.onclick=()=>setTab(a.dataset.goto));
  return v;
};
function kpi(l,v,s){return `<div class="kpi"><div class="k-label">${l}</div><div class="k-val num">${esc(v)}</div><div class="k-sub">${esc(s)}</div></div>`;}
function kpiHot(l,v,s){return `<div class="kpi hot"><div class="k-label">${l}</div><div class="k-val" style="font-size:20px;margin-top:9px">${esc(v)}</div><div class="k-sub">${esc(s)}</div></div>`;}
function matchupMini(x){
  const h=teamById[x.homeTeamId],a=teamById[x.awayTeamId];if(!h||!a)return"";
  const s=mstate(x);
  return `<div style="padding:7px 0;border-bottom:1px solid var(--line)">
    <div class="mrow ${s.aw?"wn":""}" style="padding:2px 0">${badge(a)}<span class="nm" style="font-size:13px">${esc(a.name)}</span><span class="sc">${s.show?fmt(s.as,1):""}</span></div>
    <div class="mrow ${s.hw?"wn":""}" style="padding:2px 0">${badge(h)}<span class="nm" style="font-size:13px">${esc(h.name)}</span><span class="sc">${s.show?fmt(s.hs,1):'<span class="vs">VS</span>'}</span></div></div>`;
}

/* ---- STANDINGS ---- */
let standSort={key:"pct",dir:-1};
VIEWS.standings=function(){
  let html=shead("Regular Season","Standings",ST.started?"Click a column to sort":"Records populate after Week 1");
  if(!ST.started){
    html+=`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("bars")}</span><div>Everyone starts <b>0–0</b>. Once I pull Week&nbsp;1 results, this table ranks by record, points for/against, and streak — with the playoff cut line after the top ${D.meta.playoffTeamCount}.</div></div>`;
  }
  const rows=Object.values(ST.S);
  const cols=[["team","Team",0],["w","W",1],["l","L",1],["tie","T",1],["pct","PCT",1],["pf","PF",1],["pa","PA",1],["ppg","PPG",1],["papg","PA/G",1],["streak","STRK",0],["luck","LUCK",1]];
  rows.sort((a,b)=>{
    let k=standSort.key,va=a[k],vb=b[k];
    if(k==="streak"){va=streakNum(a);vb=streakNum(b);}
    if(k==="team"){va=a.team.name.toLowerCase();vb=b.team.name.toLowerCase();return va<vb?-standSort.dir:va>vb?standSort.dir:0;}
    const primary=(va-vb)*standSort.dir;
    if(primary!==0) return primary;
    return b.pf-a.pf;   // tiebreaker: total points scored (season PF), higher ranks higher
  });
  if(!ST.started) rows.sort((a,b)=>(a.team.draftProjRank||99)-(b.team.draftProjRank||99));
  html+=`<div class="twrap"><table><thead><tr><th class="no-sort">#</th>`+
    cols.map(c=>`<th data-k="${c[0]}">${c[1]}${standSort.key===c[0]?` <span class="ar">${standSort.dir<0?"▼":"▲"}</span>`:""}</th>`).join("")+`</tr></thead><tbody>`;
  rows.forEach((s,i)=>{
    const isCut=ST.started&&i===D.meta.playoffTeamCount-1;
    html+=`<tr class="${s.id===MEID?"me":""} ${isCut?"playoff-line":""}">
      <td class="rankcol ${i<3?"top":""}">${i+1}</td>
      <td>${teamLine(s.team)}</td>
      <td class="lead num">${s.w}</td><td class="num">${s.l}</td><td class="num">${s.tie}</td>
      <td class="num">${ST.started?fmt(s.pct,3).replace(/^0/,""):"—"}</td>
      <td class="num">${ST.started?fmt(s.pf,1):"—"}</td><td class="num">${ST.started?fmt(s.pa,1):"—"}</td>
      <td class="num">${ST.started?fmt(s.ppg,1):"—"}</td><td class="num">${ST.started?fmt(s.papg,1):"—"}</td>
      <td>${ST.started?streakPill(s.streak):"—"}</td>
      <td class="num" style="color:${s.luck>0?"var(--win)":s.luck<0?"var(--loss)":"var(--ink-2)"}">${ST.started?(s.luck>0?"+":"")+fmt(s.luck,1):"—"}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=`<div class="metricnote"><b>Ranked by record, then total points (PF) as the tiebreaker.</b> <b>PCT</b> win % (ties½). <b>PF/PA</b> total points for/against. <b>LUCK</b> = actual wins minus expected wins (based on how each team's weekly score ranked league-wide) — positive means a team has won more than its scoring "deserved".</div>`;
  const v=el(html);
  v.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(standSort.key===k)standSort.dir*=-1;else{standSort.key=k;standSort.dir=(k==="team")?1:-1;}setTab("standings");});
  return v;
};
function streakNum(s){if(!s.streak||s.streak==="—")return 0;const n=parseInt(s.streak.slice(1))||0;return s.streak[0]==="W"?n:-n;}
function streakPill(str){if(!str||str==="—")return"—";const t=str[0];return `<span class="pill ${t==="W"?"w":t==="L"?"l":"t"}">${str}</span>`;}

/* ---- POWER ---- */
VIEWS.power=function(){
  const pr=powerRanks();
  let html=shead("Composite Rating","Power Rankings",ST.started?"":"Preseason projection");
  if(!ST.started){
    html+=`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("zap")}</span><div>Before games are played, this shows ESPN's <b>draft-day projected finish</b>. Once the season starts, it switches to a live composite rating — explained below.</div></div>`;
  } else {
    html+=`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("zap")}</span><div><b>How the rating works:</b> a 0&ndash;100 composite that blends four factors, so no team can ride a soft schedule or one big week to the top:<br>
      &bull; <b>40% &mdash; Win record:</b> actual winning percentage (W&#8209;L).<br>
      &bull; <b>30% &mdash; Scoring:</b> points per game, scaled against the league's top scorer.<br>
      &bull; <b>18% &mdash; All&#8209;play strength:</b> your record if you played every other team every week &mdash; rewards teams the schedule has treated unfairly.<br>
      &bull; <b>12% &mdash; Recent form:</b> average points over the last 3 weeks (who's hot right now).</div></div>`;
  }
  const maxScore=Math.max(...pr.map(r=>r.score||0),1);
  html+=`<div class="grid" style="gap:9px">`;
  pr.forEach(r=>{
    const s=ST.S[r.team.id];
    const w=r.score!=null?(r.score/maxScore*100):(100-(r.proj-1)/11*70);
    html+=`<div class="card card-p" style="display:flex;align-items:center;gap:14px;padding:12px 16px">
      <div style="font-family:'DM Sans';font-weight:900;font-size:22px;width:30px;text-align:center;color:${r.rank<=3?"var(--accent)":"var(--ink-3)"}">${r.rank}</div>
      ${badge(r.team,"lg")}
      <div style="min-width:0;flex:1">
        <div class="nm" style="font-weight:800;font-size:15px">${esc(r.team.name)}</div>
        <div class="ow" style="font-size:12px">${esc(r.team.owner)}${ST.started&&s?` · ${s.w}-${s.l}${s.tie?"-"+s.tie:""} · ${fmt(s.ppg,1)} PPG`:` · proj #${r.proj}`}</div>
      </div>
      <div style="width:36%;max-width:230px"><div class="bartrk"><div class="barfil" style="width:${Math.max(6,w)}%"></div></div></div>
      <div class="mono" style="width:52px;text-align:right;font-weight:600">${r.score!=null?fmt(r.score,0):"—"}</div>
    </div>`;
  });
  html+=`</div>`;
  return el(html);
};

/* ---- SCOREBOARD ---- */
let curWeek=(D.meta.liveWeek||(ST.started?Math.max(...ST.weeks):1));
VIEWS.scoreboard=function(){
  const weeks=[];for(let i=1;i<=D.meta.regularSeasonWeeks;i++)weeks.push(i);
  const isLiveWk=D.meta.liveWeek===curWeek;
  let html=shead("Weekly Results","Scoreboard",isLiveWk?'<span class="pill live"><span class="livedot"></span>LIVE · Week '+curWeek+'</span>':"");
  html+=`<div class="wkbar"><span style="font-size:12px;color:var(--ink-3);font-weight:600">WEEK</span><div class="seg" id="wkseg">`+
    weeks.map(w=>`<button class="${w===curWeek?"on":""}" data-w="${w}">${w}${w===D.meta.liveWeek?"•":""}</button>`).join("")+`</div></div>`;
  const games=D.schedule.filter(x=>x.week===curWeek);
  const anyShown=games.some(g=>mstate(g).show);
  html+=`<div class="grid g-2">`;
  games.forEach(x=>{
    const h=teamById[x.homeTeamId],a=teamById[x.awayTeamId];if(!h||!a)return;
    const s=mstate(x);
    const foot=s.live?`<span style="color:var(--loss);font-weight:700"><span class="livedot"></span>LIVE · in progress</span><span>Margin ${fmt(Math.abs(s.hs-s.as),1)}</span>`
      :s.played?`<span>${fmt(x.homeScore+x.awayScore,1)} total</span><span>Margin ${fmt(Math.abs(x.homeScore-x.awayScore),1)}</span>`
      :`<span>Not yet played</span><span></span>`;
    html+=`<div class="mcard">
      <div class="mrow ${s.aw?"wn":""}">${badge(a,"lg")}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="ow" style="font-size:11px;color:var(--ink-3)">${esc(a.owner)}</div></div><span class="sc">${s.show?fmt(s.as,1):"—"}</span></div>
      <div class="mrow ${s.hw?"wn":""}">${badge(h,"lg")}<div style="min-width:0"><div class="nm">${esc(h.name)}</div><div class="ow" style="font-size:11px;color:var(--ink-3)">${esc(h.owner)}</div></div><span class="sc">${s.show?fmt(s.hs,1):"—"}</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)">${foot}</div>
    </div>`;
  });
  html+=`</div>`;
  if(!anyShown) html+=`<div style="margin-top:16px">${emptyState("calendar","Week "+curWeek+" hasn't kicked off","Matchups are set from the schedule. Live scores appear here once the week's games are underway.")}</div>`;
  else if(isLiveWk) html+=`<div class="metricnote"><span class="livedot"></span>Live totals update as games are played. The winner, standings, and analytics lock in when Week ${curWeek} finalizes (Tuesday) — in-progress scores don't count toward the record yet.</div>`;
  const v=el(html);
  v.querySelectorAll("#wkseg button").forEach(b=>b.onclick=()=>{curWeek=+b.dataset.w;setTab("scoreboard");});

};

      <div style="display:flex;align-items:center;gap:12px">${badge(t,"lg")}
        <div style="min-width:0"><div class="nm" style="font-weight:800">${esc(t.name)}</div><div class="ow">${esc(t.owner)}</div></div></div>
      <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
        ${ST.started&&s?`<span class="pill pos">${s.w}-${s.l}${s.tie?"-"+s.tie:""}</span><span class="pill pos">${fmt(s.ppg,1)} PPG</span>`:`<span class="pill pos">Proj #${t.draftProjRank||"—"}</span>`}

    c.onmouseenter=()=>c.style.borderColor="var(--line-2)";c.onmouseleave=()=>c.style.borderColor="";});

function showTeam(id,v){
  const t=teamById[id],s=ST.S[id],r=(D.rosters[id]||[]);
  const picks=D.draft.filter(p=>p.teamId===id).sort((a,b)=>a.overall-b.overall);
  const order={QB:0,RB:1,WR:2,TE:3,FLEX:4,K:5,DST:6,BE:7,IR:8};
  const starters=r.filter(p=>p.slot!=="BE"&&p.slot!=="IR");
  const bench=r.filter(p=>p.slot==="BE"||p.slot==="IR");
  const sortR=a=>a.slice().sort((x,y)=>(order[x.slot]??9)-(order[y.slot]??9));
  let h=`<div class="sub-h" id="tdh">${esc(t.name)} · Detail</div>`;
  h+=`<div class="card card-p" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
     ${badge(t,"xl")}<div><div style="font-family:'DM Sans';font-weight:900;font-size:22px">${esc(t.name)}</div>
     <div class="ow" style="font-size:13px">${esc(t.owner)} · ${esc(t.abbrev)}</div></div>
     <div style="margin-left:auto;display:flex;gap:22px;text-align:center">
       ${tstat(ST.started?`${s.w}-${s.l}${s.tie?"-"+s.tie:""}`:"0-0","Record")}
       ${tstat(ST.started?fmt(s.pf,1):"—","Points For")}
       ${tstat(ST.started?fmt(s.ppg,1):"—","PPG")}
       ${tstat(ST.started?streakBare(s.streak):"—","Streak")}
     </div></div>`;
  h+=`<div class="grid g-2" style="margin-top:14px">`;
  // roster
  h+=`<div class="card card-p"><div class="sub-h" style="margin-top:0">Roster <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">${r.length} players</span></div>`;
  h+=`<div style="font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin:2px 0 4px">Starters</div>`;
  sortR(starters).forEach(p=>h+=rosterRow(p));
  if(bench.length){h+=`<div style="font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px">Bench / IR</div>`;sortR(bench).forEach(p=>h+=rosterRow(p));}
  h+=`</div>`;
  // draft + schedule
  h+=`<div><div class="card card-p"><div class="sub-h" style="margin-top:0">Draft Picks <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">${picks.length}</span></div>`;
  picks.forEach(p=>h+=`<div style="display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line)">
    <span class="mono" style="color:var(--ink-3);font-size:11px;width:34px">${p.round}.${String(p.pickInRound).padStart(2,"0")}</span>
    <span class="posbadge tag-${p.pos.toLowerCase()}">${p.pos}</span>
    <span style="font-weight:600;font-size:13px">${esc(p.name)}</span>
    <span style="margin-left:auto;color:var(--ink-3);font-size:11px">${esc(p.proTeam)}</span></div>`);
  h+=`</div>`;
  // schedule
  h+=`<div class="card card-p" style="margin-top:14px"><div class="sub-h" style="margin-top:0">Schedule</div>`;
  D.schedule.filter(x=>x.homeTeamId===id||x.awayTeamId===id).sort((a,b)=>a.week-b.week).forEach(x=>{
    const home=x.homeTeamId===id;const oppT=teamById[home?x.awayTeamId:x.homeTeamId];if(!oppT)return;
    const played=x.winner&&x.winner!=="UNDECIDED";
    const my=home?x.homeScore:x.awayScore,op=home?x.awayScore:x.homeScore;
    const res=played?(my>op?"W":my<op?"L":"T"):"";
    h+=`<div style="display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px">
      <span class="mono" style="color:var(--ink-3);width:30px">W${x.week}</span>
      <span style="color:var(--ink-3);width:16px">${home?"vs":"@"}</span>${badge(oppT)}
      <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(oppT.name)}</span>
      <span style="margin-left:auto" class="mono">${played?fmt(my,1)+"–"+fmt(op,1):""}</span>
      ${played?`<span class="pill ${res==="W"?"w":res==="L"?"l":"t"}" style="width:20px;justify-content:center">${res}</span>`:`<span class="pill pos">—</span>`}</div>`;
  });
  h+=`</div></div></div>`;
  const dd=v.querySelector("#teamDetail");dd.innerHTML=h;dd.scrollIntoView({behavior:"smooth",block:"start"});
}
function tstat(v,l){return `<div><div style="font-family:'DM Sans';font-weight:900;font-size:19px">${esc(v)}</div><div style="font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">${l}</div></div>`;}
function streakBare(str){return (!str||str==="—")?"—":str;}
function rosterRow(p){return `<div style="display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--line)">
  <span class="posbadge" style="width:34px;text-align:center">${esc(p.slot)}</span>
  <span class="posbadge tag-${(p.pos||"").toLowerCase()}">${esc(p.pos)}</span>
  <span style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
  ${p.injury&&p.injury!=="ACTIVE"&&p.injury!=="NORMAL"?`<span class="pill l" style="font-size:9px">${esc(p.injury.slice(0,3))}</span>`:""}
  <span style="margin-left:auto;color:var(--ink-3);font-size:11px">${esc(p.proTeam)}</span></div>`;}

/* ---- DRAFT ---- */
let draftMode="board";
VIEWS.draft=function(){
  let html=shead("2026 Draft","Draft Room",`${D.draft.length} picks · snake`);
  html+=`<div class="wkbar"><div class="seg">
    <button class="${draftMode==="board"?"on":""}" data-m="board">Board</button>
    <button class="${draftMode==="team"?"on":""}" data-m="team">By Team</button>
    <button class="${draftMode==="pos"?"on":""}" data-m="pos">By Position</button></div></div>`;
  if(draftMode==="board") html+=draftBoard();
  else if(draftMode==="team") html+=draftByTeam();
  else html+=draftByPos();
  const v=el(html);
  v.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{draftMode=b.dataset.m;setTab("draft");});
  return v;
};
function draftBoard(){
  const rounds=Math.max(...D.draft.map(p=>p.round));
  // order teams by round-1 pick order
  const r1=D.draft.filter(p=>p.round===1).sort((a,b)=>a.pickInRound-b.pickInRound);
  const teamOrder=r1.map(p=>p.teamId);
  const byRT={};D.draft.forEach(p=>{byRT[p.round+"_"+p.teamId]=p;});
  let h=`<div class="board"><table><thead><tr><th style="left:0;position:sticky;z-index:4">RD</th>`;
  teamOrder.forEach(tid=>{const t=teamById[tid];h+=`<th>${badge(t)}<div style="font-size:9px;margin-top:2px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px">${esc(t.abbrev||t.name)}</div></th>`;});
  h+=`</tr></thead><tbody>`;
  for(let r=1;r<=rounds;r++){
    h+=`<tr><th>${r}</th>`;
    // snake: even rounds reverse
    const ord=r%2===1?teamOrder:[...teamOrder].reverse();
    // but keep columns aligned to teamOrder; fill by team
    teamOrder.forEach(tid=>{
      const p=byRT[r+"_"+tid];
      if(!p){h+=`<td class="pick"></td>`;return;}
      h+=`<td class="pick ${tid===MEID?"me":""}"><span class="pn">${p.overall}</span>
        <span class="pl">${esc(p.name)}</span>
        <span class="pp posbadge tag-${p.pos.toLowerCase()}" style="border:none;background:none;padding:0">${p.pos} · ${esc(p.proTeam)}</span></td>`;
    });
    h+=`</tr>`;
  }
  h+=`</tbody></table></div><div class="metricnote">Snake draft, ${rounds} rounds. Columns are teams in Round&nbsp;1 pick order.</div>`;
  return h;
}
function draftByTeam(){
  const r1=D.draft.filter(p=>p.round===1).sort((a,b)=>a.pickInRound-b.pickInRound);
  let h=`<div class="grid g-teams">`;
  r1.map(p=>p.teamId).forEach(tid=>{

    ps.forEach(p=>h+=`<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px">

      <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
      <span style="margin-left:auto;color:var(--ink-3);font-size:10.5px">${esc(p.proTeam)}</span></div>`);

function draftByPos(){

      <span style="font-size:12px;color:var(--ink-3)">${picks.length} drafted · first at ${picks[0].overall}</span></div>`;
    picks.slice(0,12).forEach(p=>h+=`<div style="display:flex;gap:8px;padding:2px 0;font-size:12.5px">

/* ---- ANALYTICS ---- */
VIEWS.analytics=function(){
  let html=shead("Advanced Metrics","Analytics");
  if(!ST.started) return el(html+`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("line")}</span><div>The analytics suite computes from weekly scores. Here's what unlocks after Week&nbsp;1:</div></div>`+analyticsPreview());
  const rows=Object.values(ST.S);
  // Luck
  html+=`<div class="sub-h" style="margin-top:6px">Luck Index <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">actual wins − expected wins</span></div>`;
  html+=barChart(rows.slice().sort((a,b)=>b.luck-a.luck),s=>s.luck,s=>(s.luck>0?"+":"")+fmt(s.luck,1),true);
  // All-play
  html+=`<div class="sub-h">All-Play Record <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">if you played everyone every week</span></div>`;
  html+=`<div class="twrap"><table><thead><tr><th>Team</th><th>All-Play W</th><th>L</th><th>T</th><th>All-Play %</th><th>Actual %</th><th>Δ</th></tr></thead><tbody>`;
  rows.slice().sort((a,b)=>b.apPct-a.apPct).forEach(s=>{
    const d=s.apPct-s.pct;
    html+=`<tr class="${s.id===MEID?"me":""}"><td>${teamLine(s.team)}</td><td class="lead num">${s.aw}</td><td class="num">${s.al}</td><td class="num">${s.at}</td>
      <td class="num">${fmt(s.apPct*100,1)}%</td><td class="num">${fmt(s.pct*100,1)}%</td>
      <td class="num" style="color:${d>0?"var(--win)":d<0?"var(--loss)":"var(--ink-2)"}">${(d>0?"+":"")+fmt(d*100,1)}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  // consistency + SoS
  html+=`<div class="grid g-2" style="margin-top:8px">`;
  html+=`<div class="card card-p"><div class="sub-h" style="margin-top:0">Consistency <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">lower = steadier</span></div>`;
  rows.slice().sort((a,b)=>a.std-b.std).forEach(s=>html+=miniBar(s.team,s.std,Math.max(...rows.map(r=>r.std),1),fmt(s.std,1)));
  html+=`</div>`;
  html+=`<div class="card card-p"><div class="sub-h" style="margin-top:0">Strength of Schedule <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">avg opponent PPG</span></div>`;
  rows.slice().sort((a,b)=>b.sos-a.sos).forEach(s=>html+=miniBar(s.team,s.sos,Math.max(...rows.map(r=>r.sos),1),fmt(s.sos,1)));
  html+=`</div></div>`;
  // ---- extra metrics table ----
  html+=`<div class="sub-h">More Metrics</div><div class="twrap"><table><thead><tr><th class="no-sort">Team</th><th class="no-sort">Pts&gt;Med</th><th class="no-sort">Close ≤10</th><th class="no-sort">Blowout ≥40</th><th class="no-sort">Avg Margin</th><th class="no-sort">Hi / Lo</th></tr></thead><tbody>`;
  rows.slice().sort((a,b)=>(b.aboveMed-a.aboveMed)||(b.avgMargin-a.avgMargin)).forEach(s=>{
    html+=`<tr class="${s.id===MEID?"me":""}"><td>${teamLine(s.team)}</td>
      <td class="lead num">${s.aboveMed}/${s.gp}</td>
      <td class="num">${s.close_w}-${s.close_l}</td>
      <td class="num">${s.blowW}-${s.blowL}</td>
      <td class="num" style="color:${s.avgMargin>0?'var(--win)':s.avgMargin<0?'var(--loss)':'var(--ink-2)'}">${(s.avgMargin>0?'+':'')+fmt(s.avgMargin,1)}</td>
      <td class="num">${s.hi!=null?fmt(s.hi,0):'—'} / ${s.lo!=null?fmt(s.lo,0):'—'}</td></tr>`;
  });
  html+=`</tbody></table></div><div class="metricnote"><b>Pts&gt;Med</b> weeks scoring above the league median. <b>Close</b> record in games decided by ≤10 pts. <b>Blowout</b> games decided by ≥40. <b>Avg Margin</b> mean point differential. <b>Hi/Lo</b> best & worst single-week score.</div>`;
  return el(html);
};
function analyticsPreview(){
  const items=[["activity","Luck Index","Actual wins vs. expected wins from weekly scoring rank"],
    ["swords","All-Play Record","Your record if you faced every team every week"],
    ["bars","Consistency","Week-to-week standard deviation of scores"],
    ["shield","Strength of Schedule","Average scoring of the opponents each team has faced"],
    ["target","Close Games","Record in games decided by ≤10 points"],
    ["line","Points vs Median","Weeks scoring above the league median"]];
  return `<div class="grid g-teams">`+items.map(i=>`<div class="card card-p"><div style="font-size:22px;color:var(--accent);display:flex;align-items:center">${icon(i[0])}</div>
    <div style="font-family:'DM Sans';font-weight:800;font-size:15px;margin:6px 0 3px">${i[1]}</div>
    <div style="font-size:12.5px;color:var(--ink-2)">${i[2]}</div></div>`).join("")+`</div>`;
}
function barChart(rows,valf,labf,diverge){
  const max=Math.max(...rows.map(r=>Math.abs(valf(r))),0.1);
  let h=`<div class="card card-p">`;
  rows.forEach(s=>{const v=valf(s);const w=Math.abs(v)/max*100;
    const col=diverge?(v>0?"var(--win)":v<0?"var(--loss)":"var(--neutral)"):"var(--accent)";
    h+=`<div class="barrow"><span class="bl">${esc(s.team.name)}</span>
      <div class="bartrk"><div class="barfil" style="width:${Math.max(3,w)}%;background:${col}"></div></div>
      <span class="bv">${labf(s)}</span></div>`;});
  h+=`</div>`;return h;
}
function miniBar(t,v,max,lab){return `<div class="barrow"><span class="bl">${esc(t.name)}</span>
  <div class="bartrk"><div class="barfil" style="width:${Math.max(3,v/max*100)}%"></div></div><span class="bv">${lab}</span></div>`;}

/* ---- HEAD TO HEAD ---- */
VIEWS.h2h=function(){
  let html=shead("Rivalries","Head-to-Head");
  if(!ST.started) return el(html+`<div style="margin-top:4px">${emptyState("swords","No games played yet","Once matchups are scored, this becomes a full all-play grid — each team's record against every other, plus season-series results.")}</div>`);
  const teams=D.teams;
  const rec={};teams.forEach(a=>{rec[a.id]={};teams.forEach(b=>rec[a.id][b.id]={w:0,l:0});});
  ST.played.forEach(m=>{const hs=m.homeScore,as=m.awayScore;
    if(hs>as){rec[m.homeTeamId][m.awayTeamId].w++;rec[m.awayTeamId][m.homeTeamId].l++;}
    else if(as>hs){rec[m.awayTeamId][m.homeTeamId].w++;rec[m.homeTeamId][m.awayTeamId].l++;}});
  let h=`<div class="matrix"><table><thead><tr><th style="text-align:left">↓ vs →</th>`;
  teams.forEach(t=>h+=`<th title="${esc(t.name)}">${badge(t)}</th>`);
  h+=`<th>Tot</th></tr></thead><tbody>`;
  teams.forEach(a=>{let tw=0,tl=0;h+=`<tr><td style="text-align:left">${teamLine(a)}</td>`;
    teams.forEach(b=>{if(a.id===b.id){h+=`<td class="diag">—</td>`;return;}
      const r=rec[a.id][b.id];tw+=r.w;tl+=r.l;
      const txt=(r.w||r.l)?`${r.w}-${r.l}`:"·";
      const c=r.w>r.l?"var(--win)":r.l>r.w?"var(--loss)":"var(--ink-2)";
      h+=`<td style="color:${c};font-weight:${(r.w||r.l)?700:400}">${txt}</td>`;});
    h+=`<td class="mono" style="font-weight:700">${tw}-${tl}</td></tr>`;});
  h+=`</tbody></table></div><div class="metricnote">Read across a row for that team's record vs each opponent.</div>`;
  return el(html+h);
};

/* ---- RECORDS ---- */
VIEWS.records=function(){
  let html=shead("League Almanac","Record Book");
  if(!ST.started) return el(html+`<div style="margin-top:4px">${emptyState("trophy","The record book is empty — for now","Single-week highs and lows, biggest blowouts, nail-biters, and season bests will be logged here as the weeks roll in.")}</div>`);
  const games=ST.played;
  let allScores=[];games.forEach(m=>{allScores.push({tid:m.homeTeamId,sc:m.homeScore,wk:m.week});allScores.push({tid:m.awayTeamId,sc:m.awayScore,wk:m.week});});
  const hi=allScores.slice().sort((a,b)=>b.sc-a.sc)[0], lo=allScores.slice().sort((a,b)=>a.sc-b.sc)[0];
  const blow=games.slice().sort((a,b)=>Math.abs(b.homeScore-b.awayScore)-Math.abs(a.homeScore-a.awayScore))[0];
  const close=games.slice().sort((a,b)=>Math.abs(a.homeScore-a.awayScore)-Math.abs(b.homeScore-b.awayScore))[0];
  const shoot=games.slice().sort((a,b)=>(b.homeScore+b.awayScore)-(a.homeScore+a.awayScore))[0];
  let h=`<div class="grid g-kpi">`;
  h+=recCard("flame","Highest Score",hi?fmt(hi.sc,1):"—",hi?`${teamById[hi.tid].name} · Wk ${hi.wk}`:"");
  h+=recCard("arrow-down","Lowest Score",lo?fmt(lo.sc,1):"—",lo?`${teamById[lo.tid].name} · Wk ${lo.wk}`:"");
  h+=recCard("zap","Biggest Blowout",blow?fmt(Math.abs(blow.homeScore-blow.awayScore),1):"—",blow?`Wk ${blow.week}`:"");
  h+=recCard("target","Closest Game",close?fmt(Math.abs(close.homeScore-close.awayScore),1):"—",close?`Wk ${close.week}`:"");
  h+=recCard("activity","Highest Combined",shoot?fmt(shoot.homeScore+shoot.awayScore,1):"—",shoot?`Wk ${shoot.week}`:"");
  h+=`</div>`;
  return el(html+h);
};
function recCard(ic,l,v,s){return `<div class="kpi"><div class="k-label" style="display:flex;align-items:center;gap:6px"><span style="color:var(--accent);display:inline-flex;font-size:14px">${icon(ic)}</span>${l}</div><div class="k-val">${esc(v)}</div><div class="k-sub">${esc(s)}</div></div>`;}

/* ---- HISTORY / DYNASTY ---- */
const OPAL=["#e0a417","#2f9e5c","#3b7dd8","#c23b52","#7b5ea7","#2aa198","#c0562e","#5a8f2f","#b8437f","#4a6fa5","#8a7a2f","#586d8a","#b06a3a"];
function ohash(id){let h=0;const s=String(id||"");for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function ownerColor(id){return OPAL[ohash(id)%OPAL.length];}
function ownerInit(name){const w=String(name||"?").replace(/[^A-Za-z0-9 ]/g,"").trim().split(/\s+/).filter(Boolean);return((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase();}
function obadge(o,cls=""){return `<span class="tb ${cls}" style="border-color:${ownerColor(o.ownerId)}">${esc(ownerInit(o.name))}</span>`;}
let histSort="titles", histYear=null, rivalOwner=null;
VIEWS.history=function(){
  const H=D.history;
  if(!H||!H.seasons||!H.seasons.length) return el(shead("Archive","League History")+emptyState("book","No history available",""));
  const owners=H.owners.slice(), seasons=H.seasons, span=D.meta.historySpan;
  const ownerById={};owners.forEach(o=>ownerById[o.ownerId]=o);
  const latest=seasons[seasons.length-1];
  if(histYear==null)histYear=latest.year;
  const champ=latest.standings[0];
  let html=shead(`${span[0]}–${span[1]} · ${seasons.length} Seasons`,"League History",`${owners.length} managers all-time`);
  // defending champ hero
  const champOwner=ownerById[champ.ownerId]||{name:champ.team,ownerId:champ.ownerId};
  html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--accent-soft)">
      <div style="font-size:30px;color:var(--accent);display:flex;align-items:center">${icon("trophy")}</div>
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">Defending Champion · ${latest.year}</div>
        <div style="font-family:'DM Sans';font-weight:900;font-size:24px;letter-spacing:-.02em;margin-top:2px">${esc(champ.team)}</div>
        <div style="color:var(--ink-2);font-size:13px">${esc(champOwner.name)} · ${champ.w}-${champ.l}${champ.t?"-"+champ.t:""} · ${fmt(champ.pf,1)} PF</div></div>
    </div></div>`;
  // superlatives
  const byTitles=owners.slice().sort((a,b)=>b.titles-a.titles||wp(b)-wp(a));
  const elig=owners.filter(o=>o.seasons>=3);
  const bestWp=elig.slice().sort((a,b)=>wp(b)-wp(a))[0];
  const mostPo=owners.slice().sort((a,b)=>b.playoffs-a.playoffs)[0];
  let bestSeason=null,mostPF=null;
  seasons.forEach(s=>s.standings.forEach(r=>{if(!bestSeason||r.pf>bestSeason.pf)bestSeason={...r,year:s.year};}));
  owners.forEach(o=>{if(!mostPF||o.pf>mostPF.pf)mostPF=o;});
  html+=`<div class="grid g-kpi">
    ${recCard("crown","Most Titles",byTitles[0].titles+"×",byTitles[0].name)}
    ${recCard("line","Best Win %",fmt(wp(bestWp)*100,1)+"%",bestWp.name)}
    ${recCard("ticket","Most Playoffs",mostPo.playoffs+"×",mostPo.name)}
    ${recCard("flame","Top Scoring Season",fmt(bestSeason.pf,0),bestSeason.team+" · "+bestSeason.year)}
    ${recCard("bars","Most Career Points",fmt(mostPF.pf,0),mostPF.name)}
  </div>`;
  // champions timeline
  html+=`<div class="sub-h">Champions</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">`;
  seasons.slice().reverse().forEach(s=>{
    const c=s.standings[0];const o=ownerById[c.ownerId]||{name:c.team,ownerId:c.ownerId};
    const def=s.year===latest.year;
    html+=`<div class="card card-p" style="text-align:center;padding:14px 12px;${def?"border-color:var(--accent);background:linear-gradient(160deg,var(--accent-soft),var(--surface))":""}">
      <div style="font-family:'DM Sans';font-weight:900;font-size:22px;color:${def?"var(--accent)":"var(--ink-3)"};letter-spacing:-.02em">${s.year}</div>
      <div style="margin:8px auto 6px">${obadge(o,"lg")}</div>
      <div style="font-weight:800;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.team)}</div>
      <div style="font-size:11.5px;color:var(--ink-2);margin-top:2px">${esc(o.name)}</div>
      <div style="font-size:10.5px;color:var(--ink-3);margin-top:3px" class="mono">${c.w}-${c.l}${c.t?"-"+c.t:""}</div></div>`;
  });
  html+=`</div>`;
  // ---- title drought ----
  const lastYear=latest.year;
  const champYears={};
  seasons.forEach(s=>{const c=s.standings[0];(champYears[c.ownerId]=champYears[c.ownerId]||[]).push(s.year);});
  const winners=[],chasers=[];
  owners.forEach(o=>{
    const ys=(champYears[o.ownerId]||[]).slice().sort((a,b)=>a-b);
    if(ys.length){const lt=ys[ys.length-1];winners.push({o,last:lt,drought:lastYear-lt,titles:ys.length});}
    else chasers.push({o,seasons:o.seasons});
  });
  winners.sort((a,b)=>b.drought-a.drought);
  chasers.sort((a,b)=>b.seasons-a.seasons);
  const longest=winners.filter(w=>w.drought>0).sort((a,b)=>b.drought-a.drought)[0];
  html+=`<div class="sub-h">Title Droughts</div>`;
  if(longest) html+=`<div class="grid g-kpi" style="margin-bottom:14px">
    ${recCard("clock","Longest Active Drought",longest.drought+" yrs",longest.o.name+" · since "+longest.last)}
    ${recCard("trophy","Reigning Champ","0 yrs",latest.standings[0].team)}
    ${recCard("clock","Longest Wait For A First",(chasers[0]?chasers[0].seasons+" yrs":"—"),(chasers[0]?chasers[0].o.name:"everyone has a ring"))}
  </div>`;
  html+=`<div class="grid g-2">`;
  html+=`<div class="card card-p"><div class="k-label" style="margin-bottom:8px">Years since last title · former champs</div>`;
  winners.forEach(w=>{const reign=w.drought===0;
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);${w.o.active2026?"":"opacity:.5"}">
      ${obadge(w.o)}<div style="min-width:0;flex:1"><div class="nm" style="font-size:13.5px">${esc(w.o.name)}${w.o.active2026?"":' <span class="pill pos" style="font-size:9px">left</span>'}</div>
      <div class="ow">${w.titles}× champ · last ${w.last}</div></div>
      <span class="pill ${reign?"w":w.drought>=5?"l":"pos"}">${reign?"Reigning":w.drought+" yr"}</span></div>`;});
  html+=`</div>`;
  html+=`<div class="card card-p"><div class="k-label" style="margin-bottom:8px">Chasing their first ring</div>`;
  if(!chasers.length) html+=`<div style="color:var(--ink-3);font-size:13px;padding:8px 0">Everyone in the league has won it all.</div>`;
  chasers.forEach(c=>{
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);${c.o.active2026?"":"opacity:.5"}">
      ${obadge(c.o)}<div style="min-width:0;flex:1"><div class="nm" style="font-size:13.5px">${esc(c.o.name)}${c.o.active2026?"":' <span class="pill pos" style="font-size:9px">left</span>'}</div>
      <div class="ow">best finish ${c.o.bestFinish?ordinal(c.o.bestFinish):"—"}</div></div>
      <span class="pill pos">${c.seasons} seas</span></div>`;});
  html+=`</div></div>`;
  // all-time leaderboard

  html+=`<div class="wkbar"><span style="font-size:12px;color:var(--ink-3);font-weight:600">SORT</span><div class="seg" id="hsort">`+

  owners.sort((a,b)=> histSort==="titles"?(b.titles-a.titles||wp(b)-wp(a)) : histSort==="wp"?wp(b)-wp(a) : histSort==="pf"?b.pf-a.pf : (a.avgFinish??99)-(b.avgFinish??99));
  html+=`<div class="twrap"><table><thead><tr><th class="no-sort">#</th><th class="no-sort">Manager</th><th class="no-sort" title="Championships"><span style="font-size:14px;display:inline-flex;vertical-align:middle">${icon("trophy")}</span></th><th class="no-sort">W-L</th><th class="no-sort">PCT</th><th class="no-sort">Seas</th><th class="no-sort">PF</th><th class="no-sort">PF/G</th><th class="no-sort">PO</th><th class="no-sort">Best</th><th class="no-sort">Avg</th></tr></thead><tbody>`;
  owners.forEach((o,i)=>{const g=o.w+o.l+o.t;
    html+=`<tr>
      <td class="rankcol ${i<3?"top":""}">${i+1}</td>

VIEWS.defense=function(){
  let html=shead("Lockdown Index","Manager Defense","Which managers keep opponents off the scoreboard");

  const rows=Object.values(ST.S).filter(s=>s.gp>0);
  rows.forEach(s=>{let supp=0,stuffs=0,n=0;s.results.forEach(r=>{const opp=ST.S[r.opp];if(!opp)return;supp+=(opp.ppg-r.pa);if(r.pa<opp.ppg)stuffs++;n++;});s._supp=n?supp/n:0;s._stuffs=stuffs;});
  const minPA=Math.min(...rows.map(s=>s.papg)),maxPA=Math.max(...rows.map(s=>s.papg));

  rows.forEach(s=>{const pa=maxPA>minPA?(maxPA-s.papg)/(maxPA-minPA)*100:50;const su=maxS>minS?(s._supp-minS)/(maxS-minS)*100:50;s._def=0.55*pa+0.45*su;});
  rows.sort((a,b)=>b._def-a._def);
  const grade=d=>d>=82?"A+":d>=70?"A":d>=58?"B":d>=44?"C":d>=30?"D":"F";
  const gcol=g=>g[0]==="A"?"var(--win)":g[0]==="B"?"#5a8f2f":g[0]==="C"?"var(--accent)":g[0]==="D"?"#c0562e":"var(--loss)";
  const best=rows[0],worst=rows[rows.length-1],mostStuffs=rows.slice().sort((a,b)=>b._stuffs-a._stuffs)[0];
  html+=`<div class="grid g-kpi">
    ${recCard("shield","Lockdown Manager",grade(best._def),best.team.name+" · "+fmt(best.papg,1)+" PA/G")}
    ${recCard("bars","Most Stuffs",mostStuffs._stuffs+" of "+mostStuffs.gp,mostStuffs.team.name)}
    ${recCard("target","Turnstile Award",grade(worst._def),worst.team.name+" · "+fmt(worst.papg,1)+" PA/G")}
  </div>`;
  html+=`<div class="sub-h">Defensive Ratings</div><div class="twrap"><table><thead><tr><th class="no-sort">#</th><th class="no-sort">Manager</th><th class="no-sort">DEF</th><th class="no-sort">Grade</th><th class="no-sort">PA/G</th><th class="no-sort">Held Below Avg</th><th class="no-sort">Stuffs</th></tr></thead><tbody>`;
  rows.forEach((s,i)=>{const g=grade(s._def);
    html+=`<tr><td class="rankcol ${i<3?"top":""}">${i+1}</td><td>${teamLine(s.team)}</td>
      <td class="lead num">${fmt(s._def,0)}</td>
      <td><span class="pill" style="background:color-mix(in srgb,${gcol(g)} 15%,transparent);color:${gcol(g)};font-weight:800;min-width:30px;justify-content:center">${g}</span></td>
      <td class="num">${fmt(s.papg,1)}</td>
      <td class="num" style="color:${s._supp>0?'var(--win)':s._supp<0?'var(--loss)':'var(--ink-2)'}">${(s._supp>0?'+':'')+fmt(s._supp,1)}</td>
      <td class="num">${s._stuffs}/${s.gp}</td></tr>`;});
  html+=`</tbody></table></div>`;

        window.scrollTo({top:y,behavior:"instant"});
      }
      showToast(D.meta.liveWeek?"Live scores updated":"Data updated");
    }
  }catch(e){console.error("refresh",e);}
  finally{__refreshing=false;}
}
function startLiveRefresh(){
  setInterval(refreshData,60000);                 // check once a minute
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshData();});
  window.addEventListener("focus",refreshData);   // refresh the moment they return to the tab
}
let __toastT=null;
function showToast(msg){
  let t=document.getElementById("liveToast");
  if(!t){t=document.createElement("div");t.id="liveToast";t.className="toast";document.body.appendChild(t);}
  t.innerHTML=`<span class="livedot" style="background:var(--win)"></span>${esc(msg)}`;
  t.classList.add("show");
  clearTimeout(__toastT);__toastT=setTimeout(()=>t.classList.remove("show"),2800);
}
boot();
__initParlay(sb);
}
