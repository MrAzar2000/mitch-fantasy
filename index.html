function initSwipeNavigation(){
  let gesture=null,suppressUntil=0;
  const reset=()=>{if(gesture?.sheet){gesture.sheet.style.transform='';gesture.sheet.classList.remove('sheet-dragging');}gesture=null;};
  document.addEventListener('touchstart',e=>{
    reset();if(e.touches.length!==1||e.target.closest('button,a,input,textarea,select,summary,[role=button],[data-team],[data-tid],dialog,.twrap,.matrix,.seg,.stabs,.production-chart,.trend'))return;
    const modal=document.getElementById('mdl'),sheet=modal?.querySelector('.mdl-box'),p=e.touches[0];
    if(!modal&&p.clientX>28)return;
    gesture={x:p.clientX,y:p.clientY,dx:0,dy:0,sheet,modal,vertical:!!e.target.closest('.mdl-top')||!!sheet&&p.clientY<(sheet.getBoundingClientRect?.().top??-100)+40,active:false};
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!gesture)return;if(e.touches.length!==1){reset();return;}const p=e.touches[0];gesture.dx=p.clientX-gesture.x;gesture.dy=p.clientY-gesture.y;
    const right=gesture.dx>12&&gesture.dx>Math.abs(gesture.dy)*1.5,down=gesture.sheet&&gesture.vertical&&gesture.dy>12&&gesture.dy>Math.abs(gesture.dx)*1.5;
    if(!right&&!down){if(Math.max(Math.abs(gesture.dx),Math.abs(gesture.dy))>24)reset();return;}
    gesture.active=true;gesture.direction=down?'down':'right';if(e.cancelable)e.preventDefault();
    if(gesture.sheet){gesture.sheet.classList.add('sheet-dragging');gesture.sheet.style.transform=down?`translateY(${Math.max(0,gesture.dy)}px)`:`translateX(${Math.max(0,gesture.dx)}px)`;}
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(!gesture)return;const g=gesture,close=g.active&&(g.direction==='down'?g.dy>100:g.dx>90);reset();if(!close)return;suppressUntil=Date.now()+400;
    if(g.modal){closeMatchup();return;}
    if(cur==='teams'&&document.querySelector('#app .view[data-team-detail]')){viewedTeamId=null;history.replaceState(history.state,'','#teams');setTab('teams',true);return;}
    const target=VIEW_BACK.pop()||'dash',section=VIEW_BACK.sections?.pop();swipingBack=true;try{setTab(target,false,section);}finally{swipingBack=false;}
  },{passive:true});
  document.addEventListener('touchcancel',reset,{passive:true});
  document.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation();}},{capture:true});
}

function initPullRefresh(){
  const standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
  if(!standalone||!("ontouchstart" in window))return;
  document.documentElement.style.overscrollBehaviorY="none";
  const ind=document.createElement("div");ind.className="ptr";ind.setAttribute("role","status");ind.innerHTML='<div class="ptr-spin"></div><span>Pull to refresh</span>';document.body.appendChild(ind);
  const label=ind.querySelector("span");
  // iOS 18+ can provide native switch feedback, but has no Vibration API.
  // Keep the control rendered and out of the accessibility/focus order.
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let hapticSwitch=null;
  if(iOS){
    // Safari plays the switch haptic when its label is clicked, so the label is what gets clicked.
    const box=document.createElement("input");box.type="checkbox";box.setAttribute("switch","");box.tabIndex=-1;
    hapticSwitch=document.createElement("label");hapticSwitch.setAttribute("aria-hidden","true");hapticSwitch.append(box);
    hapticSwitch.style.cssText="position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden";
    document.body.appendChild(hapticSwitch);
  }
  const haptic=()=>{
    // Best effort: device settings and WebKit versions may suppress feedback.
    try{if(hapticSwitch)hapticSwitch.click();if(typeof navigator.vibrate==="function")navigator.vibrate(15);}catch(e){}
  };
  let startY=0,startX=0,pulling=false,dist=0,armed=false,loading=false,dragged=false,sideways=false,suppressUntil=0;const TH=70;
  const atTop=()=>pageScrollY()<=0;
  const reset=()=>{pulling=false;dist=0;armed=false;ind.style.transform="";ind.style.opacity="";ind.classList.remove("ready","armed");label.textContent="Pull to refresh";};
  // A pull can start anywhere on the page, including matchup cards, buttons and links;
  // only text fields and open sheets keep the gesture for themselves.
  window.addEventListener("touchstart",e=>{
    const blocked=e.target.closest&&e.target.closest("input,textarea,select,[contenteditable],dialog,.mdl");
    // in sideways-scrolling tables and button rows the pull has to be clearly downward
    dragged=false;suppressUntil=0;sideways=!!(e.target.closest&&e.target.closest(".twrap,.matrix,.stabs,.seg,.manager-quick-actions"));
    if(!loading&&e.touches.length===1&&atTop()&&!blocked&&!document.querySelector(".mdl")&&!document.body.classList.contains("navopen")){startY=e.touches[0].clientY;startX=e.touches[0].clientX;pulling=true;dist=0;}
  },{passive:true});
  window.addEventListener("touchmove",e=>{
    if(!pulling)return;
    if(e.touches.length!==1){reset();return;}
    dist=e.touches[0].clientY-startY;
    if(dist<=0||!atTop()||Math.abs(e.touches[0].clientX-startX)*(sideways?2:1)>Math.abs(dist)){reset();return;}
    if(dist>10)dragged=true;
    if(e.cancelable)e.preventDefault();
    const d=Math.min(dist*.5,100),next=d>=TH;
    ind.style.transform=`translateX(-50%) translateY(${d}px)`;ind.style.opacity=String(Math.min(d/35,1));
    if(next!==armed){armed=next;ind.classList.toggle("armed",armed);label.textContent=armed?"Release to refresh":"Pull to refresh";
      if(armed)haptic();
    }
  },{passive:false});
  window.addEventListener("touchend",()=>{
    if(!pulling)return;
    // the card or button the pull started on must not open when the finger lifts
    if(dragged)suppressUntil=Date.now()+400;
    if(!armed){reset();return;}
    pulling=false;loading=true;ind.classList.remove("armed");ind.classList.add("ready");label.textContent="Refreshing…";
    haptic();
    // Give the refresh state a frame to paint before navigating.
    requestAnimationFrame(()=>requestAnimationFrame(()=>location.reload()));
  },{passive:true});
  window.addEventListener("touchcancel",reset,{passive:true});
  // the haptic switch click is synthetic, so only real taps are swallowed
  document.addEventListener("click",e=>{if(e.isTrusted&&Date.now()<suppressUntil){suppressUntil=0;e.preventDefault();e.stopImmediatePropagation();}},{capture:true});
}

let __refreshing=false;let leagueRefreshError=false;
async function refreshData(preloaded){
  if(__refreshing||(document.hidden&&!preloaded)) return;
  __refreshing=true;
  try{
    let nd=preloaded||null;
    if(!nd){
    // poll only the update time (a few bytes); download the full league only when it changed
    loadHeartbeat();
    const q=await sb.from("league_data").select("lu:data->meta->>lastUpdated").eq("id","current").single();
    if(q.error)throw q.error;const lu=q.data&&q.data.lu;
    if(!lu)throw new Error('League update time unavailable');
    const r=(lu&&lu!==D.meta.lastUpdated)?await sb.from("league_data").select("data").eq("id","current").single():null;
    nd=r&&r.data&&r.data.data;
    if(r?.error)throw r.error;
    if(r&&!nd?.meta?.lastUpdated)throw new Error('League update unavailable');
    }
    leagueRefreshError=false;
    if(nd&&nd.meta&&nd.meta.lastUpdated!==D.meta.lastUpdated){
      const prev=scoreSnap();
      D=nd;saveCachedLeague(nd); indexTeams(); ST=computeStats(); setFresh();loadNflInsights();EXPERIENCE?.ensureResearch();
      PREV_SCORES=prev; rememberSeen();
      const ae=document.activeElement, tag=ae&&ae.tagName;
      const busy=tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA";
      if(cur!=="parlay" && cur!=="calc" && !busy && !document.getElementById("mdl")){
        rememberView(cur,document.getElementById("app"));
        const y=pageScrollY();
        const app=document.getElementById("app"); app.innerHTML=""; app.appendChild(VIEWS[cur]()); paintView(app); addTitleHelp(app);EXPERIENCE?.enhanceView(app);
        restoreView(cur,app,false);scrollPageTo({top:y,behavior:"instant"});
      }
      flagUpdate(prev);
      showToast((D.meta.liveWeek?"Live scores updated · ":"Data updated · ")+new Date(D.meta.lastUpdated).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",second:"2-digit"}));
    }
  }catch(e){leagueRefreshError=true;console.error("refresh",e);}
  finally{__refreshing=false;EXPERIENCE?.updateFreshness();updateConnection();}
}
