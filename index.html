/* ---------- exact clinch / elimination (max-flow over every possible remaining result) ---------- */
// wins: {id: wins so far}; games: [[homeId, awayId], ...] still to play; P: playoff spots.
// Eliminated = in EVERY possible outcome at least P other teams finish with strictly more wins.
// Clinched   = in EVERY possible outcome fewer than P other teams finish with at least as many wins.
// Ties on wins are decided by points, which can't be known ahead, so both checks assume the tie goes against the team.
function maxFlow(n,cap,s,t){
  let flow=0;const par=new Array(n);
  for(;;){
    par.fill(-1);par[s]=s;const q=[s];
    for(let qi=0;qi<q.length&&par[t]<0;qi++){const u=q[qi];const row=cap[u];for(let v=0;v<n;v++)if(par[v]<0&&row[v]>0){par[v]=u;q.push(v);}}
    if(par[t]<0)return flow;
    let f=Infinity;for(let v=t;v!==s;v=par[v])f=Math.min(f,cap[par[v]][v]);
    for(let v=t;v!==s;v=par[v]){cap[par[v]][v]-=f;cap[v][par[v]]+=f;}
    flow+=f;
  }
}
function subsetsOf(arr,k,fn){const pick=[];const rec=i=>{if(pick.length===k){return fn(pick.slice());}
  for(let j=i;j<=arr.length-(k-pick.length);j++){pick.push(arr[j]);if(rec(j+1))return true;pick.pop();}return false;};return rec(0);}
// can the games among `others` be decided so team x gets at most lim[x] more wins (lim Infinity = no limit)?
function canCap(others,games,lim){
  const g=games.filter(([a,b])=>others.includes(a)&&others.includes(b));
  if(!g.length)return true;
  const n=2+g.length+others.length,s=0,t=n-1,cap=Array.from({length:n},()=>new Array(n).fill(0));
  g.forEach(([a,b],i)=>{cap[s][1+i]=1;cap[1+i][1+g.length+others.indexOf(a)]=1;cap[1+i][1+g.length+others.indexOf(b)]=1;});
  others.forEach((x,j)=>{cap[1+g.length+j][t]=lim[x]===Infinity?g.length:Math.max(0,lim[x]);});
  return maxFlow(n,cap,s,t)===g.length;
}
// can the games among `others` give every team x at least need[x] more wins?
function canReach(others,games,need){
  const total=others.reduce((a,x)=>a+need[x],0);if(!total)return true;
  const g=games.filter(([a,b])=>others.includes(a)&&others.includes(b));
  const n=2+g.length+others.length,s=0,t=n-1,cap=Array.from({length:n},()=>new Array(n).fill(0));
  g.forEach(([a,b],i)=>{cap[s][1+i]=1;cap[1+i][1+g.length+others.indexOf(a)]=1;cap[1+i][1+g.length+others.indexOf(b)]=1;});
  others.forEach((x,j)=>{cap[1+g.length+j][t]=need[x];});
  return maxFlow(n,cap,s,t)===total;
}
function isEliminated(T,ids,wins,games,P){
  const left=games.filter(([a,b])=>a===T||b===T).length,maxW=wins[T]+left;
  const others=ids.filter(x=>x!==T),rest=games.filter(([a,b])=>a!==T&&b!==T);
  const forced=others.filter(x=>wins[x]>maxW);
  if(forced.length>=P)return true;
  const free=others.filter(x=>!forced.includes(x)),k=P-1-forced.length;
  // T wins out; look for a way to keep all but P-1 teams at or below T's total
  const ok=subsetsOf(free,Math.min(k,free.length),S=>{
    const lim={};others.forEach(x=>{lim[x]=(forced.includes(x)||S.includes(x))?Infinity:Math.floor(maxW-wins[x]);});
    return canCap(others,rest,lim);});
  return !ok;
}
function isClinched(T,ids,wins,games,P){
  const minW=wins[T],others=ids.filter(x=>x!==T);
  const base={};others.forEach(x=>{base[x]=wins[x]+games.filter(([a,b])=>(a===T&&b===x)||(b===T&&a===x)).length;}); // T loses out
  const rest=games.filter(([a,b])=>a!==T&&b!==T);
  if(others.length<P)return true;
  // look for P teams that can all reach T's total
  const beaten=subsetsOf(others,P,S=>{const need={};others.forEach(x=>{need[x]=S.includes(x)?Math.max(0,Math.ceil(minW-base[x])):0;});return canReach(others,rest,need);});
  return !beaten;
}

/* ---------- playoff odds: simulate the rest of the regular season ---------- */
let __ODDS=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let PLAYOFF_SCENARIO=null;
function playoffOdds(scenario=null){
  const cacheKey=D.meta.lastUpdated+JSON.stringify(scenario);
  if(__ODDS&&__ODDS.key===cacheKey)return __ODDS.v;
  const N=5000,ids=D.teams.map(t=>t.id),P=D.meta.playoffTeamCount||6,RS=D.meta.regularSeasonWeeks||14;
  const rem=D.schedule.filter(x=>x.week<=RS&&!(x.winner&&x.winner!=="UNDECIDED")).map(x=>({x,g:gameModel(x)})).filter(o=>o.g);
  let seed=0;for(const c of String(D.meta.lastUpdated))seed=(seed*31+c.charCodeAt(0))|0;
  const rnd=mulberry(seed),gauss=()=>{let u=0,v=0;while(!u)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const R={};ids.forEach(id=>R[id]={po:0,top2:0,first:0,w:0});
  for(let n=0;n<N;n++){
    const w={},pf={};ids.forEach(id=>{const s=ST.S[id];w[id]=s.w+s.tie*0.5;pf[id]=s.pf;});
    for(const o of rem){const hs=o.g.mh+o.g.sh*gauss(),as=o.g.ma+o.g.sa*gauss();
      pf[o.x.homeTeamId]+=hs;pf[o.x.awayTeamId]+=as;
      if(scenario&&o.x.id===scenario.match)w[scenario.winner]++;
      else if(hs>as)w[o.x.homeTeamId]++;else if(as>hs)w[o.x.awayTeamId]++;else{w[o.x.homeTeamId]+=.5;w[o.x.awayTeamId]+=.5;}}
    const ord=ids.slice().sort((a,b)=>(w[b]-w[a])||(pf[b]-pf[a]));
    ord.forEach((id,i)=>{const r=R[id];r.w+=w[id];if(i<P)r.po++;if(i<2)r.top2++;if(i===0)r.first++;});
  }
  const games=id=>ST.S[id].gp+rem.filter(o=>o.x.homeTeamId===id||o.x.awayTeamId===id).length;
  // exact checks over every possible result of the remaining games (not the simulation)
  const wins={};ids.forEach(id=>{const s=ST.S[id];wins[id]=s.w+s.tie*0.5;});
  const left=rem.filter(o=>!scenario||o.x.id!==scenario.match).map(o=>[o.x.homeTeamId,o.x.awayTeamId]);
  if(scenario&&rem.some(o=>o.x.id===scenario.match))wins[scenario.winner]++;
  const v=ids.map(id=>{const r=R[id],g=games(id),ew=r.w/N;
    return {id,team:teamById[id],po:r.po/N,top2:r.top2/N,first:r.first/N,ew,el:g-ew,
      clinched:isClinched(id,ids,wins,left,P),eliminated:isEliminated(id,ids,wins,left,P)};})
    .sort((a,b)=>(b.po-a.po)||(b.ew-a.ew));
  __ODDS={key:cacheKey,v:{rows:v,N,remaining:rem.length,P}};return __ODDS.v;
}

/* ---------- lineups: points left on the bench (needs weekly data from the cron) ---------- */
function hasWeekly(){return !!(D.weekly&&D.players&&Object.keys(D.weekly).length);}
function ppos(pid){return ((D.players||{})[pid]||[])[1]||"?";}
function pname(pid){return ((D.players||{})[pid]||[])[0]||("Player "+pid);}
function lineupSplit(rows){
  // league lineup: QB, 2 RB, 2 WR, TE, FLEX (RB/WR/TE), D/ST, K; bench and IR don't score
  const act=rows.filter(r=>r[1]!==20&&r[1]!==21).reduce((a,r)=>a+r[2],0);
  const by={};rows.filter(r=>r[1]!==21).forEach(r=>{(by[ppos(r[0])]=by[ppos(r[0])]||[]).push(r[2]);});
  Object.values(by).forEach(a=>a.sort((x,y)=>y-x));
  let opt=0;const take=(p,n)=>{const a=by[p]||[];opt+=a.splice(0,n).reduce((s,v)=>s+v,0);};
  take("QB",1);take("RB",2);take("WR",2);take("TE",1);
  const flex=[...(by.RB||[]),...(by.WR||[]),...(by.TE||[])].sort((x,y)=>y-x);opt+=flex[0]||0;
  take("DST",1);take("K",1);
  return {act,opt,left:Math.max(0,opt-act)};
}
function lineupStats(){
  if(!hasWeekly())return null;
  const R={};D.teams.forEach(t=>R[t.id]={team:t,act:0,opt:0,left:0,worst:null,weeks:0});
  ST.weeks.forEach(w=>{const wk=D.weekly[String(w)];if(!wk)return;
    D.teams.forEach(t=>{const rows=wk[String(t.id)];if(!rows)return;const s=lineupSplit(rows),r=R[t.id];
      r.act+=s.act;r.opt+=s.opt;r.left+=s.left;r.weeks++;if(!r.worst||s.left>r.worst.left)r.worst={wk:w,left:s.left};});});
  return Object.values(R).map(r=>({...r,eff:r.opt?r.act/r.opt:0}));
}
/* ---------- waiver pickups: points scored as a starter since joining ---------- */
function pickupStats(){
  if(!hasWeekly()||!D.faab)return null;
  const out=[];
  D.faab.teams.forEach(ft=>{const t=teamById[ft.teamId];if(!t)return;
    ft.pickups.forEach(p=>{let st=0,bn=0,gs=0;
      ST.weeks.forEach(w=>{const rows=((D.weekly[String(w)]||{})[String(ft.teamId)])||[];const r=rows.find(x=>x[0]===p.playerId);
        if(!r)return;if(r[1]!==20&&r[1]!==21){st+=r[2];gs++;}else bn+=r[2];});
      out.push({t,p,st,bn,gs});});});
  return out.sort((a,b)=>b.st-a.st);
}

/* ---- ANALYTICS ---- */
/* ---- OUTLOOK: rest-of-season edge (schedule difficulty, roster strength, hot/cold, injuries) ---- */
function olStrength(tid){
  const roster=D.rosters[tid]||[];
  const byPos={QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  roster.forEach(p=>{if(byPos[p.pos])byPos[p.pos].push(playerSeason(p.playerId).avg);});
  for(const k in byPos)byPos[k].sort((a,b)=>b-a);
  const sum=(a,n)=>a.slice(0,n).reduce((x,y)=>x+y,0);
  const qb=sum(byPos.QB,1),rb=sum(byPos.RB,2),wr=sum(byPos.WR,2),te=sum(byPos.TE,1),k=sum(byPos.K,1),dst=sum(byPos.DST,1);
  const flex=Math.max(byPos.RB[2]||0,byPos.WR[2]||0,byPos.TE[1]||0,0);
  return {qb,rb,wr,te,flex,k,dst,total:qb+rb+wr+te+flex+k+dst};
}
VIEWS.outlook=function(){
  let html=shead("Rest of Season","Outlook","Who to watch, who to target, and who has the easy road");
  if(!ST.started) return el(html+emptyState("compass","Outlook unlocks after Week 1","Schedule difficulty, roster strength and player trends need at least one week of scores."));
  const S=ST.S,lastReg=D.meta.regularSeasonWeeks||14;

  // 1) rest-of-season schedule difficulty
  const sd=D.teams.map(t=>{
    const fut=D.schedule.filter(x=>x.winner==="UNDECIDED"&&x.week<=lastReg&&(x.homeTeamId===t.id||x.awayTeamId===t.id));
    const opps=fut.map(x=>x.homeTeamId===t.id?x.awayTeamId:x.homeTeamId).map(id=>S[id]?S[id].ppg:null).filter(v=>v);
    const avg=opps.length?opps.reduce((a,b)=>a+b,0)/opps.length:0;
    return {t,n:fut.length,avg};
  }).filter(x=>x.n>0).sort((a,b)=>a.avg-b.avg);
  if(sd.length){
    const mn=Math.min(...sd.map(x=>x.avg)),mx=Math.max(...sd.map(x=>x.avg));
    html+=`<div class="sub-h">Rest-of-Season Schedule <span style="font-weight:400;font-size:12px;color:var(--ink-3);text-transform:none;letter-spacing:0">avg PPG of remaining opponents — lower is easier</span></div>`;

    sd.forEach((x,i)=>{const frac=mx>mn?(x.avg-mn)/(mx-mn):0.5;const col=frac<0.34?"var(--win)":frac<0.67?"var(--t-amber)":"var(--loss)";const lab=frac<0.34?"Easy":frac<0.67?"Average":"Tough";

    html+=`</tbody></table></div><div class="metricnote">Remaining regular-season games only. Opponent strength is their season scoring average, so it re-ranks every week.</div>`;
  }

  // 1b) bye-week planner
  const byeW=D.meta.byeWeeks||{};
  const upByeWeeks=[...new Set(Object.values(byeW))].filter(w=>w>(D.meta.currentScoringPeriod||1)&&w<=lastReg).sort((a,b)=>a-b);
  if(upByeWeeks.length){
    const tbp=D.teams.map(t=>{
      const starters=(D.rosters[t.id]||[]).filter(p=>p.slot!=="BE"&&p.slot!=="IR");
      const byWk={}; upByeWeeks.forEach(w=>byWk[w]=0);
      starters.forEach(p=>{const b=byeW[p.proTeam]; if(b&&byWk[b]!=null)byWk[b]++;});
      return {t,byWk,worst:Math.max(0,...Object.values(byWk)),total:Object.values(byWk).reduce((a,b)=>a+b,0)};
    }).sort((a,b)=>b.worst-a.worst||b.total-a.total);
    html+=`<div class="sub-h">Bye-Week Planner <span style="font-weight:400;font-size:12px;color:var(--ink-3);text-transform:none;letter-spacing:0">your starters on bye each upcoming week</span></div>`;
    html+=`<div class="twrap"><table><thead><tr><th class="no-sort" style="text-align:left">Team</th>${upByeWeeks.map(w=>`<th class="no-sort">W${w}</th>`).join("")}<th class="no-sort">Total</th></tr></thead><tbody>`;
    tbp.forEach(x=>{html+=`<tr><td style="text-align:left">${teamLine(x.t)}</td>${upByeWeeks.map(w=>{const n=x.byWk[w];const col=n>=3?"var(--loss)":n===2?"#c0562e":n>=1?"var(--t-amber)":"var(--ink-3)";return `<td class="num" style="color:${col};font-weight:${n>=2?700:400}">${n||"·"}</td>`;}).join("")}<td class="num lead" style="font-weight:700">${x.total}</td></tr>`;});
    html+=`</tbody></table></div><div class="metricnote">Count of your <b>current starters</b> whose NFL team is on bye that week. <b style="color:var(--loss)">3+</b> means a real scramble to field a lineup — line up waivers or a trade before it hits. Based on today's roster.</div>`;
  }

  const cell=(v,avg)=>{const d=v-avg,hot=Math.abs(d)>avg*0.12;const col=d>avg*0.12?"var(--win)":d<-avg*0.12?"var(--loss)":"var(--ink-2)";return `<td class="num" style="color:${col};font-weight:${hot?700:500}">${fmt(v,1)}</td>`;};
  html+=`<div class="sub-h">Roster Strength <span style="font-weight:400;font-size:12px;color:var(--ink-3);text-transform:none;letter-spacing:0">best starters' season PPG by position — green beats the league average</span></div>`;

  str.forEach((x,i)=>{html+=`<tr><td class="rankcol ${i<3?"top":""}">${i+1}</td><td style="text-align:left">${teamLine(x.t)}</td>${cell(x.qb,la.qb)}${cell(x.rb,la.rb)}${cell(x.wr,la.wr)}${cell(x.te,la.te)}<td class="num lead" style="font-weight:800">${fmt(x.total,1)}</td></tr>`;});

  const prow=o=>`<div style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line)"><span class="posbadge tag-${(o.pos||"").toLowerCase()}">${esc(o.pos)}</span><div style="min-width:0;flex:1"><div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pname(o.pid))}${pFlags(o.pid,o.pro)} <span style="color:var(--ink-3);font-weight:400">${esc(o.pro)}</span></div><div style="font-size:12px;color:var(--ink-3)">${esc(o.t.name)}</div></div><div style="text-align:right"><div class="num" style="font-weight:700;color:${o.d>=0?"var(--win)":"var(--loss)"}">${o.d>=0?"+":""}${fmt(o.d,1)}</div><div style="font-size:11px;color:var(--ink-3)">${fmt(o.avg,1)}→${fmt(o.l3,1)}</div></div></div>`;
  const hot=pool.slice().sort((a,b)=>b.d-a.d).slice(0,8),cold=pool.slice().sort((a,b)=>a.d-b.d).slice(0,8);
  html+=`<div class="sub-h">Hot &amp; Cold <span style="font-weight:400;font-size:12px;color:var(--ink-3);text-transform:none;letter-spacing:0">last 3 non-bye recorded weeks vs season average</span></div>`;

  html+=`<div class="metricnote">Rostered players averaging 5+ points over 3+ games. <b>Buy-low / sell-high</b> signals — a cold star may be gettable; a surging bench player is worth a claim.</div>`;

  const sev={INJURY_RESERVE:0,OUT:1,DOUBTFUL:2,SUSPENSION:3,QUESTIONABLE:4,DAY_TO_DAY:5,PROBABLE:6};

  D.teams.forEach(t=>(D.rosters[t.id]||[]).forEach(p=>{const st=p.injury;if(st&&st!=="ACTIVE"&&st!=="NORMAL")inj.push({name:p.name,pos:p.pos,pro:p.proTeam,t,st,starter:p.slot!=="BE"&&p.slot!=="IR"});}));

  else{
    const sc=st=>(st==="OUT"||st==="INJURY_RESERVE")?"var(--loss)":st==="DOUBTFUL"?"#c0562e":"var(--t-amber)";
    html+=`<div class="twrap"><table><thead><tr><th class="no-sort" style="text-align:left">Player</th><th class="no-sort">Pos</th><th class="no-sort">NFL</th><th class="no-sort">Status</th><th class="no-sort">Role</th><th class="no-sort" style="text-align:left">Fantasy team</th></tr></thead><tbody>`;
    inj.forEach(o=>{html+=`<tr><td style="text-align:left;font-weight:600">${esc(o.name)}</td><td>${esc(o.pos)}</td><td>${esc(o.pro)}</td><td><b style="color:${sc(o.st)}">${esc(injLabel(o.st))}</b></td><td>${o.starter?'<span class="tag-in">Starter</span>':'<span style="color:var(--ink-3)">Bench</span>'}</td><td style="text-align:left">${teamLine(o.t)}</td></tr>`;});
    html+=`</tbody></table></div>`;
  }
  html+=`<div class="metricnote">Injury status from ESPN. Bye coverage uses the published schedule and current roster.</div>`;

  return el(html);
};

function barChart(rows,valf,labf,diverge){
  const max=Math.max(...rows.map(r=>Math.abs(valf(r))),0.1);
  let h=`<div class="card card-p">`;
  rows.forEach(s=>{const v=valf(s);const w=Math.abs(v)/max*100;
    const col=diverge?(v>0?"var(--win)":v<0?"var(--loss)":"var(--neutral)"):"var(--accent)";
    h+=`<div class="barrow"><span class="bl">${esc(s.team.name)}</span>
      <div class="bartrk"><div class="barfil" style="width:${Math.max(3,w)}%;background:${col}"></div></div>
      <span class="bv" style="color:${col}">${labf(s)}</span></div>`;});
  h+=`</div>`;return h;
}
function miniBar(t,v,max,lab){return `<div class="barrow"><span class="bl">${esc(t.name)}</span>
  <div class="bartrk"><div class="barfil" style="width:${Math.max(3,v/max*100)}%"></div></div><span class="bv">${lab}</span></div>`;}

  const rec={};teams.forEach(a=>{rec[a.id]={};teams.forEach(b=>rec[a.id][b.id]={w:0,l:0});});
  ST.played.forEach(m=>{const hs=m.homeScore,as=m.awayScore;
    if(hs>as){rec[m.homeTeamId][m.awayTeamId].w++;rec[m.awayTeamId][m.homeTeamId].l++;}
    else if(as>hs){rec[m.awayTeamId][m.homeTeamId].w++;rec[m.homeTeamId][m.awayTeamId].l++;}});
  let h=`<div class="matrix"><table><thead><tr><th style="text-align:left">↓ vs →</th>`;
  teams.forEach(t=>h+=`<th title="${esc(t.name)}">${badge(t)}</th>`);
  h+=`<th>Tot</th></tr></thead><tbody>`;
  teams.forEach(a=>{let tw=0,tl=0;h+=`<tr><td style="text-align:left">${teamLine(a)}</td>`;
    teams.forEach(b=>{if(a.id===b.id){h+=`<td class="diag">—</td>`;return;}
      const r=rec[a.id][b.id];tw+=r.w;tl+=r.l;
      const txt=(r.w||r.l)?`${r.w}-${r.l}`:"·";
      const c=r.w>r.l?"var(--win)":r.l>r.w?"var(--loss)":"var(--ink-2)";
      h+=`<td style="color:${c};font-weight:${(r.w||r.l)?700:400}">${txt}</td>`;});
    h+=`<td class="mono" style="font-weight:700">${tw}-${tl}</td></tr>`;});
  h+=`</tbody></table></div><div class="metricnote">Read across a row for that team's record vs each opponent.</div>`;
  return el(html+h);
};

/* ---- RECORDS ---- */
VIEWS.records=function(){
  let html=shead("League Almanac","Record Book",ST.started?`2026 season · through Week ${Math.max(...ST.weeks)}`:"");
  if(!ST.started) return el(html+`<div style="margin-top:4px">${emptyState("trophy","The record book is empty — for now","Single-week highs and lows, biggest blowouts, nail-biters, and season bests will be logged here as the weeks roll in.")}</div>`);
  // one row per game, winner/loser resolved
  const G=ST.played.map(m=>{const hw=m.homeScore>=m.awayScore;
    return {wk:m.week,tie:m.homeScore===m.awayScore,margin:Math.abs(m.homeScore-m.awayScore),total:m.homeScore+m.awayScore,
      w:{t:teamById[hw?m.homeTeamId:m.awayTeamId],sc:hw?m.homeScore:m.awayScore},
      l:{t:teamById[hw?m.awayTeamId:m.homeTeamId],sc:hw?m.awayScore:m.homeScore}};}).filter(g=>g.w.t&&g.l.t);
  // one row per team score
  const P=[];G.forEach(g=>{P.push({t:g.w.t,sc:g.w.sc,wk:g.wk,opp:g.l.t,osc:g.l.sc,res:g.tie?"T":"W"});P.push({t:g.l.t,sc:g.l.sc,wk:g.wk,opp:g.w.t,osc:g.w.sc,res:g.tie?"T":"L"});});
  const by=(a,f,dir)=>a.slice().sort((x,y)=>dir*(f(x)-f(y)));
  const hi=by(P,x=>x.sc,-1)[0], lo=by(P,x=>x.sc,1)[0];
  const blow=by(G,g=>g.margin,-1)[0], close=by(G,g=>g.margin,1)[0];
  const shoot=by(G,g=>g.total,-1)[0], snooze=by(G,g=>g.total,1)[0];
  const bestLoss=by(P.filter(p=>p.res==="L"),p=>p.sc,-1)[0], worstWin=by(P.filter(p=>p.res==="W"),p=>p.sc,1)[0];
  let wS={n:0},lS={n:0};
  Object.values(ST.S).forEach(s=>{let cw=0,cl=0,ws=0,ls=0;
    s.results.forEach(r=>{
      if(r.r==="W"){if(!cw)ws=r.wk;cw++;cl=0;if(cw>wS.n)wS={n:cw,t:s.team,from:ws,to:r.wk};}
      else if(r.r==="L"){if(!cl)ls=r.wk;cl++;cw=0;if(cl>lS.n)lS={n:cl,t:s.team,from:ls,to:r.wk};}
      else{cw=0;cl=0;}});});
  const vs=(g,note)=>`<div class="vsline ${g.tie?"":"win"}">${badge(g.w.t)}<span class="nm">${esc(g.w.t.name)}</span><span class="sc2">${fmt(g.w.sc,1)}</span></div>
     <div class="vsline ${g.tie?"":"lose"}">${badge(g.l.t)}<span class="nm">${esc(g.l.t.name)}</span><span class="sc2">${fmt(g.l.sc,1)}</span></div>
     <div class="rec-foot">Week ${g.wk} · ${note}</div>`;
  const one=(p,note)=>`<div class="vsline">${badge(p.t)}<span class="nm">${esc(p.t.name)}</span><span class="sc2" style="color:var(--ink-3);font-weight:500;font-size:12.5px">${esc(p.t.owner||"")}</span></div>
     <div class="rec-foot">Week ${p.wk} · ${p.res==="W"?"beat":p.res==="L"?"lost to":"tied"} ${esc(p.opp.name)} ${fmt(p.sc,1)}–${fmt(p.osc,1)}${note?" · "+note:""}</div>`;
  const streakFoot=(x,ch)=>`<div class="vsline">${badge(x.t)}<span class="nm">${esc(x.t.name)}</span><span class="sc2" style="color:var(--ink-3);font-weight:500;font-size:12.5px">${esc(x.t.owner||"")}</span></div><div class="rec-foot">Weeks ${x.from}–${x.to}${ST.S[x.t.id].streak===ch+x.n?" · still active":""}</div>`;
  const card=(ic,lab,val,unit,body)=>`<div class="kpi rec"><div class="k-label" style="display:flex;align-items:center;gap:6px"><span style="display:inline-flex;font-size:14px">${icon(ic)}</span>${lab}</div><div class="k-val num">${val}${unit?`<small>${unit}</small>`:""}</div>${body}</div>`;
  let h=`<div class="sub-h" style="margin-top:4px">Single-Game Records</div><div class="grid g-rec">`;
  h+=card("flame","Highest Score",fmt(hi.sc,1),"pts",one(hi,""));
  h+=card("arrow-down","Lowest Score",fmt(lo.sc,1),"pts",one(lo,""));
  h+=card("zap","Biggest Blowout",fmt(blow.margin,1),"pt margin",vs(blow,`${esc(blow.w.t.name)} won by ${fmt(blow.margin,1)}`));
  h+=card("target","Closest Game",fmt(close.margin,2),"pt margin",vs(close,close.tie?"ended in a tie":`${esc(close.w.t.name)} won by ${fmt(close.margin,2)}`));
  h+=card("activity","Highest Combined",fmt(shoot.total,1),"pts",vs(shoot,`${fmt(shoot.w.sc,1)} + ${fmt(shoot.l.sc,1)} combined`));
  h+=card("clock","Lowest Combined",fmt(snooze.total,1),"pts",vs(snooze,`${fmt(snooze.w.sc,1)} + ${fmt(snooze.l.sc,1)} combined`));
  if(bestLoss)h+=card("flag","Most Points in a Loss",fmt(bestLoss.sc,1),"pts",one(bestLoss,"still lost"));
  if(worstWin)h+=card("checkcircle","Fewest Points in a Win",fmt(worstWin.sc,1),"pts",one(worstWin,"still won"));
  h+=`</div><div class="sub-h">Streaks</div><div class="grid g-rec">`;
  if(wS.n)h+=card("arrow-up","Longest Win Streak",wS.n,"in a row",streakFoot(wS,"W"));
  if(lS.n)h+=card("arrow-down","Longest Losing Streak",lS.n,"in a row",streakFoot(lS,"L"));
  h+=`</div>`;
  const list=(rows,row)=>rows.map((r,i)=>`<div class="lbrow"><span class="rankcol ${i===0?"top":""}" style="width:16px">${i+1}</span>${row(r)}</div>`).join("");
  const scoreRow=p=>`${badge(p.t)}<div style="min-width:0;flex:1"><div class="nm" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.t.name)}</div><div class="ow" style="font-size:12.5px;color:var(--ink-3)">Wk ${p.wk} · ${p.res==="W"?"beat":p.res==="L"?"lost to":"tied"} ${esc(p.opp.name)}</div></div><span class="num" style="font-weight:700">${fmt(p.sc,1)}</span>`;
  const gameRow=g=>`<div style="min-width:0;flex:1"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.w.t.name)} <span style="color:var(--ink-3);font-weight:500">def.</span> ${esc(g.l.t.name)}</div><div style="font-size:12.5px;color:var(--ink-3)">Wk ${g.wk} · ${fmt(g.w.sc,1)}–${fmt(g.l.sc,1)}</div></div><span class="num" style="font-weight:700">${fmt(g.margin,1)}</span>`;
  h+=`<div class="sub-h">Top 5</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))">`;
  h+=`<div class="card card-p"><div class="k-label" style="margin-bottom:4px">Highest single-week scores</div>${list(by(P,x=>x.sc,-1).slice(0,5),scoreRow)}</div>`;
  h+=`<div class="card card-p"><div class="k-label" style="margin-bottom:4px">Lowest single-week scores</div>${list(by(P,x=>x.sc,1).slice(0,5),scoreRow)}</div>`;
  h+=`<div class="card card-p"><div class="k-label" style="margin-bottom:4px">Biggest margins of victory</div>${list(by(G,g=>g.margin,-1).slice(0,5),gameRow)}</div>`;
  h+=`<div class="card card-p"><div class="k-label" style="margin-bottom:4px">Closest finishes</div>${list(by(G,g=>g.margin,1).slice(0,5),gameRow)}</div>`;
  h+=`</div><div class="sub-h">Week by Week</div><div class="twrap"><table><thead><tr><th class="no-sort">Wk</th><th class="no-sort" style="text-align:left">Top scorer</th><th class="no-sort">Pts</th><th class="no-sort" style="text-align:left">Low scorer</th><th class="no-sort">Pts</th><th class="no-sort">League avg</th><th class="no-sort" style="text-align:left">Closest game</th></tr></thead><tbody>`;
  ST.weeks.forEach(wk=>{const ps=P.filter(p=>p.wk===wk);if(!ps.length)return;
    const t=by(ps,p=>p.sc,-1)[0],b=by(ps,p=>p.sc,1)[0],avg=ps.reduce((a,p)=>a+p.sc,0)/ps.length,c=by(G.filter(g=>g.wk===wk),g=>g.margin,1)[0];
    h+=`<tr><td class="num">${wk}</td><td><div class="teamline">${badge(t.t)}<span class="nm">${esc(t.t.name)}</span></div></td><td class="num" style="color:var(--win);font-weight:700">${fmt(t.sc,1)}</td>
      <td style="text-align:left"><div class="teamline">${badge(b.t)}<span class="nm">${esc(b.t.name)}</span></div></td><td class="num" style="color:var(--loss);font-weight:700">${fmt(b.sc,1)}</td>
      <td class="num">${fmt(avg,1)}</td><td style="text-align:left;font-size:12.5px">${c?`${esc(c.w.t.name)} over ${esc(c.l.t.name)} by <b>${fmt(c.margin,2)}</b>`:""}</td></tr>`;});
  h+=`</tbody></table></div><div class="metricnote">Finalized weeks only. Live scores count once the week locks. Margin = winner's score minus loser's.</div>`;
  return el(html+h);
};
function recCard(ic,l,v,s){return `<div class="kpi"><div class="k-label" style="display:flex;align-items:center;gap:6px"><span style="color:var(--accent);display:inline-flex;font-size:14px">${icon(ic)}</span>${l}</div><div class="k-val">${esc(v)}</div><div class="k-sub">${esc(s)}</div></div>`;}

/* ---- HISTORY / DYNASTY ---- */
const OPAL=["#e0a417","#2f9e5c","#3b7dd8","#c23b52","#7b5ea7","#2aa198","#c0562e","#5a8f2f","#b8437f","#4a6fa5","#8a7a2f","#586d8a","#b06a3a"];
function ohash(id){let h=0;const s=String(id||"");for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function ownerColor(id){return OPAL[ohash(id)%OPAL.length];}
function ownerInit(name){const w=String(name||"?").replace(/[^A-Za-z0-9 ]/g,"").trim().split(/\s+/).filter(Boolean);return((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase();}
function obadge(o,cls=""){return `<span class="tb ${cls}" style="--tc:${ownerColor(o.ownerId)}">${esc(ownerInit(o.name))}</span>`;}
let histSort="titles", histYear=null, rivalOwner=null;
VIEWS.history=function(){
  const H=D.history;
  if(!H||!H.seasons||!H.seasons.length) return el(shead("Archive","League History")+emptyState("book","No history available",""));
  const owners=H.owners.slice(), seasons=H.seasons, span=D.meta.historySpan;
  const ownerById={};owners.forEach(o=>ownerById[o.ownerId]=o);
  const latest=seasons[seasons.length-1];
  if(histYear==null)histYear=latest.year;
  const champ=latest.standings[0];
  let html=shead(`${span[0]}–${span[1]} · ${seasons.length} Seasons`,"League History",`${owners.length} managers all-time`);
  // defending champ hero
  const champOwner=ownerById[champ.ownerId]||{name:champ.team,ownerId:champ.ownerId};
  html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--accent-soft)">
      <div style="font-size:30px;color:var(--accent);display:flex;align-items:center">${icon("trophy")}</div>
      <div><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">Defending Champion · ${latest.year}</div>
        <div style="font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:-.02em;margin-top:2px">${esc(champ.team)}</div>
        <div style="color:var(--ink-2);font-size:13px">${esc(champOwner.name)} · ${champ.w}-${champ.l}${champ.t?"-"+champ.t:""} · ${fmt(champ.pf,1)} PF</div></div>
    </div></div>`;
  // superlatives
  const byTitles=owners.slice().sort((a,b)=>b.titles-a.titles||wp(b)-wp(a));
  const elig=owners.filter(o=>o.seasons>=3);
  const bestWp=elig.slice().sort((a,b)=>wp(b)-wp(a))[0];
  const mostPo=owners.slice().sort((a,b)=>b.playoffs-a.playoffs)[0];
  let bestSeason=null,mostPF=null;
  seasons.forEach(s=>s.standings.forEach(r=>{if(!bestSeason||r.pf>bestSeason.pf)bestSeason={...r,year:s.year};}));
  owners.forEach(o=>{if(!mostPF||o.pf>mostPF.pf)mostPF=o;});
  html+=`<div class="grid g-kpi">
    ${recCard("crown","Most Titles",byTitles[0].titles+"×",byTitles[0].name)}
    ${recCard("line","Best Win %",fmt(wp(bestWp)*100,1)+"%",bestWp.name)}
    ${recCard("ticket","Most Playoffs",mostPo.playoffs+"×",mostPo.name)}
    ${recCard("flame","Top Scoring Season",fmt(bestSeason.pf,0),bestSeason.team+" · "+bestSeason.year)}
    ${recCard("bars","Most Career Points",fmt(mostPF.pf,0),mostPF.name)}
  </div>`;
  // champions timeline
  html+=`<div class="sub-h">Champions</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">`;
  seasons.slice().reverse().forEach(s=>{
    const c=s.standings[0];const o=ownerById[c.ownerId]||{name:c.team,ownerId:c.ownerId};
    const def=s.year===latest.year;
    html+=`<div class="card card-p" style="text-align:center;padding:14px 12px;${def?"border-color:var(--accent);background:linear-gradient(160deg,var(--accent-soft),var(--surface))":""}">
      <div style="font-family:var(--font-display);font-weight:900;font-size:22px;color:${def?"var(--accent)":"var(--ink-3)"};letter-spacing:-.02em">${s.year}</div>
      <div style="margin:8px auto 6px">${obadge(o,"lg")}</div>
      <div style="font-weight:800;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.team)}</div>
      <div style="font-size:12.5px;color:var(--ink-2);margin-top:2px">${esc(o.name)}</div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px" class="mono">${c.w}-${c.l}${c.t?"-"+c.t:""}</div></div>`;
  });
  html+=`</div>`;
  // ---- title drought ----
  const lastYear=latest.year;
  const champYears={};
  seasons.forEach(s=>{const c=s.standings[0];(champYears[c.ownerId]=champYears[c.ownerId]||[]).push(s.year);});
  const winners=[],chasers=[];
  owners.forEach(o=>{
    const ys=(champYears[o.ownerId]||[]).slice().sort((a,b)=>a-b);
    if(ys.length){const lt=ys[ys.length-1];winners.push({o,last:lt,drought:lastYear-lt,titles:ys.length});}
    else chasers.push({o,seasons:o.seasons});
  });
  winners.sort((a,b)=>b.drought-a.drought);
  chasers.sort((a,b)=>b.seasons-a.seasons);
  const longest=winners.filter(w=>w.drought>0).sort((a,b)=>b.drought-a.drought)[0];
  html+=`<div class="sub-h">Title Droughts</div>`;
  if(longest) html+=`<div class="grid g-kpi" style="margin-bottom:14px">
    ${recCard("clock","Longest Active Drought",longest.drought+" yrs",longest.o.name+" · since "+longest.last)}
    ${recCard("trophy","Reigning Champ","0 yrs",latest.standings[0].team)}
    ${recCard("clock","Longest Wait For A First",(chasers[0]?chasers[0].seasons+" yrs":"—"),(chasers[0]?chasers[0].o.name:"everyone has a ring"))}
  </div>`;
  html+=`<div class="grid g-2">`;
  html+=`<div class="card card-p"><div class="k-label" style="margin-bottom:8px">Years since last title · former champs</div>`;
  winners.forEach(w=>{const reign=w.drought===0;
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);${w.o.active2026?"":"opacity:.5"}">
      ${obadge(w.o)}<div style="min-width:0;flex:1"><div class="nm" style="font-size:13.5px">${esc(w.o.name)}${w.o.active2026?"":' <span class="pill pos" style="font-size:9px">left</span>'}</div>
      <div class="ow">${w.titles}× champ · last ${w.last}</div></div>
      <span class="pill ${reign?"w":w.drought>=5?"l":"pos"}">${reign?"Reigning":w.drought+" yr"}</span></div>`;});
  html+=`</div>`;
  html+=`<div class="card card-p"><div class="k-label" style="margin-bottom:8px">Chasing their first ring</div>`;
  if(!chasers.length) html+=`<div style="color:var(--ink-3);font-size:13px;padding:8px 0">Everyone in the league has won it all.</div>`;
  chasers.forEach(c=>{
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);${c.o.active2026?"":"opacity:.5"}">
      ${obadge(c.o)}<div style="min-width:0;flex:1"><div class="nm" style="font-size:13.5px">${esc(c.o.name)}${c.o.active2026?"":' <span class="pill pos" style="font-size:9px">left</span>'}</div>
      <div class="ow">best finish ${c.o.bestFinish?ordinal(c.o.bestFinish):"—"}</div></div>
      <span class="pill pos">${c.seasons} seas</span></div>`;});
  html+=`</div></div>`;
  // all-time leaderboard
  html+=`<div class="sub-h">All-Time Leaderboard</div>`;
  html+=`<div class="wkbar"><span style="font-size:12px;color:var(--ink-3);font-weight:600">SORT</span><div class="seg" id="hsort">`+
    [["titles","Titles"],["wp","Win %"],["pf","Points"],["avg","Avg Finish"]].map(x=>`<button class="${histSort===x[0]?"on":""}" data-s="${x[0]}">${x[1]}</button>`).join("")+`</div></div>`;
  owners.sort((a,b)=> histSort==="titles"?(b.titles-a.titles||wp(b)-wp(a)) : histSort==="wp"?wp(b)-wp(a) : histSort==="pf"?b.pf-a.pf : (a.avgFinish??99)-(b.avgFinish??99));
  html+=`<div class="twrap"><table><thead><tr><th class="no-sort">#</th><th class="no-sort">Manager</th><th class="no-sort" title="Championships"><span style="font-size:14px;display:inline-flex;vertical-align:middle">${icon("trophy")}</span></th><th class="no-sort">W-L</th><th class="no-sort">PCT</th><th class="no-sort">Seas</th><th class="no-sort">PF</th><th class="no-sort">PF/G</th><th class="no-sort">PO</th><th class="no-sort">Best</th><th class="no-sort">Avg</th></tr></thead><tbody>`;
  owners.forEach((o,i)=>{const g=o.w+o.l+o.t;
    html+=`<tr>
      <td class="rankcol ${i<3?"top":""}">${i+1}</td>
      <td><div class="teamline">${obadge(o)}<div style="min-width:0"><div class="nm">${esc(o.name)}${o.active2026?"":' <span class="pill pos" style="font-size:9px">left</span>'}</div>${o.active2026&&o.team2026?`<div class="ow">${esc(o.team2026)}</div>`:""}</div></div></td>
      <td class="lead" style="color:${o.titles?"var(--accent)":"var(--ink-3)"};font-weight:800">${o.titles||"—"}</td>
      <td class="num">${o.w}-${o.l}${o.t?"-"+o.t:""}</td>
      <td class="num">${fmt(wp(o),3).replace(/^0/,"")}</td>
      <td class="num">${o.seasons}</td>
      <td class="num">${fmt(o.pf,0)}</td>
      <td class="num">${g?fmt(o.pf/g,1):"—"}</td>
      <td class="num">${o.playoffs}</td>
      <td class="num">${o.bestFinish?ordinal(o.bestFinish):"—"}</td>
      <td class="num">${o.avgFinish!=null?fmt(o.avgFinish,1):"—"}</td></tr>`;});
  html+=`</tbody></table></div>`;
  html+=`<div class="metricnote"><b>PCT</b> win % (ties½). <b>PO</b> playoff appearances. <b>Best/Avg</b> final finish across seasons. Managers are tracked by ESPN owner ID, so records follow the person even when the team name changes. <span class="pill pos" style="font-size:9px">left</span> = no longer in the league.</div>`;
  // ---- all-time rivalries (by final standings) ----
  const rankOY={},pfOY={};
  seasons.forEach(s=>s.standings.forEach(r=>{(rankOY[r.ownerId]=rankOY[r.ownerId]||{})[s.year]=r.rank;(pfOY[r.ownerId]=pfOY[r.ownerId]||{})[s.year]=r.pf;}));
  if(rivalOwner==null)rivalOwner=owners[0].ownerId;

  }catch{parlayError='Parlay history is unavailable. Please try again.';const e=document.getElementById('lbMiss');if(e)e.textContent=parlayError;const box=document.getElementById('plList');if(box)box.textContent=parlayError;refreshParlayResults();}
  if(!__initParlay.poll){__initParlay.poll=setInterval(()=>{if(!document.hidden&&["dash","parlay","parlayresults","myteam","teams"].includes(cur))fetchParlayHistory().catch(()=>{});},10000);}
}
// One leg per week (the latest submission counts); success rate is hits over graded legs.
function parlayRecord(tid){
  const rows=parlayHistory.filter(p=>p.teamId===tid).sort((a,b)=>b.week-a.week||Date.parse(b.created_at)-Date.parse(a.created_at)||b.id-a.id),latest=[],weeks=new Set();
  rows.forEach(p=>{if(!weeks.has(p.week)){weeks.add(p.week);latest.push(p);}});
  const wins=latest.filter(p=>p.result==='won').length,losses=latest.filter(p=>p.result==='lost').length,voids=latest.filter(p=>p.result==='void').length,settled=wins+losses;
  return {latest,wins,losses,voids,pending:latest.length-settled-voids,settled,rate:settled?wins/settled:null};
}
const PARLAY_RESULT={won:['Hit','var(--win)'],lost:['Miss','var(--loss)'],void:['Void','var(--ink-3)'],pending:['Pending','var(--ink-3)']};
// Team profile dropdown: the summary line is the record, the body lists every week's pick.
function managerHistoryHtml(tid){
  if(!parlayLoaded)return `<summary><span>Parlay results</span><small>${parlayError?'Unavailable':'Loading…'}</small></summary><p class="metricnote">${parlayError||'Loading parlay history…'}</p>`;
  const r=parlayRecord(tid);
  if(!r.latest.length)return '<summary><span>Parlay results</span><small>No picks yet</small></summary><p class="metricnote">No picks submitted this season.</p>';
  const row=p=>{const [label,tone]=PARLAY_RESULT[p.result]||PARLAY_RESULT.pending;
    return `<div class="tp-row"><span class="tp-wk">Wk ${p.week}</span><span class="tp-pick">${esc(p.pick)}${p.odds?` <em>${esc(p.odds)}</em>`:''}</span><b style="color:${tone}">${label}</b></div>`;};
  return `<summary><span>Parlay results</span><small>${r.wins}-${r.losses}${r.settled?' · '+fmt(r.rate*100,0)+'%':''}</small></summary>
    <div class="tp-body"><p class="metricnote">${r.settled?`${fmt(r.rate*100,0)}% success rate · ${r.wins} ${r.wins===1?'hit':'hits'}, ${r.losses} ${r.losses===1?'miss':'misses'}`:'No graded picks yet'}${r.voids?` · ${r.voids} void`:''}${r.pending?` · ${r.pending} pending`:''}. Pending and void picks don't count toward the rate.</p>${r.latest.map(row).join('')}</div>`;
}

/* ---- PARLAY RESULTS: success rate by manager ---- */
function parlayResultsHtml(){
  if(!parlayLoaded)return `<div class="card card-p"><p class="metricnote" style="margin:0">${parlayError||'Loading parlay history…'}</p></div>`;
  const rows=D.teams.map(t=>({t,...parlayRecord(t.id)})).sort((a,b)=>(b.rate??-1)-(a.rate??-1)||b.wins-a.wins||a.losses-b.losses||(a.t.owner||a.t.name).localeCompare(b.t.owner||b.t.name));
  const wins=rows.reduce((n,r)=>n+r.wins,0),settled=rows.reduce((n,r)=>n+r.settled,0);
  if(!settled)return emptyState('dice','No graded picks yet','Success rates appear once the first week of parlay picks is graded.');
  const weeks=[...new Set(parlayHistory.map(p=>p.week))].sort((a,b)=>a-b).map(w=>({w,legs:currentParlayLegs(parlayHistory.filter(p=>p.week===w))}));
  const graded=weeks.filter(x=>{const active=x.legs.filter(p=>p.result!=='void');return active.some(p=>p.result==='lost')||(active.length&&active.every(p=>p.result==='won'));});
  const cashed=graded.filter(x=>!x.legs.some(p=>p.result==='lost')).length;
  let h=`<div class="card card-p pr-tiles">${tstat(fmt(wins/settled*100,0)+'%','League hit rate')}${tstat(`${wins} of ${settled}`,'Legs hit')}${tstat(`${cashed} of ${graded.length}`,'Parlays cashed')}</div>`;
  h+=`<section class="card card-p pr-chart"><h3>Success rate by manager</h3><p class="metricnote" style="margin:0 0 6px">Share of graded picks that hit. Tap a manager to see their picks.</p>`;
  h+=rows.map(r=>`<div class="barrow" data-tid="${r.t.id}" role="link" tabindex="0" aria-label="${esc(r.t.owner||r.t.name)}: ${r.settled?fmt(r.rate*100,0)+'% success, '+r.wins+' of '+r.settled+' picks hit':'no graded picks'}"><span class="bl">${esc(r.t.owner||r.t.name)}</span><div class="bartrk"><div class="barfil" style="width:${r.rate?Math.max(2,r.rate*100):0}%"></div></div><span class="bv">${r.settled?`<b>${fmt(r.rate*100,0)}%</b> <small>${r.wins}-${r.losses}</small>`:'<small>No graded picks</small>'}</span></div>`).join('');
  h+=`</section>`;
  h+=`<section class="card card-p pr-weeks"><h3>Week by week</h3>${weeks.filter(x=>x.w===parlayWeek||x.legs.some(p=>p.result&&p.result!=='pending')).reverse().map(x=>{const st=parlayStatus(x.legs),hit=x.legs.filter(p=>p.result==='won').length,waiting=x.legs.filter(p=>!p.result||p.result==='pending').length;
    return `<div class="pr-week"><b>Week ${x.w}</b><span>${hit} of ${x.legs.length} legs hit${waiting?` · ${waiting} pending`:''}</span><small style="color:${st.tone}">${esc(st.label.split(' · ')[0])}</small></div>`;}).join('')}</section>`;
  return h;
}
VIEWS.parlayresults=function(){
  const v=el(shead('Extras','Parlay Results','Who picks winners')+`<div data-parlay-results>${parlayResultsHtml()}</div>`);
  v.querySelector('[data-parlay-results]').onkeydown=e=>{const n=e.target.closest('[data-tid]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();goTeam(+n.dataset.tid);}};
  return v;
};
function refreshParlayResults(){
  document.querySelectorAll('[data-manager-history]').forEach(n=>{n.innerHTML=managerHistoryHtml(+n.dataset.managerHistory);});
  document.querySelectorAll('[data-parlay-results]').forEach(n=>{n.innerHTML=parlayResultsHtml();});
}

/* ---- PLAYOFF ODDS ---- */
VIEWS.odds=function(){
  let html=shead("Rest of Season","Playoff Odds",ST.started?"":"Starts after Week 1");
  if(!ST.started) return el(html+emptyState("dice","No games played yet","Playoff odds need at least one finalized week of scores."));
  const baseline=playoffOdds(),O=PLAYOFF_SCENARIO?playoffOdds(PLAYOFF_SCENARIO):baseline;
  const remaining=D.schedule.filter(x=>x.week<=(D.meta.regularSeasonWeeks||14)&&!(x.winner&&x.winner!=='UNDECIDED'));
  html+=`<section class="card card-p mx-scenario"><div class="eyebrow">Explore the path</div><h3>What if this result happens?</h3><label>Force one remaining result <select id="oddsScenario"><option value="">Baseline · all results simulated</option>${remaining.flatMap(x=>[x.homeTeamId,x.awayTeamId].map(id=>`<option value="${x.id}:${id}" ${PLAYOFF_SCENARIO?.match===x.id&&PLAYOFF_SCENARIO.winner===id?'selected':''}>Week ${x.week}: ${esc(teamById[id]?.name||'Team')} wins</option>`)).join('')}</select></label><p class="metricnote">The selected winner is fixed in every simulation. Scoring and other games keep the baseline assumptions; this is a result scenario, not a conditional player forecast. ESPN tiebreak rules may differ.</p>${PLAYOFF_SCENARIO?`<div class="twrap"><table><thead><tr><th>Team</th><th>Baseline playoffs</th><th>Scenario playoffs</th><th>Change</th></tr></thead><tbody>${O.rows.map(r=>{const b=baseline.rows.find(x=>x.id===r.id);return `<tr><td>${esc(r.team.name)}</td><td>${fmt(b.po*100,1)}%</td><td>${fmt(r.po*100,1)}%</td><td>${r.po>=b.po?'+':''}${fmt((r.po-b.po)*100,1)} pp</td></tr>`;}).join('')}</tbody></table></div>`:''}</section>`;
  html+=`<details class="explain"><summary>How the odds are calculated</summary><div class="ex-grid">
    <div class="ex-item"><h4>${O.N.toLocaleString()} simulated seasons</h4><p>Every remaining regular-season game (${O.remaining} left) is played out ${O.N.toLocaleString()} times with random scores, and we count how often each team finishes in the top ${O.P}.</p></div>
    <div class="ex-item"><h4>Scores</h4><p>Each team's random score is centered on its scoring average, with its own week-to-week spread. Early in the season both are pulled toward the league average so one big week doesn't dominate. This week's games start from ESPN's projected totals and live scores.</p></div>
    <div class="ex-item"><h4>Seeding</h4><p>Teams are ranked by wins (ties count half), then total points, the same order as the Standings page. ESPN's own tiebreakers can differ in rare ties.</p></div>
    <div class="ex-item"><h4>Clinched and Eliminated</h4><p>These are exact, not simulated: every possible win/loss result of the remaining games is checked. <b>Eliminated</b> = in every possible outcome at least ${O.P} teams finish with more wins. <b>Clinched</b> = no possible outcome puts ${O.P} other teams level with or ahead of them. Ties on wins count against the team, since points can't be known ahead.</p></div>
  </div></details>`;
  html+=`<div class="twrap"><table><thead><tr><th class="no-sort">#</th><th class="no-sort">Team</th><th class="no-sort">Record</th><th class="no-sort">Proj. record</th><th class="no-sort" style="text-align:left">Make playoffs</th><th class="no-sort">Top 2</th><th class="no-sort">#1 seed</th></tr></thead><tbody>`;
  O.rows.forEach((r,i)=>{const s=ST.S[r.id];
    html+=`<tr class="${i===O.P-1?"playoff-line":""}"><td class="rankcol ${i<3?"top":""}">${i+1}</td><td>${teamLine(r.team)}</td>
      <td class="num">${s.w}-${s.l}${s.tie?"-"+s.tie:""}</td><td class="num">${fmt(r.ew,1)}-${fmt(r.el,1)}</td>
      <td style="text-align:left;min-width:170px"><div style="display:flex;align-items:center;gap:9px"><div class="oddbar"><span style="width:${Math.max(1.5,r.po*100)}%"></span></div><b class="num" style="width:78px;text-align:right">${r.clinched?'<span class="tag-in">Clinched</span>':r.eliminated?'<span class="tag-out">Eliminated</span>':r.po>=0.999?">99.9%":r.po<=0.001?"<0.1%":fmt(r.po*100,r.po>0.995||r.po<0.005?1:0)+"%"}</b></div></td>
      <td class="num">${fmt(r.top2*100,0)}%</td><td class="num">${fmt(r.first*100,0)}%</td></tr>`;});
  html+=`</tbody></table></div><div class="metricnote"><b>Proj. record</b> = average final record across the simulations. <b>&lt;0.1%</b> / <b>&gt;99.9%</b> = missed / made the top ${O.P} in almost every simulation but still mathematically alive / not yet locked. <b>Clinched</b> / <b>Eliminated</b> are exact. Odds update whenever new scores arrive.</div>`;
  const v=el(html);const scenario=v.querySelector('#oddsScenario');if(scenario)scenario.onchange=()=>{const [match,winner]=scenario.value.split(':').map(Number);PLAYOFF_SCENARIO=scenario.value?{match,winner}:null;setTab('odds');};return v;
};

/* ---- WIN CALCULATOR ---- */
const calcOverride={};
function gameStatus(proTeam,week){
  if(week!==D.meta.currentScoringPeriod)return "done";
  const k=(D.meta.proGames||{})[proTeam];if(!k)return "bye";
  const now=Date.now();return now<k?"pre":now<k+3.5*3600e3?"live":"done";
}

// Keep unplayed games distinct from an actual zero-point performance.
function playerScorePending(r,week){
  if(r.pts!=null&&r.pts!==0)return false;
  return week>D.meta.currentScoringPeriod||(week===D.meta.currentScoringPeriod&&["pre","bye"].includes(gameStatus(r.pro,week)));
}
function playerScoreText(r,week){return playerScorePending(r,week)?"—":r.pts==null?"—":fmt(r.pts,1);}

function jumpScare(){
  if(document.querySelector(".jumpscare"))return;
  const ov=document.createElement("div");ov.className="jumpscare";ov.innerHTML=`<div class="js-shake"><img class="js-img" alt="" src="${SCARY_IMG}"></div>`;
  document.body.appendChild(ov);
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){const ctx=new AC();if(ctx.state==="suspended"){try{ctx.resume();}catch(e){}}const t=ctx.currentTime;
    const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.9),ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,1.4);
    const ns=ctx.createBufferSource();ns.buffer=buf;const ng=ctx.createGain();ng.gain.value=0.45;ns.connect(ng).connect(ctx.destination);ns.start(t);
    const o=ctx.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(920,t);o.frequency.exponentialRampToValueAtTime(85,t+0.8);const og=ctx.createGain();og.gain.setValueAtTime(0.0001,t);og.gain.exponentialRampToValueAtTime(0.34,t+0.03);og.gain.exponentialRampToValueAtTime(0.0001,t+0.9);o.connect(og).connect(ctx.destination);o.start(t);o.stop(t+0.95);
    setTimeout(()=>{try{ctx.close();}catch(e){}},1600);
  }}catch(e){}
  const kill=()=>{if(ov.parentNode)ov.remove();document.removeEventListener("keydown",kill);};
  ov.addEventListener("click",kill);document.addEventListener("keydown",kill);
  setTimeout(kill,2000);
}

function injOf(pid){if(injOf.k!==D.meta.lastUpdated){injOf.m={};Object.values(D.rosters||{}).forEach(r=>r.forEach(p=>{injOf.m[p.playerId]=p.injury;}));injOf.k=D.meta.lastUpdated;}return injOf.m[pid]||"";}
function byeWk(pro){return pro?((D.meta.byeWeeks||{})[pro]||null):null;}
function byeTag(pro,W){W=W||D.meta.currentScoringPeriod;const b=byeWk(pro);return b&&b===W?'<span class="inj inj-bye" title="NFL bye this week">BYE</span>':"";}
function pFlags(pid,pro,W){return injTag(injOf(pid))+byeTag(pro,W);}
function pProj(pid,W){W=W||D.meta.currentScoringPeriod;const wk=(D.weekly||{})[String(W)];if(wk)for(const t in wk){const r=wk[t].find(x=>x[0]===pid);if(r)return r[3];}return null;}

// Both lineups side by side with the what-if calculator: the scoreboard's matchup sheet.
function matchupDetail(x){

  const pick=(rows)=>{const used=new Set();return STARTER_ORDER.map(sl=>{const i=rows.findIndex((r,j)=>!used.has(j)&&r.slot===sl);if(i<0)return null;used.add(i);return rows[i];});};
  const la=A&&H?pick(A):null,lh=A&&H?pick(H):null;
  const open=r=>cur&&r&&(gst(r)==="pre"||gst(r)==="live");

      const num=(r,won,c,side,left)=>{if(!r)return `<td class="pts ${c}"></td>`;
        if(open(r))return `<td class="pts ${c} ${left?"l":""}"><span class="wi-off">${playerScoreText(r,W)}${r.proj!=null?`<small>proj ${fmt(r.proj,1)}</small>`:""}</span><span class="wi-cell"><input class="wi" type="number" step="0.1" inputmode="decimal" data-side="${side}" data-k="${key(r)}" data-pts="${r.pts}" data-def="${Math.max(r.pts,r.proj!=null?r.proj:r.pts).toFixed(1)}" value="${(+guess(r)).toFixed(1)}" aria-label="${esc(r.name)} final points"><small>now ${playerScoreText(r,W)}</small></span></td>`;

  const panel=(t,score,pj,cls)=>`<div class="mx-team ${cls}"><div class="id">${badge(t,"lg")}<div><div class="nm" style="font-weight:800">${esc(t.name)}</div><div class="ow">${esc(t.owner)}</div></div></div>
    <div class="sc">${s.show?fmt(score,1):cur?"0.0":"—"}</div><div class="pj">${final?"Was projected":"Projected"} <b>${pj!=null?fmt(pj,1):"—"}</b></div></div>`;
  const wiBox=whatif?whatIfBox():"";
  return {a,h,s,W,status,whatif,content:`<div class="mx-head">${panel(a,s.as,pjA,"a")}<div class="mx-vs">vs</div>${panel(h,s.hs,pjH,"h")}</div>

}
function whatIfBox(){return `<div class="whatif"><div class="wi-h">What if?</div>

// box holds the wi-on class that shows the calculator; onToggle remembers it for the Matchup page.

/* ---------- weekly awards (player-level, from weekly lineups) ---------- */
function awardsCard(){
  if(!ST.started||!hasWeekly())return"";
  const W=Math.max(...ST.weeks),wk=D.weekly[String(W)];if(!wk)return"";
  const all=[];D.teams.forEach(t=>(wk[String(t.id)]||[]).forEach(r=>all.push({t,pid:r[0],slot:r[1],pts:r[2],proj:r[3]})));
  const st=all.filter(r=>r.slot!==20&&r.slot!==21),bn=all.filter(r=>r.slot===20);
  const top=(arr,f)=>arr.slice().sort((x,y)=>f(y)-f(x))[0];
  const who=r=>`<span class="nm">${esc(pname(r.pid))}</span> <span style="color:var(--ink-3)">(${esc(ppos(r.pid))}, ${esc(r.t.name)})</span>`;
  const tn=t=>`<span class="nm">${esc(t.name)}</span>`,g=x=>`<span style="color:var(--ink-2)">${x}</span>`;
  const row=(l,d,b,n)=>`<div class="recap-row"><span class="rl">${l}<small>${d}</small></span><span class="rv">${b}</span>${n?`<span class="rn">${n}</span>`:""}</div>`;
  let h=`<div class="card card-p" style="margin-bottom:16px"><div class="sub-h" style="margin-top:0">Week ${W} awards</div>`;
  const mvp=top(st,r=>r.pts);if(mvp)h+=row("MVP","Top-scoring starter",who(mvp)+g(` scored ${fmt(mvp.pts,1)}`),fmt(mvp.pts,1));
  const boom=top(st.filter(r=>r.proj>0),r=>r.pts-r.proj);if(boom&&boom.pts>boom.proj)h+=row("Boom","Most points above projection",who(boom)+g(` scored ${fmt(boom.pts,1)}, projected ${fmt(boom.proj,1)}`),"+"+fmt(boom.pts-boom.proj,1));
  const bust=top(st.filter(r=>r.proj>0),r=>r.proj-r.pts);if(bust&&bust.proj>bust.pts)h+=row("Bust","Furthest below projection",who(bust)+g(` scored ${fmt(bust.pts,1)}, projected ${fmt(bust.proj,1)}`),"−"+fmt(bust.proj-bust.pts,1));
  const bw=top(bn,r=>r.pts);if(bw&&bw.pts>0)h+=row("Benchwarmer","Most points left on a bench",`<span class="nm">${esc(pname(bw.pid))}</span> <span style="color:var(--ink-3)">(${esc(ppos(bw.pid))})</span>`+g(` scored ${fmt(bw.pts,1)} sitting on ${esc(bw.t.name)}'s bench`),fmt(bw.pts,1));
  if(D.faab){const ids={};D.faab.teams.forEach(ft=>ft.pickups.forEach(p=>{ids[ft.teamId+"_"+p.playerId]=1;}));
    const wh=top(st.filter(r=>ids[r.t.id+"_"+r.pid]),r=>r.pts);if(wh&&wh.pts>0)h+=row("Waiver hero","Best waiver / free-agent pickup",who(wh)+g(` scored ${fmt(wh.pts,1)} after being picked up`),fmt(wh.pts,1));}
  const G=ST.played.filter(m=>m.week===W).map(m=>{const hw=m.homeScore>m.awayScore;return {w:teamById[hw?m.homeTeamId:m.awayTeamId],l:teamById[hw?m.awayTeamId:m.homeTeamId],ws:Math.max(m.homeScore,m.awayScore),ls:Math.min(m.homeScore,m.awayScore)};});
  const hb=top(G,g=>g.ls);if(hb)h+=row("Heartbreaker","Most points in a loss",tn(hb.l)+g(` scored ${fmt(hb.ls,1)} and still lost to `)+tn(hb.w)+g(`, ${fmt(hb.ws,1)}–${fmt(hb.ls,1)}`),fmt(hb.ls,1));
  const lw=top(G,g=>-g.ws);if(lw)h+=row("Lucky win","Fewest points in a win",tn(lw.w)+g(` won with only ${fmt(lw.ws,1)}, beating `)+tn(lw.l)+g(`, ${fmt(lw.ws,1)}–${fmt(lw.ls,1)}`),fmt(lw.ws,1));

/* ---------- team page: weekly scores vs league average + power rank by week ---------- */
function teamTrend(tid){
  if(!ST.started||ST.weeks.length<2)return"";
  const s=ST.S[tid],wks=ST.weeks.filter(w=>s.weekly[w]!=null);
  const avg=w=>{const v=Object.values(ST.S).map(x=>x.weekly[w]).filter(v=>v!=null);return v.reduce((a,b)=>a+b,0)/v.length;};
  const pts=wks.map(w=>({w,me:s.weekly[w],av:avg(w)}));
  const vals=pts.flatMap(p=>[p.me,p.av]);let lo=Math.floor(Math.min(...vals)/20)*20,hi=Math.ceil(Math.max(...vals)/20)*20;if(hi===lo)hi+=20;
  const mobile=document.body.classList.contains("phone");
  const W=mobile?Math.max(260,Math.min(640,window.innerWidth-58)):640,H=mobile?260:210,L=36,R=mobile?66:86,T=32,B=30,X=i=>L+(wks.length===1?0:i*(W-L-R)/(wks.length-1)),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);

  const line=k=>pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p[k]).toFixed(1)}`).join("");
  const last=pts[pts.length-1];

  svg+=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("");
  svg+=pts.filter((p,i)=>!mobile||i%Math.max(1,Math.ceil(pts.length/5))===0||i===pts.length-1).map(p=>`<text x="${X(pts.indexOf(p))}" y="${H-8}" text-anchor="middle">W${p.w}</text>`).join("");
  svg+=`<path d="${line("av")}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  svg+=`<path d="${line("me")}" fill="none" stroke="var(--t-blue)" stroke-width="2.25" stroke-linejoin="round"/>`;
  svg+=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.me)}" r="5" fill="var(--t-blue)" stroke="var(--surface)" stroke-width="2"><title>Week ${p.w}: ${fmt(p.me,1)} pts (league avg ${fmt(p.av,1)})</title></circle><circle cx="${X(i)}" cy="${Y(p.me)}" r="14" fill="transparent"><title>Week ${p.w}: ${fmt(p.me,1)} pts (league avg ${fmt(p.av,1)})</title></circle>`).join("");
  svg+=`<text x="${X(pts.length-1)+10}" y="${Y(last.me)+4}" class="ttl">${fmt(last.me,1)}</text><text x="${X(pts.length-1)+10}" y="${Y(last.av)+(Math.abs(Y(last.av)-Y(last.me))<14?(last.av<last.me?16:-10):4)}">avg ${fmt(last.av,1)}</text>`;
  svg+=`<g transform="translate(${L},12)"><line x1="0" x2="18" y1="0" y2="0" stroke="var(--t-blue)" stroke-width="2.25"/><text x="24" y="4">This team</text><line x1="100" x2="118" y1="0" y2="0" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="124" y="4">League average</text></g></svg>`;
  // power rank after each week (same formula as the Power Rankings page)
  const saved=ST;let ranks=[];
  try{ranks=wks.map(w=>{ST=computeStats(w);const r=powerRanks().find(x=>x.team.id===tid);return {w,rank:r?r.rank:null};});}finally{ST=saved;}
  const chips=ranks.map((r,i)=>{const prev=i?ranks[i-1].rank:null,d=prev!=null&&r.rank!=null?prev-r.rank:0;
    return `<li><span>Week ${r.w}</span><b>#${r.rank??"—"}</b><span class="${d>0?"up":d<0?"dn":""}">${d>0?"↑ "+d:d<0?"↓ "+(-d):"—"}</span></li>`;}).reverse().join("");
  return `<div class="card card-p team-season-trend" style="margin-top:14px"><div class="sub-h" style="margin-top:0">Weekly scores</div>${svg}<details class="fold" open style="margin-top:12px"><summary>Weekly score details</summary><div class="fold-b twrap"><table><thead><tr><th>Week</th><th>Team</th><th>League avg</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${p.w}</td><td style="color:${p.me>=p.av?"var(--win)":"var(--loss)"}">${fmt(p.me,1)}</td><td>${fmt(p.av,1)}</td></tr>`).join("")}</tbody></table></div></details><details class="fold rank-history" open><summary>Weekly power rankings</summary><ol class="rank-history-list fold-b">${chips}</ol></details></div>`;

/* ---------- draft report card ---------- */
function draftGrades(){
  if(!hasWeekly()||!ST.started)return `<div class="helpbox"><span class="hi">${icon("clock")}</span><div>The report card needs at least one finalized week of player scores.</div></div>`;
  const pts={};ST.weeks.forEach(w=>{const wk=D.weekly[String(w)]||{};Object.values(wk).forEach(rows=>rows.forEach(r=>{pts[r[0]]=(pts[r[0]]||0)+r[2];}));});
  const picks=D.draft.map(p=>({...p,pts:pts[p.playerId]||0}));
  const ranked=picks.slice().sort((a,b)=>b.pts-a.pts);ranked.forEach((p,i)=>p.rk=i+1);
  picks.forEach(p=>{p.value=p.overall-p.rk;});
  const fair=picks.filter(p=>!p.keeper);
  const steal=fair.slice().sort((a,b)=>b.value-a.value)[0];
  const bust=fair.filter(p=>p.round<=5).sort((a,b)=>a.value-b.value)[0];
  const byTeam=D.teams.map(t=>{const mine=picks.filter(p=>p.teamId===t.id);const tot=mine.reduce((a,p)=>a+p.pts,0);
    const best=mine.filter(p=>!p.keeper).sort((a,b)=>b.value-a.value)[0],worst=mine.filter(p=>!p.keeper&&p.round<=5).sort((a,b)=>a.value-b.value)[0];return {t,tot,best,worst,n:mine.length};});
  const mean=byTeam.reduce((a,x)=>a+x.tot,0)/byTeam.length,sd=Math.sqrt(byTeam.reduce((a,x)=>a+(x.tot-mean)**2,0)/byTeam.length)||1;
  const grade=z=>z>=1.5?"A+":z>=0.9?"A":z>=0.3?"B":z>=-0.3?"C":z>=-0.9?"D":"F";
  const gcol=g=>g[0]==="A"?"var(--win)":g==="B"?"var(--t-teal)":g==="C"?"var(--t-amber)":g==="D"?"var(--t-coral)":"var(--loss)";
  const pk=p=>p?`<b>${esc(p.name)}</b> <span style="color:var(--ink-3)">${p.round}.${String(p.pickInRound).padStart(2,"0")} · ${fmt(p.pts,1)} pts</span>`:"—";
  let h=`<div class="grid g-kpi" style="margin-bottom:14px">`;
  if(steal)h+=`<div class="kpi"><div class="k-label">Steal of the draft</div><div class="k-val" style="font-size:19px;margin-top:8px">${esc(steal.name)}</div><div class="k-sub">Pick ${steal.overall} (${esc(teamById[steal.teamId].name)}) · ${ordinal(steal.rk)} in points · ${fmt(steal.pts,1)} pts</div></div>`;
  if(bust)h+=`<div class="kpi"><div class="k-label">Biggest bust</div><div class="k-val" style="font-size:19px;margin-top:8px">${esc(bust.name)}</div><div class="k-sub">Pick ${bust.overall} (${esc(teamById[bust.teamId].name)}) · ${ordinal(bust.rk)} in points · ${fmt(bust.pts,1)} pts</div></div>`;
  h+=`</div><div class="twrap"><table><thead><tr><th class="no-sort">Team</th><th class="no-sort">Grade</th><th class="no-sort">Draft pts</th><th class="no-sort" style="text-align:left">Best value</th><th class="no-sort" style="text-align:left">Worst early pick</th></tr></thead><tbody>`;
  byTeam.sort((a,b)=>b.tot-a.tot).forEach(x=>{const g=grade((x.tot-mean)/sd);
    h+=`<tr><td>${teamLine(x.t)}</td><td><span class="pill" style="background:color-mix(in srgb,${gcol(g)} 16%,transparent);color:${gcol(g)};font-weight:800;min-width:30px;justify-content:center">${g}</span></td><td class="num lead">${fmt(x.tot,1)}</td><td style="text-align:left">${pk(x.best)}</td><td style="text-align:left">${pk(x.worst)}</td></tr>`;});
  return h+`</tbody></table></div><div class="metricnote"><b>Draft pts</b> = total points scored this season by everyone a team drafted, for whichever team had them (weeks they sat in free agency don't count). <b>Grade</b> compares that total with the league average (A+ well above, F well below). <b>Value</b> = draft slot vs where the player ranks in points among all drafted players: pick 40 who ranks 5th is +35. Keepers are left out of steal/bust picks. Early picks = rounds 1–5.</div>`;
}

/* ---------- schedule swap: every team's record against every other team's schedule ---------- */
function scheduleSwap(){
  if(!ST.started)return"";
  const T=D.teams,rec=(A,X)=>{let w=0,l=0,t=0;ST.weeks.forEach(wk=>{const ox=ST.S[X].opp[wk];if(ox==null)return;const o=ox===A?X:ox;
    const a=ST.S[A].weekly[wk],b=ST.S[o].weekly[wk];if(a==null||b==null)return;if(a>b)w++;else if(a<b)l++;else t++;});return {w,l,t};};
  let h=`<div class="sub-h">Schedule Swap <span style="font-weight:400;font-size:12px;color:var(--ink-3);text-transform:none;letter-spacing:0">your record with someone else's schedule</span></div>`;
  h+=`<div class="matrix"><table><thead><tr><th style="text-align:left">Team ↓ · schedule of →</th>`+T.map(t=>`<th title="${esc(t.name)}">${badge(t)}</th>`).join("")+`</tr></thead><tbody>`;
  T.forEach(A=>{const rs=T.map(X=>({X,r:rec(A.id,X.id)}));const own=rs.find(o=>o.X.id===A.id).r;
    const best=Math.max(...rs.map(o=>o.r.w)),worst=Math.min(...rs.map(o=>o.r.w));
    h+=`<tr><td style="text-align:left">${teamLine(A)}</td>`+rs.map(o=>{const self=o.X.id===A.id,c=self?"var(--ink)":o.r.w>own.w?"var(--win)":o.r.w<own.w?"var(--loss)":"var(--ink-2)";
      return `<td style="color:${c};font-weight:${self||o.r.w===best||o.r.w===worst?800:500};${self?"background:var(--surface-3)":""}" title="${esc(A.name)} with ${esc(o.X.name)}'s schedule">${o.r.w}-${o.r.l}${o.r.t?"-"+o.r.t:""}</td>`;}).join("")+`</tr>`;});
  return h+`</tbody></table></div><div class="metricnote">Read across a row: that team's record if it had played each other team's schedule, week by week, with its own scores. The shaded cell is its real record. <span style="color:var(--win)">Green</span> = would be better off, <span style="color:var(--loss)">red</span> = worse. When the borrowed schedule meets the team itself, it plays that schedule's owner instead.</div>`;
}

    const last={};all.forEach(r=>{if(r.rank===r.size)(last[r.ownerId]=last[r.ownerId]||[]).push(r.year);});
    const lastL=Object.entries(last).sort((a,b)=>b[1].length-a[1].length).slice(0,5).map(([id,ys])=>({who:`<b>${on(id)}</b>`,sub:ys.join(", "),val:ys.length+"×"}));
    const miss=H.owners.filter(o=>o.seasons>=3).map(o=>({o,n:o.seasons-o.playoffs})).sort((a,b)=>b.n-a.n||a.o.playoffs-b.o.playoffs).slice(0,5).map(x=>({who:`<b>${esc(x.o.name)}</b>`,sub:`${x.o.playoffs} playoff trips in ${x.o.seasons} seasons`,val:x.n+" missed"}));
    const avg=H.owners.filter(o=>o.seasons>=3).sort((a,b)=>b.avgFinish-a.avgFinish).slice(0,5).map(o=>({who:`<b>${esc(o.name)}</b>`,sub:`${o.seasons} seasons`,val:fmt(o.avgFinish,1)}));
    html+=`<div class="sub-h">All-time (${H.seasons[0].year}–${H.seasons[H.seasons.length-1].year})</div><div class="grid g-2">`+shameList("Worst records","Lowest win percentage in a season.",worst)
      +shameList("Weakest offenses","Lowest points per game in a season.",lowpf)+shameList("Last-place finishes","Seasons finishing dead last.",lastL)
      +shameList("Most missed playoffs","Managers with 3+ seasons.",miss)+shameList("Worst average finish","Average final standing, 3+ seasons.",avg)+`</div>`;
    html+=`<div class="metricnote">Past seasons only have season totals, so single-game shame starts with ${D.meta.season}.</div>`;
  }
  return el(html);
};

/* ---------- per-player season production (used by player cards) ---------- */
function playerSeason(pid){
  let tot=0,gp=0,pts=[];ST.weeks.slice().sort((a,b)=>a-b).forEach(w=>{const wk=(D.weekly||{})[String(w)];if(!wk)return;
    for(const tid in wk){const r=wk[tid].find(x=>x[0]===pid);if(r){if(byeWk((D.players?.[pid]||[])[2])!==w)pts.push(r[2]);break;}}});
  pts.forEach(p=>{tot+=p;gp++;});const l3=pts.slice(-3);
  const cw=(D.weekly||{})[String(D.meta.currentScoringPeriod)];let proj=null;if(cw)for(const tid in cw){const r=cw[tid].find(x=>x[0]===pid);if(r){proj=r[3];break;}}
  return {tot,gp,avg:gp?tot/gp:0,l3:l3.length?l3.reduce((s,x)=>s+x,0)/l3.length:0,proj};
}

/* ---- live ticker: exact last-update time + next NFL kickoff ---- */
// Real kickoff times come from the data feed (meta.nflKickoffs, epoch ms) when present; otherwise
// standard 2026 slots: TNF 8:15p, Sunday 1:00p (9:30a on international weekends), MNF 8:15p ET.
function etDate(y,mo,d,h,mi){const utc=Date.UTC(y,mo-1,d,h,mi);const dst=(utc<Date.UTC(2026,10,1,6))||(utc>=Date.UTC(2027,2,14,7));return utc+(dst?4:5)*3600e3;}
function fallbackKickoffs(){
  const out=[],intl={"2026-10-04":1,"2026-10-11":1,"2026-10-18":1,"2026-10-25":1,"2026-11-08":1,"2026-11-15":1};
  const ymd=t=>{const d=new Date(t);return [d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()];};
  for(let wk=0;wk<18;wk++){
    const thu=Date.UTC(2026,8,10+wk*7);const [ty,tm,td]=ymd(thu);
    if(tm===11&&td===26){out.push(etDate(ty,tm,td,12,30));out.push(etDate(2026,11,27,15,0));}
    else if(wk<17) out.push(etDate(ty,tm,td,20,15));
    const [sy,sm,sd]=ymd(thu+3*864e5),key=`${sy}-${String(sm).padStart(2,"0")}-${String(sd).padStart(2,"0")}`;
    out.push(intl[key]?etDate(sy,sm,sd,9,30):etDate(sy,sm,sd,13,0));
    if(wk<17){const [my,mm,md]=ymd(thu+4*864e5);out.push(etDate(my,mm,md,20,15));}
  }
  return out;
}
function kickoffSlots(){
  const scheduled=[...(Array.isArray(D.meta.nflKickoffs)?D.meta.nflKickoffs:[]),...Object.values(D.meta.proGames||{})];
  const valid=scheduled.map(Number).filter(ms=>Number.isFinite(ms)&&ms>0);
  return [...new Set(valid.length?valid:fallbackKickoffs())].sort((a,b)=>a-b);
}
// NFL games kicking off at a given time (from this week's ESPN schedule saved by the cron)
function gamesAt(ms){const P=D.meta.proGames||{},G=D.meta.nflGames||{},seen=new Set(),out=[];
  Object.keys(P).forEach(t=>{if(Math.abs(P[t]-ms)>60e3||seen.has(t))return;const g=G[t];if(!g)return;seen.add(t);seen.add(g.opp);const home=g.home?t:g.opp,away=g.home?g.opp:t,hg=G[home]||g;
    out.push({away,home,venue:hg.venue,city:hg.city});});return out;}
function gamesText(ms){const g=gamesAt(ms);if(!g.length)return "";const f=g[0],first=`${f.away} @ ${f.home}${f.venue?" · "+f.venue+(f.city?", "+f.city:""):""}`;
  return g.length===1?first:`${g.length} games, incl. ${f.away} @ ${f.home}`;}
const LIVE_WINDOW=3.5*3600e3;
function dayLabel(ms){const d=new Date(ms);return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZoneName:"short"});}
function agoText(ms){const s=Math.max(0,Math.round((Date.now()-ms)/1000));if(s<60)return "just now";const m=Math.round(s/60);if(m<60)return m+" min ago";const h=Math.floor(m/60);if(h<24)return h+" hr "+(m%60)+" min ago";const d=Math.floor(h/24);return d+" day"+(d>1?"s":"")+" ago";}
function cdParts(ms){let s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;
  const p2=n=>String(n).padStart(2,"0");return (d?`${d}<span class="u">d</span>`:"")+`${p2(h)}<span class="u">h</span>${p2(m)}<span class="u">m</span>${p2(s)}<span class="u">s</span>`;}
function exactStamp(d){return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+" at "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",second:"2-digit"});}
let UPD_NEW=false;
function renderTicker(flash){
  const tk=document.getElementById('ticker');if(!tk)return;
  const upd=new Date(D.meta.lastUpdated),now=Date.now(),slots=kickoffSlots(),liveSlot=slots.filter(t=>t<=now&&now-t<LIVE_WINDOW).pop(),next=slots.find(t=>t>now),stale=!!liveSlot&&now-upd.getTime()>25*60e3;
  const scheduleKnown=(Array.isArray(D.meta.nflKickoffs)&&D.meta.nflKickoffs.length)||Object.keys(D.meta.proGames||{}).length;
  const shortTime=next?new Date(next).toLocaleDateString(undefined,{weekday:'short'})+' '+new Date(next).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'';
  tk.innerHTML=`<span class="update-inline ${stale?'stale':''}" title="${esc(exactStamp(upd))}"><span class="status-dot"></span>${stale?'Scores may be delayed · ':''}Updated ${esc(agoText(upd.getTime()))}${UPD_NEW?' · new scores':''}</span>${next?`<span class="kickoff-inline" title="${esc(dayLabel(next)+(gamesText(next)?' · '+gamesText(next):''))}">${scheduleKnown?'Kickoff':'Est. kickoff'} <b class="cd">${cdParts(next-now)}</b><span class="kickoff-time"> · ${esc(shortTime)}</span></span>`:liveSlot?'<span class="kickoff-inline live">NFL games live</span>':'<span class="kickoff-inline">Awaiting kickoff schedule</span>'}`;

  if(flash)tk.querySelector('.update-inline').classList.add('status-flash');
}
// scores the viewer last saw, so changed ones flash after an update
let PREV_SCORES=null;
function scoreSnap(){const o={};D.schedule.forEach(x=>{const s=mstate(x);if(s.show)o[x.id]=[s.hs,s.as];});return o;}
function flagUpdate(prev){

VIEWS.defense=function(){
  let html=shead("Lockdown Index","Manager Defense","Opponent scoring outcomes");
  if(!ST.started) return el(html+`<div style="margin-top:4px">${emptyState("shield","No games yet","Defensive ratings need a few matchups in the books.")}</div>`);
  const rows=Object.values(ST.S).filter(s=>s.gp>0);
  rows.forEach(s=>{let supp=0,stuffs=0,n=0;s.results.forEach(r=>{const opp=ST.S[r.opp];if(!opp)return;supp+=(opp.ppg-r.pa);if(r.pa<opp.ppg)stuffs++;n++;});s._supp=n?supp/n:0;s._stuffs=stuffs;});
  const minPA=Math.min(...rows.map(s=>s.papg)),maxPA=Math.max(...rows.map(s=>s.papg));
  const minS=Math.min(...rows.map(s=>s._supp)),maxS=Math.max(...rows.map(s=>s._supp));
  rows.forEach(s=>{const pa=maxPA>minPA?(maxPA-s.papg)/(maxPA-minPA)*100:50;const su=maxS>minS?(s._supp-minS)/(maxS-minS)*100:50;s._def=0.55*pa+0.45*su;});
  rows.sort((a,b)=>b._def-a._def);
  const grade=d=>d>=82?"A+":d>=70?"A":d>=58?"B":d>=44?"C":d>=30?"D":"F";
  const gcol=g=>g[0]==="A"?"var(--win)":g[0]==="B"?"#5a8f2f":g[0]==="C"?"var(--accent)":g[0]==="D"?"#c0562e":"var(--loss)";
  const best=rows[0],worst=rows[rows.length-1],mostStuffs=rows.slice().sort((a,b)=>b._stuffs-a._stuffs)[0];
  html+=`<div class="grid g-kpi">
    ${recCard("shield","Lockdown Manager",grade(best._def),best.team.name+" · "+fmt(best.papg,1)+" PA/G")}
    ${recCard("bars","Most Stuffs",mostStuffs._stuffs+" of "+mostStuffs.gp,mostStuffs.team.name)}
    ${recCard("target","Turnstile Award",grade(worst._def),worst.team.name+" · "+fmt(worst.papg,1)+" PA/G")}
  </div>`;
  html+=`<div class="sub-h">Defensive Ratings</div><div class="twrap"><table><thead><tr><th class="no-sort">#</th><th class="no-sort">Manager</th><th class="no-sort">DEF</th><th class="no-sort">Grade</th><th class="no-sort">PA/G</th><th class="no-sort">Held Below Avg</th><th class="no-sort">Stuffs</th></tr></thead><tbody>`;
  rows.forEach((s,i)=>{const g=grade(s._def);
    html+=`<tr><td class="rankcol ${i<3?"top":""}">${i+1}</td><td>${teamLine(s.team)}</td>
      <td class="lead num">${fmt(s._def,0)}</td>
      <td><span class="pill" style="background:color-mix(in srgb,${gcol(g)} 15%,transparent);color:${gcol(g)};font-weight:800;min-width:30px;justify-content:center">${g}</span></td>
      <td class="num">${fmt(s.papg,1)}</td>
      <td class="num" style="color:${s._supp>0?'var(--win)':s._supp<0?'var(--loss)':'var(--ink-2)'}">${(s._supp>0?'+':'')+fmt(s._supp,1)}</td>
      <td class="num">${s._stuffs}/${s.gp}</td></tr>`;});
  html+=`</tbody></table></div>`;
  html+=`<div class="metricnote"><b>DEF</b> = 0–100 composite (55% fewest points allowed + 45% opponent suppression). <b>Held Below Avg</b> = avg points below their season norm that opponents scored against this manager (+ = opponents scored below their average). <b>Stuffs</b> = games holding the opponent under their own season average.</div>`;
  return el(html);
};

function startSiteTracking(){
  if(siteSession)return;
  try{siteDevice=localStorage.getItem('mfl-tracking-device');if(!siteDevice){siteDevice=crypto.randomUUID();localStorage.setItem('mfl-tracking-device',siteDevice);}siteSession=crypto.randomUUID();}catch(e){return;}
  const opened=()=>{if(document.visibilityState==='hidden')return;if(!siteOpenedAt||Date.now()-siteOpenedAt>30*60*1000){siteSession=crypto.randomUUID();trackSite('app_open',window.matchMedia('(display-mode: standalone)').matches?'Installed app':'Browser');}siteOpenedAt=Date.now();};

  // Record successful site-content writes, never subscription keys, credentials or request headers.
  const originalFetch=window.fetch.bind(window);
  window.fetch=async(input,options)=>{
    const response=await originalFetch(input,options);
    try{const url=new URL(typeof input==='string'?input:input.url||String(input),location.href),method=(options?.method||(input instanceof Request?input.method:'GET')).toUpperCase();

        if(typeof options?.body==='string'){try{const p=JSON.parse(options.body);const safe=table==='push_queue'?{title:p.title,body:p.body,team_ids:p.team_ids}:table==='league_updates'?{message:p.message,active:p.active}:table==='site_settings'?{id:p.id,data:p.data}:table==='trade_block'?{team_id:p.team_id,listing:p.listing}:p;detail+=' '+JSON.stringify(safe);}catch(e){}}
        trackSite(table==='push_queue'?'notification_queued':'content_change',detail,'change');
      }
    }catch(e){}return response;
  };
}

// shrink phone photos to a JPEG that fits comfortably in one upload
async function feedbackPhoto(file){
  if(!file||!file.size)return null;
  if(!/^image\//.test(file.type||'image/'))throw new Error('Attach a photo or screenshot.');
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(new Error('That photo could not be read. Try a screenshot or JPEG.'));i.src=url;});
    const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.82);
  }finally{URL.revokeObjectURL(url);}
}
