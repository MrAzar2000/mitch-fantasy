<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mitch Fantasy League</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFL">
<script data-goatcounter="https://mrazar2000.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}'
        async src="https://gc.zgo.at/count.js" onload="(window.__gcq||[]).forEach(function(v){window.goatcounter.count(v)});window.__gcq=null"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============ THEME TOKENS — clean & minimal (dark default) ============ */
:root{
  --radius:14px; --radius-sm:10px;
  /* DARK is the default */
  --bg:#0f1116; --surface:#15181e; --surface-2:#1b1f27; --surface-3:#232833;
  --ink:#e9ebf0; --ink-2:#a7afbd; --ink-3:#6f7888;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --accent:#8b8cf7; --accent-bright:#a5a6ff; --accent-soft:#242647; --accent-ink:#11131a;
  --win:#43c479; --loss:#ff7a7f; --tie:#d3b34a; --neutral:#8a938a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 1px 2px rgba(0,0,0,.3),0 16px 36px -22px rgba(0,0,0,.75);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f2f3f6; --surface-3:#e9ebf0;
  --ink:#1a1d23; --ink-2:#5a6472; --ink-3:#98a1ae;
  --line:rgba(17,20,24,.08); --line-2:rgba(17,20,24,.14);
  --accent:#4f46e5; --accent-bright:#4338ca; --accent-soft:#ecebfb; --accent-ink:#ffffff;
  --win:#1f9d57; --loss:#dc4c52; --tie:#8a7a2f; --neutral:#8a938a;
  --shadow:0 1px 2px rgba(17,20,24,.05);
  --shadow-lg:0 1px 2px rgba(17,20,24,.05),0 14px 30px -18px rgba(17,20,24,.22);
  color-scheme:light;
}
/* ============ HALLOWEEN SEASON (auto, Oct 15 - Nov 1) ============ */
:root[data-season="halloween"]{ --accent:#ff7a18; --accent-bright:#ff9a40; --accent-soft:#36220f; --accent-ink:#160c04; }
:root[data-season="halloween"][data-theme="light"]{ --accent:#c85a0b; --accent-bright:#a94808; --accent-soft:#ffe8d2; --accent-ink:#ffffff; }
:root[data-season="halloween"] body{ background:radial-gradient(1200px 520px at 108% -8%,rgba(124,58,237,.18),transparent 58%),radial-gradient(1000px 480px at -8% 108%,rgba(255,122,24,.13),transparent 58%),var(--bg); background-attachment:fixed; }
:root[data-season="halloween"] .mark{ background:linear-gradient(145deg,#ff7a18,#8b3df0); color:#fff; }
.cobweb{position:fixed;top:0;width:128px;height:128px;z-index:2;pointer-events:none;opacity:.3;color:var(--ink-2)}
.cobweb svg{width:100%;height:100%;display:block;stroke:currentColor;stroke-width:1;fill:none}
.cobweb.l{left:238px}.cobweb.r{right:0;transform:scaleX(-1)}
body.phone .cobweb.l{left:0}
@media(max-width:700px){.cobweb{width:84px;height:84px;opacity:.22}}
.bday-banner{margin-bottom:16px;border-radius:var(--radius);border:1px solid color-mix(in srgb,#e4b53c 45%,var(--line));background:linear-gradient(120deg,color-mix(in srgb,#e4b53c 14%,var(--surface)),var(--surface));padding:13px 16px;display:flex;gap:11px;align-items:center}
.bday-banner .bd-ic{color:#e4b53c;display:inline-flex;flex:0 0 auto}
.bday-banner .bd-ic svg{width:20px;height:20px}
.bday-banner b{color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14.5px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:"DM Sans",system-ui,sans-serif;margin:0;line-height:1.14;text-wrap:balance;letter-spacing:-.02em;font-weight:600}
.mono{font-variant-numeric:tabular-nums}
svg.glyph{width:1em;height:1em;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ============ SHELL ============ */
.wrap{max-width:1120px;margin:0 auto;padding:0}
.layout{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:238px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:50}
.sb-head{display:flex;align-items:center;gap:11px;padding:17px 16px 10px}
.mark{width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:"DM Sans";font-weight:700;font-size:14px;letter-spacing:-.02em}
.sb-head h1{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-head .sub{font-size:10px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chiprow{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 10px}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.chip.gold{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sb-nav{flex:1;overflow-y:auto;padding:2px 10px 14px}
.sb-nav::-webkit-scrollbar{width:0}
.sb-group{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:13px 10px 5px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;border:none;background:none;cursor:pointer;font-family:"DM Sans",sans-serif;font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:left;transition:.12s;margin-bottom:1px}
.sb-item:hover{background:var(--surface-2);color:var(--ink)}
.sb-item.active{background:var(--accent-soft);color:var(--accent)}
.sb-item .ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-3);flex:0 0 auto}
.sb-item:hover .ic{color:var(--ink-2)}
.sb-item.active .ic{color:var(--accent)}
.sb-foot{padding:11px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.sb-foot .fresh{font-size:10px;color:var(--ink-3);line-height:1.35;min-width:0}
.sb-foot .fresh b{color:var(--ink-2);font-weight:600}
.tbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.15s;flex:0 0 auto}
.tbtn:hover{color:var(--ink);border-color:var(--line-2)}
/* content */
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topslim{display:none;position:sticky;top:0;z-index:40;align-items:center;gap:11px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hamb{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;flex:0 0 auto}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49}
main{padding:24px 24px 72px;min-height:60vh}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;height:100dvh;width:min(300px,84vw);overflow:hidden;overscroll-behavior:contain;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px)}
  .sb-nav{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
  .sb-item{min-height:44px;font-size:15px;touch-action:manipulation}
  .sb-foot{padding-bottom:calc(11px + env(safe-area-inset-bottom,0px))}
  body.navopen{overflow:hidden}
  body.navopen .sidebar{transform:none}
  body.navopen .sb-overlay{display:block}
  .topslim{display:flex}
  main{padding:18px 15px 70px}
}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* section head */
.shead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.shead h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.shead .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.shead .note{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.sub-h{font-family:"DM Sans";font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-2);margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:16px 18px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-teams{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

/* KPI tile */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.kpi .k-val{font-family:"DM Sans";font-weight:900;font-size:30px;letter-spacing:-.03em;margin-top:7px;line-height:1}
.kpi .k-val small{font-size:14px;font-weight:700;color:var(--ink-2)}
.kpi .k-sub{font-size:12px;color:var(--ink-2);margin-top:5px}
.kpi.hot{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.kpi.hot .k-label{color:var(--accent)}
.kpi.hot .k-val{color:var(--accent)}

/* badges / team */
.tb{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  font-family:"DM Sans";font-weight:600;font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1.5px solid var(--line-2);letter-spacing:0}
.tb.lg{width:44px;height:44px;border-radius:11px;font-size:15px}
.tb.xl{width:60px;height:60px;border-radius:14px;font-size:20px}
.teamline{display:flex;align-items:center;gap:10px;min-width:0}
.teamline .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamline .ow{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tables */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);text-align:right;
  font-family:"DM Sans";font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:first-child,tbody td:first-child{text-align:left}
thead th.no-sort{cursor:default}
thead th .ar{color:var(--accent);font-size:9px;margin-left:2px}
tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
tbody td.lead{font-weight:700}
tr.me{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
tr.me:hover{background:var(--accent-soft)}
.rankcol{color:var(--ink-3);font-weight:700;width:26px}
.rankcol.top{color:var(--accent)}
.playoff-line td{border-bottom:2px dashed var(--accent)!important}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;letter-spacing:.02em}
.pill.w{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win)}
.pill.l{background:color-mix(in srgb,var(--loss) 15%,transparent);color:var(--loss)}
.pill.t{background:color-mix(in srgb,var(--tie) 18%,transparent);color:var(--tie)}
.pill.pos{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.live{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--loss);display:inline-block;vertical-align:middle;margin-right:3px;animation:pulse 1.4s ease-in-out infinite}
.pill.prog{background:color-mix(in srgb,var(--t-amber) 16%,transparent);color:var(--t-amber);border:1px solid color-mix(in srgb,var(--t-amber) 35%,transparent)}
.progdot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;vertical-align:middle;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.lowbar{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;margin-bottom:18px;border-radius:var(--radius);border:1px solid var(--line);border-left:3px solid var(--loss);background:var(--surface);padding:16px 18px;box-shadow:var(--shadow)}
.lb-main{display:flex;gap:14px;align-items:center;flex:1 1 300px;min-width:0}
.lb-ico{font-size:34px;flex:0 0 auto;line-height:1}
.lb-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--loss)}
.lb-team{font-family:"DM Sans",sans-serif;font-weight:900;font-size:clamp(22px,5vw,30px);letter-spacing:-.02em;margin-top:2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lb-score{font-family:"DM Sans",monospace;font-size:14px;font-weight:600;color:var(--ink-2)}
.lb-sub{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.lb-tally{flex:0 1 270px;border-left:1px solid var(--line);padding-left:16px}
.lb-tally-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:7px}
.lb-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2.5px 0}
.lb-row .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .amt{margin-left:auto;font-family:"DM Sans",monospace;font-weight:700;color:var(--loss);white-space:nowrap}
.lb-cta{flex-basis:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:15px;padding-top:15px;border-top:1px solid color-mix(in srgb,var(--loss) 25%,var(--line))}
.lb-cta-txt{font-family:"DM Sans",sans-serif;font-weight:800;font-size:clamp(16px,2.6vw,21px);color:var(--ink);flex:1;min-width:180px;letter-spacing:-.01em}
.lb-cta-btn{font-family:"DM Sans",sans-serif;font-weight:800;font-size:14px;padding:11px 22px;border-radius:10px;border:none;background:linear-gradient(150deg,var(--accent-bright),var(--accent));color:var(--accent-ink);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:.12s}
.lb-cta-btn:hover{filter:brightness(1.06)}
@media(max-width:560px){.lb-tally{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:12px;flex-basis:100%}}
.tag-qb{color:#c65b7c}.tag-rb{color:#2f9e5c}.tag-wr{color:#3b7dd8}.tag-te{color:#e0932f}.tag-k{color:#7b5ea7}.tag-dst{color:#8a7a2f}
.posbadge{font-family:"DM Sans";font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--line)}

/* empty state */
.empty{text-align:center;padding:44px 24px;border:1.5px dashed var(--line-2);border-radius:var(--radius);
  background:var(--surface);color:var(--ink-2)}
.empty .ico{font-size:30px;margin-bottom:9px;color:var(--ink-3);display:flex;justify-content:center}
.empty .ico svg{width:30px;height:30px;stroke-width:1.6}
.empty h3{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px}
.empty p{max-width:420px;margin:0 auto;font-size:13.5px}

/* matchup card */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.mrow .sc{margin-left:auto;font-family:"DM Sans";font-weight:600;font-size:16px;color:var(--ink-2)}
.mrow.wn .nm{font-weight:800}.mrow.wn .sc{color:var(--ink)}
.mrow.wn::before{content:"";width:3px;height:22px;background:var(--accent);border-radius:2px;margin-right:-4px}
.vs{font-family:"DM Sans";font-size:10px;font-weight:700;color:var(--ink-3);text-align:center;letter-spacing:.1em;padding:2px 0}

/* draft board */
.board{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);max-height:78vh}
.board table{font-size:11.5px;border-collapse:separate;border-spacing:0}
.board thead th{position:sticky;top:0;z-index:3;text-align:center;padding:7px 6px;min-width:104px;background:var(--surface-2)}
.board tbody th{position:sticky;left:0;z-index:2;background:var(--surface-2);text-align:center;font-family:"DM Sans";
  font-weight:800;color:var(--ink-2);padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.pick{padding:5px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;line-height:1.25}
.pick .pn{font-family:"DM Sans";font-size:9px;color:var(--ink-3)}
.pick .pl{font-weight:600;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:98px}
.pick .pp{font-size:9.5px}
.pick.me{background:var(--accent-soft)}

/* select */
.wkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:5px 10px;border-radius:6px;font-family:"DM Sans";font-weight:600;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:.12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
select{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink)}
input.txt{font-family:inherit;font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
input.txt:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font-family:"DM Sans",sans-serif;font-weight:700;font-size:13px;padding:10px 18px;border-radius:9px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-bright)}
.btn:disabled{opacity:.5;cursor:default}
.fieldlbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);display:block;margin-bottom:4px}

/* bars */
.barrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.barrow .bl{width:118px;flex:0 0 auto;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrk{flex:1;height:9px;background:var(--surface-2);border-radius:100px;overflow:hidden}
.barfil{height:100%;border-radius:100px;background:var(--accent);opacity:.9}
.barrow .bv{width:52px;text-align:right;font-family:"DM Sans";font-size:12px;color:var(--ink-2)}

/* misc */
.metricnote{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dotc{width:9px;height:9px;border-radius:3px}
.helpbox{background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 16px;font-size:13px;color:var(--ink-2);display:flex;gap:11px;align-items:flex-start}
.helpbox b{color:var(--ink)}
.helpbox .hi{font-size:18px;flex:0 0 auto;color:var(--accent);display:inline-flex;align-items:center}
.helpbox .hi svg{width:18px;height:18px}
.matrix{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.matrix table{font-size:11px}
.matrix td,.matrix th{text-align:center;padding:6px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.matrix .diag{background:var(--surface-3)}
.foot{text-align:center;color:var(--ink-3);font-size:12px;padding:26px 0 0;line-height:1.6}
.foot b{color:var(--ink-2)}
/* live-update toast */
.toast{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-size:13px;font-weight:600;
  padding:10px 15px;border-radius:10px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);
  pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:none}
@media(max-width:640px){
  .league-id h1{font-size:15px}.chiprow{display:none}
  .shead h2{font-size:20px}.kpi .k-val{font-size:25px}
  .fresh{display:none}
}

/* ============ SECTION TONES — a few distinct colors for content (sidebar untouched) ============ */
:root{ --t-blue:#6ea8ff; --t-teal:#3fd0bd; --t-violet:#b493ff; --t-coral:#ff9470; --t-amber:#f5c04f; }
:root[data-theme="light"]{ --t-blue:#2563c9; --t-teal:#0f8a7d; --t-violet:#7444c8; --t-coral:#cf5230; --t-amber:#a46d00; }
#app .shead .eyebrow{color:var(--tone,var(--accent))}
#app .sub-h{color:var(--tone,var(--ink-2))}
#app .sub-h::after{background:color-mix(in srgb,var(--tone,var(--line)) 30%,var(--line))}
#app .kpi{border-color:color-mix(in srgb,var(--tone,var(--line)) 28%,var(--line));
  background:linear-gradient(170deg,color-mix(in srgb,var(--tone,transparent) 8%,var(--surface)),var(--surface) 70%)}
#app .kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--tone,transparent)}
#app .kpi .k-label{color:var(--tone,var(--ink-3))}
#app .kpi .k-label span{color:inherit!important}
#app .kpi .k-val{color:color-mix(in srgb,var(--tone,var(--ink)) 72%,var(--ink))}
#app .card{border-color:color-mix(in srgb,var(--tone,var(--line)) 20%,var(--line))}
#app .card .k-label{color:var(--tone,var(--ink-3))}
#app .twrap thead th{background:color-mix(in srgb,var(--tone,var(--surface-2)) 10%,var(--surface-2));color:color-mix(in srgb,var(--tone,var(--ink-2)) 75%,var(--ink-2))}
#app .mcard{border-color:color-mix(in srgb,var(--tone,var(--line)) 22%,var(--line))}
#app .barfil{background:var(--tone,var(--accent))}
#app .helpbox{background:color-mix(in srgb,var(--tone,var(--accent)) 8%,var(--surface));border-color:color-mix(in srgb,var(--tone,var(--accent)) 28%,transparent)}
#app .helpbox .hi{color:var(--tone,var(--accent))}
#app .metricnote b{color:color-mix(in srgb,var(--tone,var(--ink)) 65%,var(--ink))}

/* ============ TICKER: last update + next kickoff ============ */
.ticker{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.tk{flex:1 1 250px;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid color-mix(in srgb,var(--tk) 28%,var(--line));background:color-mix(in srgb,var(--tk) 7%,var(--surface))}
.tk .tk-ico{color:var(--tk);font-size:18px;display:flex;flex:0 0 auto}
.tk .tk-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--tk)}
.tk .tk-v{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.3;font-variant-numeric:tabular-nums}
.tk .tk-s{font-size:11.5px;color:var(--ink-3)}
.tk-upd{--tk:var(--t-teal)} .tk-kick{--tk:var(--t-blue)} .tk-kick.live{--tk:var(--loss)}
.cd .u{font-size:.7em;color:var(--ink-3);margin:0 4px 0 1px;font-weight:600}
.newchip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:100px;
  background:var(--t-teal);color:var(--bg);margin-left:7px;vertical-align:1px}
@keyframes updFlash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--t-teal) 60%,transparent)}
  45%{box-shadow:0 0 0 10px color-mix(in srgb,var(--t-teal) 0%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes updText{0%,100%{color:inherit}30%{color:var(--t-teal)}}
.tk-upd.flash{animation:updFlash 1.3s ease-out 2}
.tk-upd.flash .tk-v{animation:updText 2.6s ease-in-out 1}
.sb-foot .fresh.flash b,.sb-foot .fresh.flash .ts{animation:updText 1.3s ease-in-out 2}
@keyframes scoreFlash{0%{background:color-mix(in srgb,var(--t-teal) 40%,transparent)}100%{background:transparent}}
.sc.changed{border-radius:5px;padding:0 3px;animation:scoreFlash 2.6s ease-out 1}

/* ============ EXPLAINERS ============ */
.explain{border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--tone,var(--t-violet)) 26%,var(--line));
  background:color-mix(in srgb,var(--tone,var(--t-violet)) 6%,var(--surface));padding:13px 16px;margin:0 0 16px;font-size:13px;color:var(--ink-2)}
.explain summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--tone,var(--t-violet));list-style:none;display:flex;align-items:center;gap:8px}
.explain summary::-webkit-details-marker{display:none}
.explain summary::after{content:"+";margin-left:auto;font-weight:700;font-size:16px}
.explain[open] summary::after{content:"–"}
.explain .ex-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:11px}
.explain .ex-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.explain .ex-item h4{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:3px;display:flex;align-items:center;gap:7px}
.explain .ex-item p{margin:0;font-size:12.5px;line-height:1.5}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
.stack{display:flex;height:9px;border-radius:100px;overflow:hidden;background:var(--surface-2)}
.stack span{height:100%}
.pw-break{display:flex;gap:4px 11px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:4px}
.pw-break span{display:inline-flex;align-items:center;gap:4px}
.pw-break b{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ============ RECORD BOOK ============ */
.g-rec{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rec .k-val small{margin-left:4px}
.rec .vsline{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;min-width:0}
.rec .vsline .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink)}
.rec .vsline .sc2{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec .vsline.win .sc2{color:var(--win)} .rec .vsline.lose .sc2{color:var(--loss)}
.rec .vsline .tb{width:24px;height:24px;font-size:9.5px;border-radius:6px}
.rec .rec-foot{font-size:11.5px;color:var(--ink-3);margin-top:7px;border-top:1px solid var(--line);padding-top:7px}
.rec .k-val{margin:6px 0 10px}
.lbrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.lbrow:last-child{border-bottom:none}

/* ============ CHAT ============ */
.chat{display:flex;flex-direction:column;height:min(70vh,660px);min-height:380px;overflow:hidden}
.chat-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.chat-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--bg)}
.msg .bub{min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:7px 11px;max-width:min(560px,85%)}
.msg .who{font-size:11.5px;font-weight:800}
.msg .when{font-size:10.5px;color:var(--ink-3);margin-left:7px}
.msg .txt{font-size:14px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bub{border-radius:12px 4px 12px 12px;background:color-mix(in srgb,var(--t-blue) 13%,var(--surface));border-color:color-mix(in srgb,var(--t-blue) 30%,var(--line))}
.daysep{align-self:center;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:4px 0}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-form textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:14px;padding:9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);max-height:120px}
.chat-form textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);padding:5px 10px;font-size:12px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-3)}
.chat-note{padding:9px 16px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);background:var(--surface-2)}

/* ============ STALE DATA WARNING ============ */
.tk-upd.stale{--tk:var(--t-amber)}

/* ============ WIN PROBABILITY ============ */
.wp{display:flex;height:7px;border-radius:100px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.wp span{height:100%}
.wp .wp-a{background:var(--t-coral)} .wp .wp-h{background:var(--t-blue);flex:1}
.wp-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.wp-l b{color:var(--ink-2)}
.wpmini{font-size:10.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;margin-top:1px}

/* ============ PLAYOFF ODDS ============ */
.oddbar{flex:1;height:9px;background:var(--surface-2);border-radius:100px;overflow:hidden;min-width:60px}
.oddbar span{display:block;height:100%;background:var(--tone,var(--accent));border-radius:100px}
.tag-in{color:var(--win);font-weight:700}.tag-out{color:var(--loss);font-weight:700}

/* ============ RECAP ============ */
.recap-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.recap-row:last-child{border-bottom:none}
.recap-row .rl{width:128px;flex:0 0 auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tone,var(--ink-3))}
.recap-row .rv{min-width:0;flex:1}
.recap-row .rv .nm{font-weight:700}
.recap-row .rn{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ============ CALCULATOR ============ */
.calc-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cplayer{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.cplayer .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cplayer input{width:64px;font:inherit;font-size:13px;padding:5px 7px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.cplayer input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cplayer .fixed{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.st{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:100px;white-space:nowrap}
.st-done{background:var(--surface-2);color:var(--ink-3)}
.st-live{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.st-pre{background:color-mix(in srgb,var(--t-blue) 16%,transparent);color:var(--t-blue)}
.st-bye{background:var(--surface-2);color:var(--ink-3)}
.calc-sum{font-size:14px;line-height:1.55}
.calc-sum .big{font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keypad button{font:inherit;font-size:17px;font-weight:700;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.keypad button:hover{background:var(--surface-3)}
.keypad button.op{color:var(--t-blue)}
.keypad button.eq{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.calc-disp{width:100%;font:inherit;font-size:22px;font-weight:700;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.calc-res{text-align:right;font-size:13px;color:var(--ink-3);min-height:20px;margin-top:4px;font-variant-numeric:tabular-nums}

/* ============ NAV BADGE ============ */
.nbadge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:100px;background:var(--loss);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nbadge[hidden]{display:none}

/* ============ PHONE LAYOUT (body.phone: small screen or phone browser) ============ */
.bnav{display:none}
body.phone .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{touch-action:manipulation;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:var(--ink-3);font:inherit;font-size:10.5px;font-weight:700;padding:5px 0;cursor:pointer;position:relative}
.bnav button svg{width:21px;height:21px}
.bnav button.active{color:var(--accent)}
.bnav .nbadge{position:absolute;top:0;left:calc(50% + 6px);margin:0;height:16px;min-width:16px;font-size:9.5px}
body.phone main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px))}
body.phone .topslim{padding-top:calc(10px + env(safe-area-inset-top,0px))}
body.phone .ticker{gap:8px;margin-bottom:14px}
body.phone .tk{flex-basis:100%;padding:8px 11px;gap:10px}
body.phone .tk .tk-v{font-size:14px}
body.phone .tk .tk-s{font-size:11px}
body.phone .shead{flex-wrap:wrap;gap:4px 12px;margin-bottom:12px}
body.phone .shead h2{font-size:21px}
body.phone .shead .note{margin-left:0;flex-basis:100%}
body.phone .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body.phone .kpi{padding:12px 13px}
body.phone .kpi .k-val{font-size:23px}
body.phone .g-2,body.phone .g-rec{grid-template-columns:minmax(0,1fr)}
body.phone .card-p{padding:13px 14px}
body.phone table{font-size:12.5px}
body.phone tbody td,body.phone thead th{padding:8px 9px}
body.phone .twrap .teamline .ow{display:none}
body.phone .pwcard{flex-wrap:wrap;gap:10px}
body.phone .pwcard .pwbar{width:100%!important;max-width:none!important;order:5}
body.phone .lowbar{padding:13px 14px}
body.phone .chat{height:calc(100dvh - 300px);min-height:340px}
body.phone .seg button{padding:7px 10px}
body.phone .helpbox{padding:11px 13px;font-size:12.5px}
body.phone .recap-row{flex-wrap:wrap;row-gap:2px}body.phone .recap-row .rl{width:100%}
body.phone .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px));right:12px;left:12px;justify-content:center}

/* ============ MATCHUP DETAIL (sheet over the page) ============ */
body.mdl-open{overflow:hidden}
.mdl{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto;overscroll-behavior:contain}
.mdl-box{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:min(820px,100%);padding:16px 18px 20px;animation:fade .2s ease}
.mdl-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mdl-top .x{margin-left:auto;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.mdl-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mdl-score .side{display:flex;align-items:center;gap:10px;min-width:0}
.mdl-score .side.r{flex-direction:row-reverse;text-align:right}
.mdl-score .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.lu{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.lu td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.lu td.slot{text-align:center;width:48px;color:var(--ink-3);font-size:10.5px;font-weight:800;letter-spacing:.05em}
.lu td.pts{width:58px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lu td.pts.l{text-align:left}
.lu td.pts small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3)}
.lu .pl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.lu .sub{font-size:10.5px;color:var(--ink-3)}
.lu td.r{text-align:right}
.lu .won{color:var(--win)}
.lu-bench{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.lu-bench .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.lu{table-layout:fixed}
.lu .pl{max-width:100%}
.lu .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdl-score .side>div{min-width:0}
.mdl-score .nm,.mdl-score .ow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.phone .mdl{padding:0}
body.phone .lu{font-size:12px}
body.phone .lu td{padding:6px 3px}
body.phone .lu td.pts{width:44px}
body.phone .lu td.slot{width:34px;font-size:9.5px}
body.phone .lu .sub{white-space:normal}
body.phone .lu .sub .st{font-size:8.5px;padding:1px 4px}
body.phone .mdl-score{gap:6px}
body.phone .mdl-score .tb.lg{width:34px;height:34px;font-size:11px}
body.phone .mdl-score .nm{font-size:13px}
body.phone .mdl-box{border-radius:0;min-height:100%;width:100%;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
body.phone .mdl-score .big{font-size:22px}
[data-mid]{cursor:pointer}

/* ============ TEAM TREND CHART ============ */
.trend{width:100%;height:auto;display:block}
.trend text{font-size:11px;fill:var(--ink-3);font-family:inherit}
.trend .ttl{fill:var(--ink-2);font-weight:700}
.rankchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rankchips span{font-size:11.5px;padding:3px 8px;border-radius:100px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.rankchips .up{color:var(--win)}.rankchips .dn{color:var(--loss)}

/* ============ BLACKJACK ============ */
.felt{border-radius:var(--radius);padding:18px;background:radial-gradient(ellipse at top,color-mix(in srgb,#1f8a4c 55%,var(--surface)),color-mix(in srgb,#0e4d2b 70%,var(--bg)));border:1px solid color-mix(in srgb,#1f8a4c 40%,var(--line));color:#f2f5f0}
.felt .lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.cards{display:flex;gap:8px;flex-wrap:wrap;min-height:92px;align-items:center}

/* ---------- stat engine ---------- */
function computeStats(maxWeek){
  const N=D.teams.length;
  const played=D.schedule.filter(m=>m.winner && m.winner!=="UNDECIDED" && (maxWeek==null||m.week<=maxWeek));
  const weeks=[...new Set(played.map(m=>m.week))].sort((a,b)=>a-b);
  const S={};
  D.teams.forEach(t=>{S[t.id]={id:t.id,team:t,w:0,l:0,tie:0,pf:0,pa:0,scores:[],weekly:{},opp:{},
    results:[],aw:0,al:0,at:0,expW:0,aboveMed:0,close_w:0,close_l:0,blowW:0,blowL:0,margins:[]};});
  // per-matchup
  played.forEach(m=>{
    const h=S[m.homeTeamId], a=S[m.awayTeamId];
    if(!h||!a) return;
    h.pf+=m.homeScore; h.pa+=m.awayScore; a.pf+=m.awayScore; a.pa+=m.homeScore;
    h.scores.push(m.homeScore); a.scores.push(m.awayScore);
    h.weekly[m.week]=m.homeScore; a.weekly[m.week]=m.awayScore;
    h.opp[m.week]=m.awayTeamId; a.opp[m.week]=m.homeTeamId;
    const mg=m.homeScore-m.awayScore, am=Math.abs(mg);
    h.margins.push(mg); a.margins.push(-mg);
    let hr,ar;
    if(m.winner==="HOME"||(m.winner!=="TIE"&&mg>0)){h.w++;a.l++;hr="W";ar="L";}
    else if(m.winner==="AWAY"||(m.winner!=="TIE"&&mg<0)){a.w++;h.l++;hr="L";ar="W";}
    else{h.tie++;a.tie++;hr="T";ar="T";}
    h.results.push({wk:m.week,r:hr,pf:m.homeScore,pa:m.awayScore,opp:m.awayTeamId});
    a.results.push({wk:m.week,r:ar,pf:m.awayScore,pa:m.homeScore,opp:m.homeTeamId});
    if(am<=10){if(hr==="W"){h.close_w++;a.close_l++;}else if(hr==="L"){h.close_l++;a.close_w++;}}
    if(am>=40){if(hr==="W"){h.blowW++;a.blowL++;}else if(hr==="L"){h.blowL++;a.blowW++;}}
  });
  // all-play + expected wins + above median (per week)
  weeks.forEach(wk=>{
    const scs=played.filter(m=>m.week===wk).flatMap(m=>[[m.homeTeamId,m.homeScore],[m.awayTeamId,m.awayScore]]);
    const vals=scs.map(x=>x[1]).sort((a,b)=>a-b);
    const med=vals.length?(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2):0;
    scs.forEach(([id,sc])=>{
      let beat=0,lostto=0,tied=0;
      scs.forEach(([id2,sc2])=>{if(id2===id)return; if(sc>sc2)beat++;else if(sc<sc2)lostto++;else tied++;});
      const st=S[id]; if(!st)return;
      st.aw+=beat; st.al+=lostto; st.at+=tied;
      const denom=(scs.length-1)||1; st.expW+=beat/denom;
      if(sc>med) st.aboveMed++;
    });
  });
  // derived
  Object.values(S).forEach(s=>{
    const g=s.w+s.l+s.tie;
    s.gp=g; s.pct=g?(s.w+s.tie*0.5)/g:0;
    s.ppg=g?s.pf/g:0; s.papg=g?s.pa/g:0;
    s.hi=s.scores.length?Math.max(...s.scores):null;
    s.lo=s.scores.length?Math.min(...s.scores):null;
    s.avg=s.scores.length?s.scores.reduce((a,b)=>a+b,0)/s.scores.length:0;
    s.std=s.scores.length>1?Math.sqrt(s.scores.reduce((a,b)=>a+(b-s.avg)**2,0)/s.scores.length):0;
    s.cv=s.avg?s.std/s.avg*100:0;
    s.apPct=(s.aw+s.al+s.at)?(s.aw+s.at*0.5)/(s.aw+s.al+s.at):0;
    s.luck=s.w-s.expW;
    s.avgMargin=s.margins.length?s.margins.reduce((a,b)=>a+b,0)/s.margins.length:0;
    // streak
    let st=0,ty="";
    for(let i=s.results.length-1;i>=0;i--){const r=s.results[i].r;if(i===s.results.length-1){ty=r;st=1;}else if(r===ty)st++;else break;}
    s.streak=s.results.length?ty+st:"—";
  });
  // strength of schedule (avg opp ppg over all opponents faced)
  Object.values(S).forEach(s=>{
    const ops=s.results.map(r=>S[r.opp]).filter(Boolean);
    s.sos=ops.length?ops.reduce((a,o)=>a+o.ppg,0)/ops.length:0;
  });
  return {S,played,weeks,N,started:played.length>0};
}
let ST = computeStats();

/* ---------- power ranking ---------- */
function powerRanks(){
  const arr=Object.values(ST.S);
  if(!ST.started){
    // preseason: use ESPN draft-day projected rank (1=best)
    return D.teams.map(t=>({team:t,score:null,proj:t.draftProjRank||99}))
      .sort((a,b)=>a.proj-b.proj).map((x,i)=>({...x,rank:i+1}));
  }
  const maxPpg=Math.max(...arr.map(s=>s.ppg),1);
  const scored=arr.map(s=>{
    const recent=s.results.slice(-3);
    const rf=recent.length?recent.reduce((a,r)=>a+r.pf,0)/recent.length:s.ppg;
    const parts={rec:s.pct*100*0.40, sc:(s.ppg/maxPpg)*100*0.30, ap:s.apPct*100*0.18, rf:(rf/maxPpg)*100*0.12};
    const power=parts.rec+parts.sc+parts.ap+parts.rf;
    return {team:s.team,score:power,s,parts,rf};
  }).sort((a,b)=>b.score-a.score);
  return scored.map((x,i)=>({...x,rank:i+1}));
}

function dayRecap(){
  if(!ST.started) return "";
  const pg=D.meta.proGames||{}, now=Date.now();
  const ln=new Set();
  Object.entries(pg).forEach(([ab,k])=>{const h=(now-k)/3600e3; if(h>2&&h<30)ln.add(ab);});
  if(!ln.size) return "";
  const wk=String(D.meta.currentScoringPeriod||"");
  const wkly=(D.weekly||{})[wk]; if(!wkly) return "";
  const perf=[];
  D.teams.forEach(t=>{(wkly[String(t.id)]||[]).forEach(r=>{const pid=r[0],slot=r[1],pts=r[2];
    if(slot===20||slot===21) return;
    if(ln.has((D.players[pid]||[])[2])) perf.push({pid,pts,t,pos:(D.players[pid]||[])[1]});});});
  if(perf.length<3) return "";
  perf.sort((a,b)=>b.pts-a.pts);
  const studs=perf.slice(0,4);
  const nfl=D.meta.nflGames||{};
  let label=""; for(const ab of ln){const g=nfl[ab]; if(g&&g.opp&&ln.has(g.opp)){label=ab+" vs "+g.opp; break;}}
  if(!label) label=[...ln].join(" · ");
  const prow=o=>`<div style="display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)"><span class="posbadge tag-${(o.pos||"").toLowerCase()}">${esc(o.pos)}</span><span style="flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pname(o.pid))} <span style="color:var(--ink-3);font-weight:400">${esc((D.players[o.pid]||[])[2])}</span></span><span style="font-size:11px;color:var(--ink-3)">${esc(o.t.name)}</span><span class="num" style="font-weight:700;width:46px;text-align:right">${fmt(o.pts,1)}</span></div>`;
  let h=`<div class="card card-p" style="margin-bottom:16px"><div class="sub-h" style="margin-top:0">Latest game day <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">${esc(label)}</span></div>`;
  h+=`<div class="k-label" style="color:var(--win);margin:0 0 2px">Top performers</div>${studs.map(prow).join("")}`;
  if(perf.length>=7){const duds=perf.slice(-2).reverse(); if(duds[0].pts<studs[studs.length-1].pts) h+=`<div class="k-label" style="color:var(--loss);margin:10px 0 2px">Started &amp; struggled</div>${duds.map(prow).join("")}`;}
  return h+`</div>`;
}
function recapCard(){

  const hi=P.slice().sort((a,b)=>b.sc-a.sc)[0],lo=P.slice().sort((a,b)=>a.sc-b.sc)[0];

  if(bench&&bench.left>0)h+=row("Most left on bench",`<span class="nm">${esc(bench.t.name)}</span> <span style="color:var(--ink-3)">best possible lineup was ${fmt(bench.left,1)} pts better</span>`,fmt(bench.left,1));

function gamesToWatch(wk,pr){
  const rank={}; pr.forEach(r=>rank[r.team.id]=r.rank);

    const h=teamById[x.homeTeamId],a=teamById[x.awayTeamId]; if(!h||!a) return null;

    const s=mstate(x);

    const hR=rank[h.id]||99,aR=rank[a.id]||99, powerFav=hR<=aR?h.id:a.id;

  }).filter(Boolean);

    const wp=winProb(g.x);

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><span style="font-size:11px;color:var(--ink-3)">${sub}</span>${tag}</div>
      <div class="mrow ${g.s.aw?"wn":""}" style="padding:2px 0">${badge(g.a)}<span class="nm" style="font-size:13px">${esc(g.a.name)}</span><span class="sc">${as}</span></div>
      <div class="mrow ${g.s.hw?"wn":""}" style="padding:2px 0">${badge(g.h)}<span class="nm" style="font-size:13px">${esc(g.h.name)}</span><span class="sc">${hs}</span></div>
      ${wp?`<div class="wpmini">win chance ${Math.round(wp.pa*100)}% · ${Math.round(wp.ph*100)}%</div>`:""}

let standSort={key:"pct",dir:-1};
VIEWS.standings=function(){
  let html=shead("Regular Season","Standings",ST.started?"Click a column to sort":"Records populate after Week 1");
  if(!ST.started){
    html+=`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("bars")}</span><div>Everyone starts <b>0–0</b>. Once I pull Week&nbsp;1 results, this table ranks by record, points for/against, and streak — with the playoff cut line after the top ${D.meta.playoffTeamCount}.</div></div>`;
  }
  const rows=Object.values(ST.S);
  const cols=[["team","Team",0],["w","W",1],["l","L",1],["tie","T",1],["pct","PCT",1],["pf","PF",1],["pa","PA",1],["ppg","PPG",1],["papg","PA/G",1],["streak","STRK",0],["luck","LUCK",1]];
  rows.sort((a,b)=>{
    let k=standSort.key,va=a[k],vb=b[k];
    if(k==="streak"){va=streakNum(a);vb=streakNum(b);}
    if(k==="team"){va=a.team.name.toLowerCase();vb=b.team.name.toLowerCase();return va<vb?-standSort.dir:va>vb?standSort.dir:0;}
    const primary=(va-vb)*standSort.dir;
    if(primary!==0) return primary;
    return b.pf-a.pf;   // tiebreaker: total points scored (season PF), higher ranks higher
  });
  if(!ST.started) rows.sort((a,b)=>(a.team.draftProjRank||99)-(b.team.draftProjRank||99));
  html+=`<div class="twrap"><table><thead><tr><th class="no-sort">#</th>`+
    cols.map(c=>`<th data-k="${c[0]}">${c[1]}${standSort.key===c[0]?` <span class="ar">${standSort.dir<0?"▼":"▲"}</span>`:""}</th>`).join("")+`</tr></thead><tbody>`;
  rows.forEach((s,i)=>{
    const isCut=ST.started&&i===D.meta.playoffTeamCount-1;
    html+=`<tr class="${s.id===MEID?"me":""} ${isCut?"playoff-line":""}">
      <td class="rankcol ${i<3?"top":""}">${i+1}</td>
      <td>${teamLine(s.team)}</td>
      <td class="lead num">${s.w}</td><td class="num">${s.l}</td><td class="num">${s.tie}</td>

      <td class="num">${ST.started?fmt(s.ppg,1):"—"}</td><td class="num">${ST.started?fmt(s.papg,1):"—"}</td>
      <td>${ST.started?streakPill(s.streak):"—"}</td>
      <td class="num" style="color:${s.luck>0?"var(--win)":s.luck<0?"var(--loss)":"var(--ink-2)"}">${ST.started?(s.luck>0?"+":"")+fmt(s.luck,1):"—"}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=`<div class="metricnote"><b>Ranked by record, then total points (PF) as the tiebreaker.</b> <b>PCT</b> win % (ties½). <b>PF/PA</b> total points for/against. <b>PPG</b> points per game. <b>PA/G</b> points opponents scored per game. <b>STRK</b> current streak (W3 = won the last 3). <b>LUCK</b> = actual wins minus expected wins. Expected wins: each week, the share of the other 11 teams a score would have beaten (beat 8 of 11 = 0.73 wins), added up. Positive means a team has won more than its scoring "deserved". The dashed line is the playoff cut (top ${D.meta.playoffTeamCount}).</div>`;
  const v=el(html);
  v.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(standSort.key===k)standSort.dir*=-1;else{standSort.key=k;standSort.dir=(k==="team")?1:-1;}setTab("standings");});
  return v;
};
function streakNum(s){if(!s.streak||s.streak==="—")return 0;const n=parseInt(s.streak.slice(1))||0;return s.streak[0]==="W"?n:-n;}

VIEWS.power=function(){
  const pr=powerRanks();
  let html=shead("Composite Rating","Power Rankings",ST.started?"":"Preseason projection");
  if(!ST.started){
    html+=`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("zap")}</span><div>Before games are played, this shows ESPN's <b>draft-day projected finish</b>. Once the season starts, it switches to a live composite rating — explained below.</div></div>`;
  } else {
    html+=`<div class="helpbox" style="margin-bottom:16px"><span class="hi">${icon("zap")}</span><div><b>How the rating works:</b> a 0&ndash;100 composite that blends four factors, so no team can ride a soft schedule or one big week to the top:<br>
      &bull; <b>40% &mdash; Win record:</b> actual winning percentage (W&#8209;L).<br>
      &bull; <b>30% &mdash; Scoring:</b> points per game, scaled against the league's top scorer.<br>
      &bull; <b>18% &mdash; All&#8209;play strength:</b> your record if you played every other team every week &mdash; rewards teams the schedule has treated unfairly.<br>
      &bull; <b>12% &mdash; Recent form:</b> average points over the last 3 weeks (who's hot right now).</div></div>`;
    html+=powerExplainer(pr);
  }
  const maxScore=Math.max(...pr.map(r=>r.score||0),1);

/* ---------- scoring model shared by win probability + playoff odds ---------- */
function ncdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}

/* ---------- exact clinch / elimination (max-flow over every possible remaining result) ---------- */
// wins: {id: wins so far}; games: [[homeId, awayId], ...] still to play; P: playoff spots.
// Eliminated = in EVERY possible outcome at least P other teams finish with strictly more wins.
// Clinched   = in EVERY possible outcome fewer than P other teams finish with at least as many wins.
// Ties on wins are decided by points, which can't be known ahead, so both checks assume the tie goes against the team.
function maxFlow(n,cap,s,t){
  let flow=0;const par=new Array(n);
  for(;;){
    par.fill(-1);par[s]=s;const q=[s];
    for(let qi=0;qi<q.length&&par[t]<0;qi++){const u=q[qi];const row=cap[u];for(let v=0;v<n;v++)if(par[v]<0&&row[v]>0){par[v]=u;q.push(v);}}
    if(par[t]<0)return flow;
    let f=Infinity;for(let v=t;v!==s;v=par[v])f=Math.min(f,cap[par[v]][v]);
    for(let v=t;v!==s;v=par[v]){cap[par[v]][v]-=f;cap[v][par[v]]+=f;}
    flow+=f;
  }
}
function subsetsOf(arr,k,fn){const pick=[];const rec=i=>{if(pick.length===k){return fn(pick.slice());}
  for(let j=i;j<=arr.length-(k-pick.length);j++){pick.push(arr[j]);if(rec(j+1))return true;pick.pop();}return false;};return rec(0);}
// can the games among `others` be decided so team x gets at most lim[x] more wins (lim Infinity = no limit)?
function canCap(others,games,lim){
  const g=games.filter(([a,b])=>others.includes(a)&&others.includes(b));
  if(!g.length)return true;
  const n=2+g.length+others.length,s=0,t=n-1,cap=Array.from({length:n},()=>new Array(n).fill(0));
  g.forEach(([a,b],i)=>{cap[s][1+i]=1;cap[1+i][1+g.length+others.indexOf(a)]=1;cap[1+i][1+g.length+others.indexOf(b)]=1;});
  others.forEach((x,j)=>{cap[1+g.length+j][t]=lim[x]===Infinity?g.length:Math.max(0,lim[x]);});
  return maxFlow(n,cap,s,t)===g.length;

// can the games among `others` give every team x at least need[x] more wins?
function canReach(others,games,need){
  const total=others.reduce((a,x)=>a+need[x],0);if(!total)return true;
  const g=games.filter(([a,b])=>others.includes(a)&&others.includes(b));
  const n=2+g.length+others.length,s=0,t=n-1,cap=Array.from({length:n},()=>new Array(n).fill(0));
  g.forEach(([a,b],i)=>{cap[s][1+i]=1;cap[1+i][1+g.length+others.indexOf(a)]=1;cap[1+i][1+g.length+others.indexOf(b)]=1;});
  others.forEach((x,j)=>{cap[1+g.length+j][t]=need[x];});

  const free=others.filter(x=>!forced.includes(x)),k=P-1-forced.length;

  const ok=subsetsOf(free,Math.min(k,free.length),S=>{

function isClinched(T,ids,wins,games,P){

  const rest=games.filter(([a,b])=>a!==T&&b!==T);

/* ---------- playoff odds: simulate the rest of the regular season ---------- */
let __ODDS=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function playoffOdds(){
  if(__ODDS&&__ODDS.key===D.meta.lastUpdated)return __ODDS.v;
  const N=5000,ids=D.teams.map(t=>t.id),P=D.meta.playoffTeamCount||6,RS=D.meta.regularSeasonWeeks||14;
  const rem=D.schedule.filter(x=>x.week<=RS&&!(x.winner&&x.winner!=="UNDECIDED")).map(x=>({x,g:gameModel(x)})).filter(o=>o.g);
  let seed=0;for(const c of String(D.meta.lastUpdated))seed=(seed*31+c.charCodeAt(0))|0;
  const rnd=mulberry(seed),gauss=()=>{let u=0,v=0;while(!u)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const R={};ids.forEach(id=>R[id]={po:0,top2:0,first:0,w:0});
  for(let n=0;n<N;n++){
    const w={},pf={};ids.forEach(id=>{const s=ST.S[id];w[id]=s.w+s.tie*0.5;pf[id]=s.pf;});
    for(const o of rem){const hs=o.g.mh+o.g.sh*gauss(),as=o.g.ma+o.g.sa*gauss();
      pf[o.x.homeTeamId]+=hs;pf[o.x.awayTeamId]+=as;
      if(hs>as)w[o.x.homeTeamId]++;else if(as>hs)w[o.x.awayTeamId]++;else{w[o.x.homeTeamId]+=.5;w[o.x.awayTeamId]+=.5;}}
    const ord=ids.slice().sort((a,b)=>(w[b]-w[a])||(pf[b]-pf[a]));
    ord.forEach((id,i)=>{const r=R[id];r.w+=w[id];if(i<P)r.po++;if(i<2)r.top2++;if(i===0)r.first++;});
  }
  const games=id=>ST.S[id].gp+rem.filter(o=>o.x.homeTeamId===id||o.x.awayTeamId===id).length;
  // exact checks over every possible result of the remaining games (not the simulation)
  const wins={};ids.forEach(id=>{const s=ST.S[id];wins[id]=s.w+s.tie*0.5;});
  const left=rem.map(o=>[o.x.homeTeamId,o.x.awayTeamId]);
  const v=ids.map(id=>{const r=R[id],g=games(id),ew=r.w/N;
    return {id,team:teamById[id],po:r.po/N,top2:r.top2/N,first:r.first/N,ew,el:g-ew,
      clinched:isClinched(id,ids,wins,left,P),eliminated:isEliminated(id,ids,wins,left,P)};})
    .sort((a,b)=>(b.po-a.po)||(b.ew-a.ew));
  __ODDS={key:D.meta.lastUpdated,v:{rows:v,N,remaining:rem.length,P}};return __ODDS.v;
}

/* ---------- lineups: points left on the bench (needs weekly data from the cron) ---------- */
function hasWeekly(){return !!(D.weekly&&D.players&&Object.keys(D.weekly).length);}
function ppos(pid){return ((D.players||{})[pid]||[])[1]||"?";}
function pname(pid){return ((D.players||{})[pid]||[])[0]||("Player "+pid);}
function lineupSplit(rows){
  // league lineup: QB, 2 RB, 2 WR, TE, FLEX (RB/WR/TE), D/ST, K; bench and IR don't score
  const act=rows.filter(r=>r[1]!==20&&r[1]!==21).reduce((a,r)=>a+r[2],0);
  const by={};rows.filter(r=>r[1]!==21).forEach(r=>{(by[ppos(r[0])]=by[ppos(r[0])]||[]).push(r[2]);});
  Object.values(by).forEach(a=>a.sort((x,y)=>y-x));
  let opt=0;const take=(p,n)=>{const a=by[p]||[];opt+=a.splice(0,n).reduce((s,v)=>s+v,0);};
  take("QB",1);take("RB",2);take("WR",2);take("TE",1);
  const flex=[...(by.RB||[]),...(by.WR||[]),...(by.TE||[])].sort((x,y)=>y-x);opt+=flex[0]||0;
  take("DST",1);take("K",1);
  return {act,opt,left:Math.max(0,opt-act)};
}
function lineupStats(){
  if(!hasWeekly())return null;
  const R={};D.teams.forEach(t=>R[t.id]={team:t,act:0,opt:0,left:0,worst:null,weeks:0});
  ST.weeks.forEach(w=>{const wk=D.weekly[String(w)];if(!wk)return;
    D.teams.forEach(t=>{const rows=wk[String(t.id)];if(!rows)return;const s=lineupSplit(rows),r=R[t.id];
      r.act+=s.act;r.opt+=s.opt;r.left+=s.left;r.weeks++;if(!r.worst||s.left>r.worst.left)r.worst={wk:w,left:s.left};});});
  return Object.values(R).map(r=>({...r,eff:r.opt?r.act/r.opt:0}));
}
/* ---------- waiver pickups: points scored as a starter since joining ---------- */
function pickupStats(){
  if(!hasWeekly()||!D.faab)return null;
  const out=[];
  D.faab.teams.forEach(ft=>{const t=teamById[ft.teamId];if(!t)return;
    ft.pickups.forEach(p=>{let st=0,bn=0,gs=0;

        if(!r)return;if(r[1]!==20&&r[1]!==21){st+=r[2];gs++;}else bn+=r[2];});

function draftBoard(){
  const rounds=Math.max(...D.draft.map(p=>p.round));
  // order teams by round-1 pick order
  const r1=D.draft.filter(p=>p.round===1).sort((a,b)=>a.pickInRound-b.pickInRound);

  let h=`<div class="board"><table><thead><tr><th style="left:0;position:sticky;z-index:4">RD</th>`;

  h+=`</tr></thead><tbody>`;
  for(let r=1;r<=rounds;r++){
    h+=`<tr><th>${r}</th>`;
    // snake: even rounds reverse
    const ord=r%2===1?teamOrder:[...teamOrder].reverse();
    // but keep columns aligned to teamOrder; fill by team

  return h;
}

function olStrength(tid){
  const roster=D.rosters[tid]||[];
  const byPos={QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  roster.forEach(p=>{if(byPos[p.pos])byPos[p.pos].push(playerSeason(p.playerId).avg);});
  for(const k in byPos)byPos[k].sort((a,b)=>b-a);
  const sum=(a,n)=>a.slice(0,n).reduce((x,y)=>x+y,0);
  const qb=sum(byPos.QB,1),rb=sum(byPos.RB,2),wr=sum(byPos.WR,2),te=sum(byPos.TE,1),k=sum(byPos.K,1),dst=sum(byPos.DST,1);
  const flex=Math.max(byPos.RB[2]||0,byPos.WR[2]||0,byPos.TE[1]||0,0);
  return {qb,rb,wr,te,flex,k,dst,total:qb+rb+wr+te+flex+k+dst};
}
VIEWS.outlook=function(){

  const sd=D.teams.map(t=>{

    const opps=fut.map(x=>x.homeTeamId===t.id?x.awayTeamId:x.homeTeamId).map(id=>S[id]?S[id].ppg:null).filter(v=>v);
    const avg=opps.length?opps.reduce((a,b)=>a+b,0)/opps.length:0;
    return {t,n:fut.length,avg};
  }).filter(x=>x.n>0).sort((a,b)=>a.avg-b.avg);
  if(sd.length){
    const mn=Math.min(...sd.map(x=>x.avg)),mx=Math.max(...sd.map(x=>x.avg));
    html+=`<div class="sub-h">Rest-of-Season Schedule <span style="font-weight:400;font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0">avg PPG of remaining opponents — lower is easier</span></div>`;

    sd.forEach((x,i)=>{const frac=mx>mn?(x.avg-mn)/(mx-mn):0.5;const col=frac<0.34?"var(--win)":frac<0.67?"var(--t-amber)":"var(--loss)";const lab=frac<0.34?"Easy":frac<0.67?"Average":"Tough";
      html+=`<tr><td class="rankcol ${i<3?"top":""}">${i+1}</td><td style="text-align:left">${teamLine(x.t)}</td><td class="num">${x.n}</td><td class="num" style="font-weight:700">${fmt(x.avg,1)}</td><td style="text-align:left;min-width:150px"><div style="display:flex;align-items:center;gap:9px"><div class="bartrk" style="flex:1;max-width:110px"><div class="barfil" style="width:${Math.max(8,frac*100)}%;background:${col};opacity:.85"></div></div><b style="color:${col};font-size:12px;width:60px">${lab}</b></div></td></tr>`;});
    html+=`</tbody></table></div><div class="metricnote">Remaining regular-season games only. Opponent strength is their season scoring average, so it re-ranks every week.</div>`;
  }

  // 1b) bye-week planner
  const byeW=D.meta.byeWeeks||{};
  const upByeWeeks=[...new Set(Object.values(byeW))].filter(w=>w>(D.meta.currentScoringPeriod||1)&&w<=lastReg).sort((a,b)=>a-b);
  if(upByeWeeks.length){
    const tbp=D.teams.map(t=>{
      const starters=(D.rosters[t.id]||[]).filter(p=>p.slot!=="BE"&&p.slot!=="IR");
